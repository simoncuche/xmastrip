    if (lenC === 2) return null;
    const target = lenC === 0 ? 0 : 500;
    return new Promise((resolve) => {
      const st = { seats, total: [0, 0], deals: 0, match: false, announcer: 0, busy: false, closed: false };
      const html = `<div class="panel jass"><div class="panel-head"><h2>Schieber</h2><span class="sub">${target ? 'bis 500' : 'ein Spiel'}</span><button class="x-btn" data-close aria-label="Aufgeben">×</button></div>
        <div class="panel-body"><div class="jass-top"><div class="tafel"><span>Wir <b id="jWe">0</b></span><span>Sie <b id="jThey">0</b></span><span style="opacity:.75">Spiel <b id="jRound">0 : 0</b></span></div><div class="trumpf" id="jTrump">Trumpf: –</div></div>
        <div class="jtable" id="jTable">
          <div class="seat top" id="seat2"><canvas width="64" height="64"></canvas><div><div>${seats[2].name}</div><div class="backs" id="b2"></div></div></div>
          <div class="seat left" id="seat3"><canvas width="64" height="64"></canvas><div>${seats[3].name}</div><div class="backs" id="b3"></div></div>
          <div class="seat right" id="seat1"><canvas width="64" height="64"></canvas><div>${seats[1].name}</div><div class="backs" id="b1"></div></div>
          <div class="trick" id="jTrick"></div>
        </div>
        <div class="jass-msg" id="jMsg"></div><div class="jass-actions" id="jAct"></div><div class="hand" id="jHand"></div></div></div>`;
      const o = UI.overlay(html, () => { st.closed = true; resolve(null); });
      [1, 2, 3].forEach((i) => { const c = o.querySelector(`#seat${i} canvas`).getContext('2d'); c.imageSmoothingEnabled = false; c.drawImage(portraitCanvas(seats[i].look, FRIENDS[seats[i].id] ? FRIENDS[seats[i].id].bg : '#2a3a52'), 0, 0); });
      const $j = (s) => o.querySelector(s);
      const msg = (t) => { $j('#jMsg').innerHTML = t; };
      const cardHTML = (c, cls = '', attrs = '') => `<button class="card ${cls} ${G.S.flags.deck === 'fr' && c.s < 2 ? 'red' : ''}" ${attrs} aria-label="${suitName(c.s)} ${rankLbl(c.r)}"><span class="r">${rankLbl(c.r)}</span><span class="s">${suitSvg(c.s)}</span><span class="r2">${rankLbl(c.r)}</span></button>`;
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      let H = [[], [], [], []], trick = [], mode = null, played = [], tricksWon = [0, 0], pts = [0, 0], announcerTeam = 0;
      const renderBacks = () => { for (const i of [1, 2, 3]) $j('#b' + i).innerHTML = '<i></i>'.repeat(H[i].length); };
      const renderTrick = () => { $j('#jTrick').innerHTML = trick.map((t) => cardHTML(t.c, 'p' + t.p, 'tabindex="-1"')).join(''); };
      const sortHand = (h) => h.sort((a, b) => (a.s - b.s) || (a.r - b.r));
      const renderHand = (legalSet, onPick) => {
        const h = $j('#jHand');
        h.innerHTML = H[0].map((c, i) => cardHTML(c, legalSet ? (legalSet.has(c) ? 'ok' : 'no') : '', `data-i="${i}"`)).join('');
        if (onPick) h.querySelectorAll('.card.ok').forEach((b) => b.addEventListener('click', () => onPick(H[0][+b.dataset.i])));
      };
      const setTurn = (p) => { [1, 2, 3].forEach((i) => $j('#seat' + i).classList.toggle('turn', i === p)); };
      const tafel = () => { $j('#jWe').textContent = st.total[0]; $j('#jThey').textContent = st.total[1]; $j('#jRound').textContent = `${pts[0]} : ${pts[1]}`; $j('#jTrump').innerHTML = mode ? `Trumpf: ${mode.type === 'trump' ? suitSvg(mode.s) : ''} <b>${modeName(mode)}</b>` : 'Trumpf: –'; };
      const deal = () => {
        const deck = [];
        for (let s = 0; s < 4; s++) for (let r = 0; r < 9; r++) deck.push({ s, r });
        for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
        H = [0, 1, 2, 3].map((p) => sortHand(deck.slice(p * 9, p * 9 + 9)));
        trick = []; played = []; tricksWon = [0, 0]; pts = [0, 0]; mode = null;
        Snd.sfx('card');
      };
      const evalModes = (h) => {
        const res = [];
        for (let s = 0; s < 4; s++) {
          let v = 0;
          for (const c of h) {
            if (c.s === s) v += { 5: 9, 3: 7, 8: 4, 7: 2.5, 6: 2, 4: 2 }[c.r] || 1.2;
            else if (c.r === 8) v += 1.6;
            else if (c.r === 7 && h.some((x) => x.s === c.s && x.r === 8)) v += 0.6;
          }
          v += h.filter((c) => c.s === s).length * 0.8;
          res.push({ m: { type: 'trump', s }, v });
        }
        let ob = 0, un = 0;
        for (let s = 0; s < 4; s++) {
          const rs = h.filter((c) => c.s === s).map((c) => c.r).sort((a, b) => b - a);
          let k = 8; for (const r of rs) { if (r === k) { ob += r === 8 ? 5 : 3; k--; } else break; }
          const rsu = rs.slice().sort((a, b) => a - b);
          k = 0; for (const r of rsu) { if (r === k) { un += r === 0 ? 5 : 3; k++; } else break; }
        }
        res.push({ m: { type: 'obe' }, v: ob + 2 }, { m: { type: 'unde' }, v: un + 2 });
        res.sort((a, b) => b.v - a.v);
        return res[0];
      };
      const chooseHuman = (canPush) => new Promise((res) => {
        const act = $j('#jAct');
        const btn = (lbl, v) => { const b = document.createElement('button'); b.className = 'btn'; b.innerHTML = lbl; b.onclick = () => { act.innerHTML = ''; res(v); }; act.appendChild(b); };
        for (let s = 0; s < 4; s++) btn(`${suitSvg(s)}${suitName(s)}`, { type: 'trump', s });
        btn('▼ Obenabe', { type: 'obe' }); btn('▲ Undenufe', { type: 'unde' });
        if (canPush) btn('Schieben →', 'push');
        renderHand(null);
      });
      const bock = (c) => {
        if (mode.type === 'trump' && c.s === mode.s) { for (let r = 0; r < 9; r++) if (TRUMP_RANK[r] > TRUMP_RANK[c.r] && !played.some((x) => x.s === c.s && x.r === r)) return false; return true; }
        const higher = mode.type === 'unde' ? (r) => r < c.r : (r) => r > c.r;
        for (let r = 0; r < 9; r++) if (higher(r) && !played.some((x) => x.s === c.s && x.r === r)) return false;
        return true;
      };
      const aiPick = (p) => {
        const hand = H[p], L = JassRules.legal(hand, trick, mode);
        if (L.length === 1) return L[0];
        const team = p % 2, T = mode.type === 'trump' ? mode.s : -1;
        const P = (c) => JassRules.pts(c, mode);
        const low = (arr) => arr.slice().sort((a, b) => (P(a) - P(b)) || ((a.s === T) - (b.s === T)) || (JassRules.power(a, mode, a.s) - JassRules.power(b, mode, b.s)))[0];
        if (!trick.length) {
          if (T >= 0 && team === announcerTeam) {
            const my = hand.filter((c) => c.s === T);
            const left = 9 - played.filter((c) => c.s === T).length - my.length;
            if (left > 0 && my.some((c) => c.r === 5 || (c.r === 3 && bock(c)))) return my.sort((a, b) => TRUMP_RANK[b.r] - TRUMP_RANK[a.r])[0];
          }
          const bocks = L.filter((c) => c.s !== T && bock(c));
          if (bocks.length) return bocks.sort((a, b) => P(b) - P(a))[0];
          const nonT = L.filter((c) => c.s !== T && P(c) < 10);
          return low(nonT.length ? nonT : L);
        }
        const lead = trick[0].c.s;
        const wi = JassRules.winner(trick, mode);
        const winCard = trick[wi].c, winSeat = trick[wi].p;
        const partnerWins = winSeat % 2 === team;
        const last = trick.length === 3;
        const wp = JassRules.power(winCard, mode, lead);
        const beating = L.filter((c) => JassRules.power(c, mode, lead) > wp);
        const tp = trick.reduce((s, t) => s + P(t.c), 0);
        if (partnerWins && (last || bock(winCard))) {
          const sm = L.filter((c) => !(c.s === T && (c.r === 5 || c.r === 3)));
          return (sm.length ? sm : L).sort((a, b) => P(b) - P(a))[0];
        }
        if (beating.length) {
          const cheapest = beating.sort((a, b) => JassRules.power(a, mode, lead) - JassRules.power(b, mode, lead))[0];
          if (last && (tp > 0 || trick.length === 3)) return cheapest;
          const safe = beating.filter((c) => bock(c));
          if (safe.length && tp >= 3) return safe.sort((a, b) => P(a) - P(b))[0];
          if (tp >= 10 && !(cheapest.s === T && cheapest.r === 5 && tp < 14)) return cheapest;
        }
        return low(L);
      };
      const playCard = async (p, c) => {
        H[p].splice(H[p].indexOf(c), 1);
        trick.push({ p, c }); played.push(c);
        Snd.sfx('card'); renderTrick(); renderBacks();
        if (p === 0) renderHand(null);
      };
      const humanTurn = () => new Promise((res) => {
        const L = new Set(JassRules.legal(H[0], trick, mode));
        msg(trick.length ? 'Du bist dran.' : 'Du spielst aus.');
        renderHand(L, (c) => res(c));
      });
      const runDeal = async () => {
        deal(); renderBacks(); renderTrick(); tafel();
        const ann = st.announcer;
        announcerTeam = ann % 2;
        if (ann === 0) {
          msg('Du sagst Trumpf an.');
          renderHand(null);
          let ch = await chooseHuman(true);
          if (st.closed) return;
          if (ch === 'push') {
            msg(`Du schiebst zu ${seats[2].name}…`); await wait(800);
            ch = evalModes(H[2]).m;
            msg(`${seats[2].name}: „${modeName(ch)}!“`);
          }
          mode = ch;
        } else {
          setTurn(ann);
          msg(`${seats[ann].name} überlegt…`); await wait(900);
          let best = evalModes(H[ann]);
          if (best.v < 17) {
            const pp = (ann + 2) % 4;
            msg(`${seats[ann].name} schiebt!`); await wait(800);
            if (pp === 0) { msg('Geschoben – du musst ansagen.'); mode = await chooseHuman(false); if (st.closed) return; }
            else { best = evalModes(H[pp]); mode = best.m; msg(`${seats[pp].name}: „${modeName(mode)}!“`); }
          } else { mode = best.m; msg(`${seats[ann].name}: „${modeName(mode)}!“`); }
        }
        tafel(); await wait(900);
        let leader = ann;
        for (let k = 0; k < 9; k++) {
          trick = []; renderTrick();
          for (let j = 0; j < 4; j++) {
            if (st.closed) return;
            const p = (leader + j) % 4;
            setTurn(p);
            let c;
            if (p === 0) c = await humanTurn();
            else { await wait(520 + Math.random() * 380); c = aiPick(p); }
            if (st.closed) return;
            await playCard(p, c);
          }
          const wi = JassRules.winner(trick, mode);
          const w = trick[wi].p;
          let tp = trick.reduce((s, t) => s + JassRules.pts(t.c, mode), 0);
          if (k === 8) tp += 5;
          pts[w % 2] += tp; tricksWon[w % 2]++;
          msg(`${w === 0 ? 'Du nimmst' : seats[w].name + ' nimmt'} den Stich (${tp} Punkte).`);
          tafel();
          await wait(1100);
          leader = w;
        }
        let matchTeam = -1;
        if (tricksWon[0] === 9) { pts[0] += 100; matchTeam = 0; } if (tricksWon[1] === 9) { pts[1] += 100; matchTeam = 1; }
        st.total[0] += pts[0]; st.total[1] += pts[1]; st.deals++;
        if (matchTeam === 0) st.match = true;
        trick = []; renderTrick(); tafel(); setTurn(-1);
        msg(`${matchTeam === 0 ? '<b>MATCH!</b> ' : matchTeam === 1 ? '<b>Match für die anderen…</b> ' : ''}Spiel: Wir ${pts[0]} – Sie ${pts[1]}.`);
        Snd.sfx(pts[0] > pts[1] ? 'win' : 'lose');
        st.announcer = (st.announcer + 1) % 4;
      };
      (async () => {
        while (!st.closed) {
          await runDeal();
          if (st.closed) return;
          const done = !target || st.total[0] >= target || st.total[1] >= target;
          const act = $j('#jAct');
          await new Promise((r) => { act.innerHTML = ''; const b = document.createElement('button'); b.className = 'btn primary'; b.textContent = done ? 'Fertig' : 'Nächstes Spiel'; b.onclick = () => { act.innerHTML = ''; r(); }; act.appendChild(b); });
          if (done) {
            const win = st.total[0] > st.total[1];
            st.closed = true;
            UI._ovClose = null;
            UI.closeOverlay();
            resolve({ win, match: st.match, deals: st.deals });
            return;
          }
        }
      })();
    });
  },
};

/* ============ Minispiele ============ */
const Mini = {
  key: null,
  frame(title, sub, inner) {
    return `<div class="panel mini"><div class="panel-head"><h2>${title}</h2><span class="sub" id="miniSub">${sub || ''}</span><button class="x-btn" id="miniX" aria-label="Abbrechen">×</button></div><div class="panel-body">${inner}</div></div>`;
  },
  run(title, sub, inner, W, H, setup) {
    return new Promise((resolve) => {
      let done = false, raf = 0;
      const finish = (v) => { if (done) return; done = true; cancelAnimationFrame(raf); Mini.key = null; UI.closeOverlay(); resolve(v); };
      const o = UI.overlay(Mini.frame(title, sub, inner), () => { if (!done) { done = true; cancelAnimationFrame(raf); Mini.key = null; resolve(null); } });
      o.querySelector('#miniX').onclick = () => finish(null);
      const cv = o.querySelector('canvas');
      const ctx = cv ? cv.getContext('2d') : null;
      if (cv) { cv.width = W; cv.height = H; ctx.imageSmoothingEnabled = false; }
      const api = { o, cv, ctx, finish, sub: (t) => { o.querySelector('#miniSub').innerHTML = t; }, t0: performance.now() };
      const tick = setup(api);
      let last = performance.now();
      const loop = (now) => { if (done) return; const dt = Math.min(0.05, (now - last) / 1000); last = now; tick(dt, (now - api.t0) / 1000); raf = requestAnimationFrame(loop); };
      raf = requestAnimationFrame(loop);
    });
  },
  wob() { const p = G.S.st.prom; return 1 + Math.max(0, p - 0.4) * 1.4 + (G.S.st.energy < 25 ? 0.5 : 0); },

  /* ---------- Darts ---------- */
  darts(opp) {
    const SEG = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
    const CX = 80, CY = 66, RAD = 54;
    const score = (x, y) => {
      const dx = x - CX, dy = y - CY, r = Math.hypot(dx, dy) / RAD;
      if (r > 1) return { v: 0, t: 'daneben' };
      if (r < 0.045) return { v: 50, t: 'BULL!', bull: 1 };
      if (r < 0.1) return { v: 25, t: 'Single Bull' };
      let a = Math.atan2(dx, -dy) * 180 / Math.PI; if (a < 0) a += 360;
      const seg = SEG[Math.floor(((a + 9) % 360) / 18)];
      if (r > 0.47 && r < 0.53) return { v: seg * 3, t: 'Triple ' + seg };
      if (r > 0.94) return { v: seg * 2, t: 'Double ' + seg };
      return { v: seg, t: '' + seg };
    };
    const [bc, bx] = canvas(160, 132);
    for (let y = 0; y < 132; y++) for (let x = 0; x < 160; x++) {
      const dx = x - CX, dy = y - CY, r = Math.hypot(dx, dy) / RAD;
      if (r > 1.18) continue;
      if (r > 1) { P(bx, x, y, '#1a1a1a'); continue; }
      let a = Math.atan2(dx, -dy) * 180 / Math.PI; if (a < 0) a += 360;
      const si = Math.floor(((a + 9) % 360) / 18);
      const dark = si % 2 === 0;
      let c = dark ? '#1d1d1f' : '#efe4c8';
      if ((r > 0.47 && r < 0.53) || r > 0.94) c = dark ? '#c8302a' : '#2a8a3a';
      if (r < 0.1) c = '#2a8a3a';
      if (r < 0.045) c = '#c8302a';
      P(bx, x, y, c);
    }
    for (let i = 0; i < 20; i++) { const a = (i * 18) * Math.PI / 180; const tx = CX + Math.sin(a) * (RAD + 6) - 3, ty = CY - Math.cos(a) * (RAD + 6) - 2; pxText(bx, SEG[i], Math.round(tx - (SEG[i] > 9 ? 2 : 0)), Math.round(ty), '#f2eee4'); }
    return this.run('Darts', opp ? `gegen ${opp.name}` : 'Training', `<canvas aria-label="Dartscheibe"></canvas><div class="mini-bar"><span id="dInfo">Tippe oder drück A, wenn das Fadenkreuz richtig steht.</span><b id="dScore">0</b></div><button class="btn primary" id="dThrow">Werfen</button>`, 160, 132, (api) => {
      const st = { round: 1, dart: 0, me: 0, opp: 0, darts: [], turn: 'me', t: 0, msg: '', aiT: 0, bull: false, phase: 'aim', wait: 0 };
      const amp = 22 * Mini.wob();
      const throwIt = () => {
        if (st.turn !== 'me' || st.phase !== 'aim') return;
        const ax = CX + Math.sin(st.t * 1.7) * amp + Math.sin(st.t * 4.1) * amp * 0.25, ay = CY + Math.sin(st.t * 2.3 + 1) * amp * 0.8;
        const n = 2 + G.S.st.prom * 3;
        const hx = ax + rnd(-n, n), hy = ay + rnd(-n, n);
        const s = score(hx, hy);
        st.darts.push({ x: hx, y: hy, me: 1 }); st.me += s.v; st.dart++; if (s.bull) st.bull = true;
        Snd.sfx('dart'); st.msg = s.t + (s.v ? ` (+${s.v})` : '');
        if (st.dart >= 3) { st.turn = opp ? 'opp' : 'next'; st.dart = 0; st.wait = 1.1; }
      };
      api.o.querySelector('#dThrow').onclick = throwIt;
      api.cv.addEventListener('pointerdown', throwIt);
      Mini.key = (k) => { if (['Space', 'Enter', 'KeyE'].includes(k)) throwIt(); };

        for (const d of st.darts) { R(c, d.x - 1, d.y - 1, 3, 3, d.me ? '#ffb53d' : '#7ad0f0'); R(c, d.x + 1, d.y - 4, 1, 3, '#e8e8e8'); }
        if (st.wait > 0) { st.wait -= dt; if (st.wait <= 0) { if (st.turn === 'next') { st.round++; st.darts = []; st.turn = 'me'; } else if (st.turn === 'opp') st.phase = 'ai'; } }
        if (st.turn === 'me' && st.phase === 'aim' && st.wait <= 0) {
          const ax = CX + Math.sin(st.t * 1.7) * amp + Math.sin(st.t * 4.1) * amp * 0.25, ay = CY + Math.sin(st.t * 2.3 + 1) * amp * 0.8;
          R(c, ax - 5, ay, 4, 1, '#ffffff'); R(c, ax + 2, ay, 4, 1, '#ffffff'); R(c, ax, ay - 5, 1, 4, '#ffffff'); R(c, ax, ay + 2, 1, 4, '#ffffff'); P(c, ax, ay, '#ff3a3a');
        }
        if (st.phase === 'ai') {
          st.aiT -= dt;
          if (st.aiT <= 0) {
            const skill = opp.fn === 'saeufer' ? 9 - Math.min(4, G.S.st.prom * 2) : 11;
            const tx = CX + rnd(-skill, skill), ty = CY - RAD * 0.5 + rnd(-skill, skill);
            const s = score(tx, ty);
            st.darts.push({ x: tx, y: ty, me: 0 }); st.opp += s.v; st.dart++;

        api.o.querySelector('#dScore').textContent = opp ? `Du ${st.me} · ${opp.name} ${st.opp}` : `${st.me} Punkte`;

  },

  /* ---------- Armdrücken ---------- */
  arm(f) {

      const L = G.S.look, st = G.S.st;
      let factor = [0.86, 1, 1.12, 1.22][L.build] * (0.62 + st.energy / 260);
      if (st.prom > 0.3 && st.prom < 1.1) factor *= 1.08; if (st.prom > 1.7) factor *= 0.85;
      let v = 0, rate = strong ? 0.52 : 0.33, t = 0, started = false, burst = 0;
      const push = () => { if (!started) started = true; v += 0.072 * factor; Snd.sfx('hit'); };
      api.o.querySelector('#aPush').addEventListener('pointerdown', (e) => { e.preventDefault(); push(); });

        v = clamp(v, -1, 1);

        c.drawImage(myL, 0, 0, SPR_W, SPR_H, 8, 30, SPR_W * 1.6, SPR_H * 1.6);
        c.drawImage(opL, 0, 2 * SPR_H, SPR_W, SPR_H, 122, 30, SPR_W * 1.6, SPR_H * 1.6);
        const ang = -Math.PI / 2 + v * 1.2;
        const ex = 80, ey = 70;
        const hx = ex + Math.cos(ang) * 26, hy = ey + Math.sin(ang) * 26;

        c.strokeStyle = skin; c.lineWidth = 7; c.beginPath(); c.moveTo(36, 66); c.lineTo(ex - 4, ey); c.lineTo(hx, hy); c.stroke();
        c.strokeStyle = oskin; c.beginPath(); c.moveTo(124, 66); c.lineTo(ex + 4, ey); c.lineTo(hx + 2, hy); c.stroke();
        E(c, hx, hy, 5, 5, mix(skin, oskin, 0.5));
        R(c, 20, 8, 120, 8, '#1a1a1a'); R(c, 80, 8, Math.round(v * 60), 8, v > 0 ? '#ffb53d' : '#e2554a'); R(c, 79, 6, 2, 12, '#ffffff');
        api.o.querySelector('#aT').textContent = started ? (v > 0 ? 'Du drückst!' : `${f.name} drückt!`) : 'Bereit?';

  /* ---------- Tanzen ---------- */
  dance() {
    const lanes = ['←', '↓', '↑', '→'];

      const beat = 60 / 124;
      const notes = [];
      const r = rng(dayOf(G.S.time) * 13 + Math.floor(G.t));
      for (let b = 4; b < 40; b++) { if (r() < 0.82) notes.push({ t: b * beat, l: Math.floor(r() * 4) }); if (b > 16 && r() < 0.3) notes.push({ t: (b + 0.5) * beat, l: Math.floor(r() * 4) }); }
      const travel = 1.5;
      let win = 0.11, good = 0.19;

        const btn = api.o.querySelector(`[data-l="${l}"]`); btn.classList.add('hit'); setTimeout(() => btn.classList.remove('hit'), 90);
        let best = null, bd = 9;

        if (best && bd < good) { best.done = true; const pf = bd < win; pts += pf ? 100 : 60; judge = pf ? 'PERFEKT!' : 'Gut'; combo++; Snd.tone([523, 587, 659, 784][l], 0.08, 'square', 0.04); }
        else { judge = 'Daneben'; combo = 0; }

      };
      api.o.querySelectorAll('[data-l]').forEach((b) => b.addEventListener('pointerdown', (e) => { e.preventDefault(); hit(+b.dataset.l); }));
      Mini.key = (k) => { const m = { ArrowLeft: 0, KeyA: 0, ArrowDown: 1, KeyS: 1, ArrowUp: 2, KeyW: 2, ArrowRight: 3, KeyD: 3 }; if (k in m) hit(m[k]); };

        const jitter = p > 1.4 ? (p - 1.4) * 3 : 0;

  /* ---------- Nageln ---------- */

        const c = api.ctx;
        R(c, 0, 0, 160, 110, '#5a3a20');
        E(c, 80, 74, 50, 30, '#7a5432'); E(c, 80, 70, 48, 16, '#c89a62'); for (let k = 1; k < 5; k++) E(c, 80, 70, k * 10, k * 3, 'rgba(0,0,0,0)');
        for (let k = 1; k < 5; k++) { c.strokeStyle = '#a8784a'; c.beginPath(); c.ellipse(80, 70, k * 11, k * 3.3, 0, 0, 6.28); c.stroke(); }
        const nail = (x, d, col) => { const h = Math.round(20 * (1 - d)); R(c, x, 70 - h, 2, h, '#9aa0a6'); R(c, x - 2, 70 - h - 1, 6, 2, col); };
        nail(62, me, '#ffb53d'); nail(98, hias, '#7ad0f0');
        if (hammer > 0) { R(c, turn === 'me' ? 66 : 102, 30, 4, 22, '#6a4428'); R(c, turn === 'me' ? 58 : 94, 26, 18, 6, '#3a3c40'); }
        R(c, 20, 8, 120, 8, '#2a1a10');
        R(c, 20 + 60 - (zone * 120) / 2, 8, zone * 120, 8, '#3fae4a');
        const pos = (Math.sin(t * speed * Math.PI) + 1) / 2;
        if (turn === 'me' && wait <= 0) R(c, 20 + pos * 120 - 1, 5, 2, 14, '#ffffff');
        api.o.querySelector('#gInfo').textContent = msg || 'Schlag zu, wenn der Zeiger im grünen Bereich ist!';
        api.o.querySelector('#gS').textContent = `Du ${Math.round(me * 100)} % · Hias ${Math.round(hias * 100)} %`;
        if (me >= 1 && wait <= 0) { Snd.sfx('win'); api.finish(true); }
        else if (hias >= 1 && wait <= 0) { Snd.sfx('lose'); api.finish(false); }
      };
    });
  },

  /* ---------- Steine flitschen ---------- */
  stones() {
    return this.run('Steine flitschen', 'am Inn', `<canvas aria-label="Inn"></canvas><div class="mini-bar"><span id="sInfo">Flacher Winkel = mehr Sprünge. Tippen zum Werfen.</span><b id="sB">Rekord ${G.S.rec.stone}×</b></div><button class="btn primary" id="sThrow">Werfen</button>`, 160, 100, (api) => {
      let t = 0, phase = 'aim', ang = 0, skips = 0, sx = 0, sy = 0, hop = 0, k = 0, tries = 3, best = 0, splashes = [];
      const throwIt = () => {
        if (phase !== 'aim') return;
        const a = (Math.sin(t * 2.2 * Mini.wob()) + 1) / 2;
        ang = a;
        const quality = 1 - Math.min(1, Math.abs(a - 0.18) / 0.5);
        skips = Math.max(0, Math.round(quality * 11 + rnd(-1.5, 1.5) - G.S.st.prom * 1.5));
        phase = 'fly'; sx = 14; sy = 60; k = 0; hop = 0; splashes = []; tries--;
        Snd.sfx('whoosh');
      };
      api.o.querySelector('#sThrow').onclick = throwIt;
      api.cv.addEventListener('pointerdown', throwIt);
      Mini.key = (kk) => { if (['Space', 'Enter', 'KeyE'].includes(kk)) throwIt(); };
      return (dt) => {
        t += dt;
        const c = api.ctx;
        R(c, 0, 0, 160, 40, '#9fc4e2'); for (let x = 0; x < 160; x++) { const h = 8 + Math.abs(Math.sin(x * 0.05)) * 14; R(c, x, 40 - h, 1, h, '#8c8a86'); if (h > 18) P(c, x, 40 - h, '#f2f4f6'); }
        R(c, 0, 34, 160, 6, '#e8b4a0'); for (let x = 0; x < 160; x += 9) R(c, x, 30, 7, 6, PASTELS[(x / 9) % PASTELS.length | 0]);
        R(c, 0, 40, 160, 60, '#2f6e8f'); for (let i = 0; i < 20; i++) R(c, (i * 37 + t * 8) % 160, 45 + (i * 13) % 50, 5, 1, '#5a9ab8');
        R(c, 0, 82, 160, 18, '#9f988c');
        for (const s of splashes) { s.t += dt; E(c, s.x, s.y, 2 + s.t * 8, 1 + s.t * 3, `rgba(220,240,255,${Math.max(0, 0.8 - s.t)})`); }
        if (phase === 'aim') {
          const a = (Math.sin(t * 2.2 * Mini.wob()) + 1) / 2;
          for (let i = 0; i < 20; i++) P(c, 14 + Math.cos(-a * 1.2) * i * 1.5, 70 + Math.sin(-a * 1.2) * i * 1.5, '#ffb53d');
          R(c, 12, 68, 4, 3, '#7a7a7a');
          pxText(c, a < 0.3 ? 'FLACH' : a < 0.55 ? 'MITTEL' : 'STEIL', 40, 88, '#2a2622');
        } else {
          hop += dt * (5 - Math.min(3, k * 0.25));
          const segLen = Math.max(5, 20 - k * 1.6);
          const prog = Math.min(1, hop);
          const x = sx + prog * segLen, y = sy - Math.sin(prog * Math.PI) * Math.max(2, 10 - k);
          R(c, x - 1, y - 1, 3, 2, '#7a7a7a');
          if (hop >= 1) { sx += segLen; hop = 0; k++; splashes.push({ x: sx, y: sy, t: 0 }); Snd.tone(900 + k * 40, 0.04, 'sine', 0.05); if (k > skips) { phase = 'end'; splashes.push({ x: sx, y: sy, t: -0.1 }); Snd.sfx('splash'); best = Math.max(best, skips); api.o.querySelector('#sInfo').textContent = `${skips} × gesprungen!${skips >= 8 ? ' Wahnsinn!' : ''} Noch ${tries} Würfe.`; setTimeout(() => { if (tries > 0) phase = 'aim'; else api.finish(best); }, 1100); } }
        }
        api.o.querySelector('#sB').textContent = `Bester Wurf ${best}× · Rekord ${Math.max(best, G.S.rec.stone)}×`;
      };
    });
  },

  /* ---------- Kicker ---------- */
  kicker(opp) {
    return this.run('Tischfussball', opp ? `gegen ${opp.name}` : 'gegen dich selbst', `<canvas aria-label="Kickertisch"></canvas><div class="mini-bar"><span id="kInfo">Schiess, wenn der Torwart zur Seite rutscht!</span><b id="kS">0 : 0</b></div><button class="btn primary" id="kShot">Schuss!</button>`, 160, 100, (api) => {
      let me = 0, op = 0, t = 0, phase = 'aim', ball = null, msg = '';
      const gk = () => Math.sin(t * 2.4) * 0.8 + Math.sin(t * 5.3) * 0.2;
      const shoot = () => {
        if (phase !== 'aim') return;
        const target = rnd(-0.25, 0.25) + Math.sin(t * 9) * 0.1 * Mini.wob();
        ball = { x: 30, y: 50, ty: 50 + target * 40, goal: Math.abs(gk() - target) > 0.42 };
        phase = 'shot'; Snd.sfx('hit');
      };
      api.o.querySelector('#kShot').onclick = shoot;
      api.cv.addEventListener('pointerdown', shoot);
      Mini.key = (k) => { if (['Space', 'Enter', 'KeyE'].includes(k)) shoot(); };
      return (dt) => {
        t += dt;
        const c = api.ctx;
        R(c, 0, 0, 160, 100, '#5a3a24'); R(c, 6, 6, 148, 88, '#3f8a3a'); R(c, 80, 6, 1, 88, '#e8f0e8'); R(c, 150, 34, 4, 32, '#e8f0e8');
        for (let x = 20; x < 150; x += 26) { R(c, x, 0, 2, 100, '#c9ccd2'); }
        const gy = 50 + gk() * 18;
        R(c, 138, gy - 6, 6, 12, '#2f5fb8'); R(c, 139, gy - 8, 4, 3, '#f2d0b0');
        R(c, 24, 46, 6, 12, '#c8352d'); R(c, 25, 44, 4, 3, '#f2d0b0');
        if (ball) {
          ball.x += dt * 160; ball.y += (ball.ty - ball.y) * dt * 4;
          E(c, ball.x, ball.y, 2, 2, '#ffffff');
          if (ball.x > 146) {
            if (ball.goal) { me++; msg = 'TOR!'; Snd.sfx('cheer'); } else { msg = 'Gehalten!'; }
            ball = null; phase = 'opp';
            setTimeout(() => { const skill = opp && opp.fn === 'frech' ? 0.55 : 0.42; if (Math.random() < skill) { op++; msg = `${opp ? opp.name : 'Gegner'} trifft!`; Snd.sfx('hit'); } else msg = 'Du hältst!'; phase = 'aim'; }, 700);
          }
        }
        api.o.querySelector('#kInfo').textContent = msg || 'Schiess, wenn der Torwart zur Seite rutscht!';
        api.o.querySelector('#kS').textContent = `${me} : ${op}`;
        if (phase === 'aim' && (me >= 3 || op >= 3)) { api.finish(me >= 3); UI.toast(me >= 3 ? `Kicker gewonnen ${me}:${op}!` : `Kicker verloren ${me}:${op}.`); }
      };
    });
  },

  /* ---------- Panorama ---------- */
  panorama(kind) {
    const tower = kind === 'turm';
    return this.run(tower ? 'Blick vom Stadtturm' : 'Fernrohr auf der Seegrube', tower ? '31 m über der Altstadt' : '1.905 m · Blick nach Süden', `<div style="overflow-x:auto;touch-action:pan-x;border-radius:8px"><canvas aria-label="Panorama" style="width:auto;height:240px;max-width:none"></canvas></div><p class="note" id="pInfo">Wisch zur Seite, um dich umzusehen.</p>${!tower && !G.S.photos.seegrube ? '<button class="btn primary" id="pFoto">Foto machen</button>' : ''}<button class="btn" id="pOk">Zurück</button>`, 480, 160, (api) => {
      api.o.querySelector('#pOk').onclick = () => api.finish(true);
      const pf = api.o.querySelector('#pFoto');
      if (pf) pf.onclick = () => { G.photoImg = G.photoImg || {}; G.photoImg.seegrube = api.cv.toDataURL(); addPhoto('seegrube'); pf.remove(); };
      const c = api.ctx;
      const night = isNight();
      const sky = c.createLinearGradient(0, 0, 0, 100);
      sky.addColorStop(0, night ? '#0a1028' : '#7fb2e0'); sky.addColorStop(1, night ? '#28345a' : '#d8eaf4');
      c.fillStyle = sky; c.fillRect(0, 0, 480, 160);
      const ridge = (base, amp, f, col, snow, s) => { for (let x = 0; x < 480; x++) { let v = 0; for (let k = 1; k < 4; k++) v += Math.abs(Math.sin(x / 480 * f * k + s * k)) / k; const y = base - v * amp; R(c, x, y, 1, 160 - y, col); if (snow && v > 1.05) R(c, x, y, 1, 3, night ? '#9aa8c8' : '#f4f6f8'); } };
      if (tower) {
        ridge(70, 34, 7, night ? '#2a3046' : '#8c8a86', true, 1.3);
        ridge(92, 14, 11, night ? '#1a2a24' : '#3a5a34', false, 2);
        for (let i = 0; i < 70; i++) { const x = (i * 53) % 480, w = 14 + (i * 7) % 18, y = 100 + (i * 11) % 40; R(c, x, y, w, 60, night ? '#2a2a3a' : PASTELS[i % PASTELS.length]); R(c, x - 1, y - 6, w + 2, 7, night ? '#3a2a2a' : ROOFS[i % ROOFS.length]); if (night) for (let k = 0; k < 3; k++) if ((i + k) % 2) R(c, x + 3 + k * 4, y + 6, 2, 3, '#ffd27a'); }
        R(c, 228, 92, 20, 30, '#e8b830'); for (let k = 0; k < 10; k++) R(c, 224 + k * 0.6, 84 + k, 28 - k * 1.2, 1, '#f8d860');
        pxText(c, 'GOLDENES DACHL', 200, 76, '#ffffff'); pxText(c, 'NORDKETTE', 60, 24, '#ffffff'); pxText(c, 'SEEGRUBE', 300, 40, '#ffffff'); R(c, 330, 46, 2, 6, '#ffffff');
        pxText(c, 'DOM', 380, 90, '#ffffff'); R(c, 372, 98, 6, 22, '#f0d8b8'); R(c, 390, 98, 6, 22, '#f0d8b8'); E(c, 375, 96, 3, 3, '#5f8a7a'); E(c, 393, 96, 3, 3, '#5f8a7a');
      } else {
        ridge(66, 30, 9, night ? '#2a3046' : '#9aa6b8', true, 0.4);
        ridge(84, 18, 6, night ? '#1e2638' : '#6a7a62', false, 1.9);
        R(c, 0, 112, 480, 48, night ? '#141a2a' : '#7a9a5a');
        R(c, 0, 118, 480, 5, night ? '#20304a' : '#4a8aa8');
        for (let i = 0; i < 260; i++) { const x = (i * 37) % 480, y = 120 + (i * 13) % 38; R(c, x, y, 2, 2, night ? (i % 3 ? '#ffd27a' : '#fff0c0') : (i % 2 ? '#e8d8c0' : '#c8a088')); }
        pxText(c, 'PATSCHERKOFEL', 330, 30, '#ffffff'); pxText(c, 'SERLES', 210, 26, '#ffffff'); pxText(c, 'STUBAIER ALPEN', 40, 22, '#ffffff'); pxText(c, 'INNSBRUCK', 180, 104, '#ffffff'); pxText(c, 'INN', 60, 124, '#ffffff'); pxText(c, 'BERGISEL', 120, 92, '#ffffff'); R(c, 140, 98, 3, 10, '#d8d8d8');
      }
      return () => {};
    });
  },
};

/* ---- 12_main.js ---- */
/* ============ Start & Hauptschleife ============ */
G.mode = 'title';
function isTouch() { return window.matchMedia && (matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window); }

function boot() {
  View.cv = document.getElementById('screen');
  View.ctx = View.cv.getContext('2d');
  [View.wcv, View.wctx] = canvas(320, 200);
  [View.lcv, View.lctx] = canvas(320, 200);
  resizeView();
  window.addEventListener('resize', resizeView);
  UI.init();
  Input.touch = isTouch();
  document.body.classList.toggle('touch', Input.touch);
  wireInput();
  showTitle();
  let last = performance.now(), hudT = 0;
  const loop = (now) => {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (G.mode === 'play' && G.map) {
      try {
        updateWorld(dt);
        renderWorld();
        renderScreen();
      } catch (e) { console.error(e); }
      hudT += dt; if (hudT > 0.5) { hudT = 0; UI.hud(); }
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.mode === 'play') saveGame(true); });
}

function changelogHtml() {
  return CHANGELOG.map((e, i) => `<div class="cl-entry${i === 0 ? ' cur' : ''}"><div class="cl-head"><b>Version ${e.v}</b><span>${e.date}${i === 0 ? ' · aktuell' : ''}</span></div><ul>${e.items.map((x) => `<li>${x}</li>`).join('')}</ul></div>`).join('');
}
function showTitle() {
  const t = document.getElementById('title');
  const save = loadSave();
  t.hidden = false;
  t.innerHTML = `<div class="snow" aria-hidden="true"></div><div class="title-card">
    <div class="lights" aria-hidden="true"></div>
    <p class="title-kicker">❄ Gleis 4 nach Innsbruck · Freitag, 11. Dezember 2026 ❄</p>
    <h1 class="title-name">🎄 Wiehnachtsreisli 2026 <span>nach Innsbruck</span></h1>
    <div class="dep" aria-label="Abfahrt">
      <div class="dep-head"><span>Abfahrt · Luzern · Fr 11.12.2026</span><span>Gleis</span></div>
      <div class="dep-row"><span class="tm">09:10</span><span class="ds">IR 70 Zürich HB<small>weiter mit Railjet nach Innsbruck Hbf, an 13:20</small></span><span class="gl">4</span></div>
      <div class="dep-row"><span class="tm">09:14</span><span class="ds" style="color:var(--ink-dim)">S1 Sursee<small>&nbsp;</small></span><span class="gl" style="background:var(--ink-dim)">1</span></div>
    </div>
    <p class="title-sub">Zwölf Jungs, ein Gruppenbillett, ein Hotel in der Altstadt. Bau dir deinen Charakter, kauf das Billett, erwisch den Zug um 9:10, jass im Zug, finde das Hotel, triff die Kollegen in der Bar – und dann ist Innsbruck dein Spielplatz.</p>
    <div class="title-btns">
      ${save ? `<button class="btn primary" id="tCont">Weiterspielen · ${save.name}, ${dateStr(save.time)} ${clockStr(save.time)}</button>` : ''}
      <button class="btn ${save ? '' : 'primary'}" id="tNew">Neues Spiel</button>
    </div>
    <div class="keys">Tastatur: <kbd>WASD</kbd>/<kbd>Pfeile</kbd> gehen · <kbd>Shift</kbd> rennen · <kbd>E</kbd> Aktion · <kbd>M</kbd> Handy. Am Handy: links ziehen zum Gehen, <kbd>A</kbd> für Aktionen. Läuft komplett im Browser, Spielstand bleibt auf diesem Gerät.</div>
    <div class="version"><span>Version ${APP_VERSION} · ${APP_VERSION_DATE}</span><button class="link" id="tLog" aria-expanded="false">Was ist neu?</button></div>
    <div class="changelog" id="tChangelog" hidden>${changelogHtml()}</div>
  </div>`;
  const logBtn = t.querySelector('#tLog'), logBox = t.querySelector('#tChangelog');
  logBtn.onclick = () => { const open = logBox.hidden; logBox.hidden = !open; logBtn.textContent = open ? 'Historie schliessen' : 'Was ist neu?'; logBtn.setAttribute('aria-expanded', String(open)); if (open) logBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); };
  const cont = t.querySelector('#tCont');
  if (cont) cont.onclick = () => { Snd.init(); startGame(save); };
  t.querySelector('#tNew').onclick = async () => {
    Snd.init();
    t.hidden = true;
    const res = await Editor.open({ mode: 'new', look: randomLook(Math.random, {}) });
    if (!res) { showTitle(); return; }
    const crew = CREW.find((c) => c.id === res.pid);
    const S2 = newState(res.look, crew.name);
    S2.pid = res.pid;
    S2.flags.crewSeed = res.crewSeed;
    S2.flags.deck = 'de';
    if (res.pid === 'cuche') { S2.money.eur += 150; S2.money.chf += TICKET_CASH; }
    clearSave();
    try { localStorage.removeItem(SAVE_KEY + '-img'); } catch (e) {}
    startGame(S2, true);
  };
}

async function startGame(state, fresh) {
  G.S = state;
  if (!G.S.flags.met) G.S.flags.met = {};
  buildFriends();
  G.photoImg = {};
  try { G.photoImg = JSON.parse(localStorage.getItem(SAVE_KEY + '-img') || '{}'); } catch (e) {}
  document.getElementById('title').hidden = true;
  document.getElementById('hud').hidden = false;
  document.getElementById('touch').hidden = false;
  G.player = null;
  if (fresh) enterMap('luzern', 'start');
  else enterMap(G.S.map, { x: G.S.x, y: G.S.y, dir: G.S.dir });
  Story._lastHour = Math.floor(hourOf(G.S.time));
  G.mode = 'play';
  Story.ready = true;
  UI.hud();
  if (fresh) {
    G.busy++;
    await UI.card(`${dateLong()} · ${clockStr()} Uhr · Bahnhofplatz Luzern`, 1800);
    await Story.say(null, playerIsKassier()
      ? `Du bist ${G.S.name}, der Kassier. Die Gruppenkasse ist bei dir – und du kaufst das Gruppenbillett am Automaten im Bahnhof. Die Jungs warten beim Torbogen. Um 9:10 fährt der Zug auf Gleis 4, und zwar pünktlich.`
      : `Du bist ${G.S.name}, ${CREW.find((c) => c.id === G.S.pid).role}. Heute geht's mit den Jungs nach Innsbruck! Sie warten beim Torbogen. Du bist für die Fahrkarten zuständig: ${fname(who('kassier'))} gibt dir das Geld, du kaufst das Gruppenbillett am Automaten. Um 9:10 fährt der Zug auf Gleis 4 – wer zu spät kommt, bleibt in Luzern.`);
    if (Input.touch) await Story.say(null, 'Zieh mit dem Daumen links auf dem Bildschirm, um zu gehen. Weit ziehen heisst rennen. Mit A sprichst du mit Leuten und benutzt Dinge. Oben rechts ist dein Handy.');
    else await Story.say(null, 'WASD oder Pfeiltasten zum Gehen, Shift zum Rennen, E für Aktionen, M für dein Handy.');
    G.busy--;
    saveGame(true);
  }
}

function wireInput() {
  const keyDown = (e) => {
    if (G.mode !== 'play') return;
    if (!document.getElementById('editor').hidden) return;
    const code = e.code;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(code)) e.preventDefault();
    if (UI.dlgOpen) { UI.dlgKey(code); return; }
    if (UI.ovOpen) {
      if (Mini.key) { Mini.key(code); return; }
      if (code === 'Escape' || code === 'KeyM') UI.closeOverlay();
      return;
    }
    Input.keys[code] = true;
    if (['KeyE', 'Space', 'Enter'].includes(code)) doInteract();
    if (code === 'KeyM' || code === 'Tab') { e.preventDefault(); if (!G.busy) Phone.open(); }
  };
  window.addEventListener('keydown', keyDown);
  window.addEventListener('keyup', (e) => { Input.keys[e.code] = false; });
  window.addEventListener('blur', () => { Input.keys = {}; });
  const scr = document.getElementById('screen');
  const stick = document.getElementById('stick'), knob = document.getElementById('knob');
  const S = Input.stick;
  const start = (e) => {
    if (G.mode !== 'play' || G.busy) return;
    Input.touch = true; document.body.classList.add('touch');
    if (S.on) return;
    S.on = true; S.id = e.pointerId; S.ox = e.clientX; S.oy = e.clientY; S.x = 0; S.y = 0;
    stick.style.left = e.clientX + 'px'; stick.style.top = e.clientY + 'px'; stick.classList.add('on');
    knob.style.transform = 'translate(0,0)';
    e.preventDefault();
  };
  const move = (e) => {
    if (!S.on || e.pointerId !== S.id) return;
    const dx = e.clientX - S.ox, dy = e.clientY - S.oy;
    const d = Math.hypot(dx, dy), max = 48;
    const k = d > max ? max / d : 1;
    S.x = (dx * k) / max * (d > 8 ? 1 : 0); S.y = (dy * k) / max * (d > 8 ? 1 : 0);
    if (d > 70) { S.x *= 1.2; S.y *= 1.2; }
    knob.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
  };
  const end = (e) => { if (e.pointerId !== S.id) return; S.on = false; S.x = 0; S.y = 0; stick.classList.remove('on'); };
  scr.addEventListener('pointerdown', start);
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);
  document.getElementById('touch').addEventListener('pointerdown', (e) => { if (e.target.id === 'touch' || e.target.id === 'stickHint') start(e); });
  document.getElementById('btnA').addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); Snd.init(); if (UI.dlgOpen) { UI.dlgAdvance(); return; } doInteract(); });
  document.addEventListener('contextmenu', (e) => { if (G.mode === 'play') e.preventDefault(); });
  document.addEventListener('pointerdown', () => Snd.init(), { once: true });
}
window.addEventListener('load', boot);

</script>
