<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1a2b">
<title>Wiehnachtsreisli 2026 nach Innsbruck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<style>
/* Gleis 4 nach Innsbruck – Abfahrtstafel trifft Zirbenstube.
   Bewusst nur ein dunkles Farbschema: Das Spiel ist eine eigene Welt. */
:root {
  --board: #0f1a2b;
  --board-2: #172539;
  --board-line: #2b3e5c;
  --ink: #f2eee4;
  --ink-dim: #a7b1c2;
  --amber: #ffb53d;
  --red: #d8352d;
  --pine: #c98b4e;
  --pine-dark: #5a3a20;
  --ok: #6cc46f;
  --warn: #f0a23a;
  --bad: #e2554a;
  --slate: #24332b;
  --chalk: #e9efe6;
  --coaster: #f4efe2;
  --f-pixel: 'Pixelify Sans', ui-monospace, 'Courier New', monospace;
  --f-sign: 'Barlow Semi Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --f-body: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: #05070b; color: var(--ink); overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--f-body); font-size: 15px; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
button { font-family: var(--f-sign); color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
#app { position: fixed; inset: 0; overflow: hidden; }
#screen { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; }

/* ---------- HUD ---------- */
#hud { position: absolute; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 8px) 10px 0; pointer-events: none; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; max-width: 760px; }
.hud-row { display: flex; align-items: stretch; gap: 6px; min-width: 0; }
.hud-row > * { flex: none; }
.hud-row > .place { flex: 1 1 auto; }
.plate { background: rgba(15, 26, 43, 0.9); border: 1px solid var(--board-line); border-radius: 6px; box-shadow: 0 2px 0 rgba(0,0,0,.35); }
.clock { display: flex; flex-direction: column; justify-content: center; padding: 3px 9px; min-width: 64px; }
.clock b { font-family: var(--f-sign); font-weight: 700; font-size: 22px; letter-spacing: .02em; color: var(--amber); font-variant-numeric: tabular-nums; line-height: 1; }
.clock span { font-family: var(--f-sign); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
.place { flex: 1; min-width: 0; padding: 4px 10px; display: flex; flex-direction: column; justify-content: center; }
.place small { font-family: var(--f-sign); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
.place b { font-family: var(--f-sign); font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.money { padding: 3px 9px; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; font-family: var(--f-sign); font-variant-numeric: tabular-nums; }
.money b { font-size: 16px; font-weight: 700; }
.money span { font-size: 12px; color: var(--ink-dim); }
.hud-btn { pointer-events: auto; width: 46px; border-radius: 6px; background: var(--red); border: 1px solid #ff7a6a; display: grid; place-items: center; padding: 0; }
.hud-btn svg { width: 22px; height: 22px; }
.stats { display: flex; gap: 6px; align-items: center; padding: 5px 8px; }
.coaster { width: 44px; height: 44px; flex: none; border-radius: 50%; background: var(--coaster); border: 3px solid var(--red); box-shadow: inset 0 0 0 2px #fff, 0 2px 0 rgba(0,0,0,.4); position: relative; }
.coaster canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.bars { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; min-width: 0; }
.bar { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 5px; font-family: var(--f-sign); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
.bar i { display: block; height: 7px; border-radius: 4px; background: #2a3a52; position: relative; overflow: hidden; }
.bar i::after { content: ''; position: absolute; inset: 0; width: var(--v, 50%); background: var(--c, var(--ok)); border-radius: 4px; transition: width .4s; }
.bar.prom b { font-size: 14px; color: var(--ink); letter-spacing: 0; font-variant-numeric: tabular-nums; text-transform: none; }
.board-strip { display: flex; align-items: center; gap: 8px; padding: 5px 10px; font-family: var(--f-sign); font-weight: 600; font-size: 14px; color: var(--amber); letter-spacing: .02em; }
.board-strip .gl { flex: none; font-family: var(--f-sign); font-weight: 700; background: var(--amber); color: var(--board); border-radius: 3px; padding: 0 5px; font-size: 12px; letter-spacing: .08em; }
.board-strip span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Toasts ---------- */
#toasts { position: absolute; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 150px); display: grid; gap: 6px; width: min(420px, calc(100% - 32px)); pointer-events: none; z-index: 30; }
.toast { background: rgba(15, 26, 43, .95); border: 1px solid var(--board-line); border-left: 4px solid var(--amber); padding: 8px 12px; border-radius: 6px; font-size: 14px; animation: tin .25s ease-out; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
.toast.warn { border-left-color: var(--bad); }
.toast.ach { border-left-color: var(--ok); background: rgba(24, 44, 30, .96); }
.toast.out { opacity: 0; transform: translateY(-6px); transition: .3s; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } }

/* ---------- Steuerung ---------- */
#touch { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
#stick { position: absolute; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; border: 2px solid rgba(242,238,228,.35); background: rgba(15,26,43,.35); display: none; }
#stick.on { display: block; }
#knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(242,238,228,.85); box-shadow: 0 2px 0 rgba(0,0,0,.4); }
#stickHint { position: absolute; left: 22px; bottom: calc(env(safe-area-inset-bottom, 0px) + 30px); width: 92px; height: 92px; border-radius: 50%; border: 2px dashed rgba(242,238,228,.25); display: grid; place-items: center; font-family: var(--f-sign); font-size: 11px; letter-spacing: .1em; color: rgba(242,238,228,.45); text-transform: uppercase; }
#btnA { pointer-events: auto; position: absolute; right: 22px; bottom: calc(env(safe-area-inset-bottom, 0px) + 34px); width: 76px; height: 76px; border-radius: 50%; border: 3px solid #ffd27a; background: var(--amber); color: var(--board); font-family: var(--f-pixel); font-size: 28px; font-weight: 700; box-shadow: 0 4px 0 #a86a10; }
#btnA:active { transform: translateY(3px); box-shadow: 0 1px 0 #a86a10; }
#btnA.idle { opacity: .45; }
#actLabel { position: absolute; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 120px); max-width: 60vw; background: var(--board); border: 1px solid var(--amber); color: var(--ink); font-family: var(--f-sign); font-weight: 600; font-size: 15px; padding: 5px 10px; border-radius: 5px; }
#actLabel kbd { font-family: var(--f-pixel); background: var(--amber); color: var(--board); border-radius: 3px; padding: 0 5px; margin-right: 6px; }
#runHint { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); transform: translateX(-50%); font-family: var(--f-sign); font-size: 12px; color: var(--ink-dim); letter-spacing: .06em; text-align: center; }

/* ---------- Dialog ---------- */
#dialog { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); width: min(640px, calc(100% - 20px)); z-index: 20; display: grid; grid-template-columns: auto 1fr; gap: 12px; background: var(--board); border: 2px solid var(--board-line); border-radius: 10px; padding: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.55); }
#dialog.noport { grid-template-columns: 1fr; }
#dialog canvas { width: 84px; height: 84px; image-rendering: pixelated; border-radius: 6px; border: 2px solid var(--board-line); }
#dialog.noport canvas { display: none; }
.dlg-name { font-family: var(--f-pixel); font-size: 15px; color: var(--amber); margin-bottom: 4px; }
.dlg-text { font-size: 16px; line-height: 1.42; min-height: 46px; max-width: 62ch; }
.dlg-text em { color: var(--amber); font-style: normal; }
.dlg-more { float: right; font-family: var(--f-pixel); color: var(--amber); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.dlg-choices { display: grid; gap: 6px; margin-top: 10px; }
.choice { text-align: left; padding: 9px 12px; border-radius: 6px; border: 1px solid var(--board-line); background: var(--board-2); font-family: var(--f-body); font-size: 15px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.choice:hover, .choice.sel { border-color: var(--amber); background: #22344f; }
.choice small { color: var(--ink-dim); font-family: var(--f-sign); font-size: 13px; white-space: nowrap; }
.choice[disabled] { opacity: .45; cursor: not-allowed; }

/* ---------- Overlay-Paneele ---------- */
#overlay { position: absolute; inset: 0; z-index: 25; background: rgba(5,7,11,.72); display: grid; place-items: center; padding: calc(env(safe-area-inset-top, 0px) + 10px) 10px calc(env(safe-area-inset-bottom, 0px) + 10px); }
.panel { width: min(560px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--board); border: 2px solid var(--board-line); border-radius: 12px; overflow: hidden; box-shadow: 0 16px 40px rgba(0,0,0,.6); }
.panel-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--board-line); background: var(--board-2); }
.panel-head h2 { margin: 0; flex: 1; font-family: var(--f-pixel); font-weight: 600; font-size: 19px; color: var(--ink); text-wrap: balance; }
.panel-head .sub { font-family: var(--f-sign); color: var(--ink-dim); font-size: 13px; }
.x-btn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--board-line); background: transparent; font-size: 20px; line-height: 1; }
.panel-body { overflow: auto; padding: 12px 14px; display: grid; gap: 8px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.panel-foot { padding: 10px 14px; border-top: 1px solid var(--board-line); display: flex; gap: 8px; justify-content: space-between; align-items: center; font-family: var(--f-sign); color: var(--ink-dim); }
.shop-sec { font-family: var(--f-sign); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--amber); margin-top: 4px; }
.shop-item { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--board-line); background: var(--board-2); text-align: left; }
.shop-item:hover { border-color: var(--amber); }
.shop-item img { width: 32px; height: 32px; image-rendering: pixelated; }
.shop-item .nm { font-size: 15px; }
.shop-item .ds { font-size: 12px; color: var(--ink-dim); font-family: var(--f-sign); }
.shop-item .pr { font-family: var(--f-sign); font-weight: 700; font-size: 16px; color: var(--amber); font-variant-numeric: tabular-nums; }
.shop-item.off { opacity: .55; }
.shop-item .pr { display: flex; gap: 6px; align-items: center; }
.shop-item .pr .btn { padding: 7px 10px; font-size: 14px; color: var(--amber); white-space: nowrap; }
.shop-item .pr .btn.take { padding: 7px 8px; font-size: 15px; }
.shop-item .pr .btn:not([disabled]):hover { border-color: var(--amber); }
.shop-item .nm .have { margin-left: 6px; font-family: var(--f-sign); font-size: 12px; color: var(--ink-dim); }
.btn { padding: 9px 14px; border-radius: 8px; border: 1px solid var(--board-line); background: var(--board-2); font-family: var(--f-sign); font-weight: 600; font-size: 15px; }
.btn.primary { background: var(--amber); color: var(--board); border-color: #ffd27a; }
.btn.red { background: var(--red); border-color: #ff7a6a; }
.tabs { display: flex; gap: 4px; padding: 8px 10px 0; overflow-x: auto; background: var(--board-2); border-bottom: 1px solid var(--board-line); }
.tab { flex: none; padding: 8px 12px; border: 1px solid transparent; border-bottom: none; border-radius: 8px 8px 0 0; background: transparent; font-family: var(--f-sign); font-weight: 600; font-size: 14px; color: var(--ink-dim); }
.tab.on { background: var(--board); color: var(--amber); border-color: var(--board-line); }
.list { display: grid; gap: 6px; }
.row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 8px; background: var(--board-2); border: 1px solid var(--board-line); align-items: center; }
.row.done { border-color: #3e6a44; }
.row .t { font-weight: 600; }
.row .d { font-size: 13px; color: var(--ink-dim); }
.row .tick { font-family: var(--f-pixel); color: var(--ok); }
.row .open { font-family: var(--f-pixel); color: #5a6a80; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.photo { background: #f4f0e6; color: #2a2622; padding: 6px 6px 10px; border-radius: 3px; box-shadow: 0 3px 8px rgba(0,0,0,.4); transform: rotate(var(--r, 0deg)); }
.photo canvas { width: 100%; image-rendering: pixelated; display: block; background: #8ec3e6; }
.photo b { display: block; font-family: var(--f-sign); margin-top: 5px; font-size: 14px; }
.photo p { margin: 3px 0 0; font-size: 12px; line-height: 1.35; }
.photo.missing { background: var(--board-2); color: var(--ink-dim); border: 1px dashed var(--board-line); box-shadow: none; display: grid; place-items: center; min-height: 120px; text-align: center; font-family: var(--f-sign); }
.statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: var(--board-2); border: 1px solid var(--board-line); border-radius: 8px; padding: 8px 10px; }
.stat small { font-family: var(--f-sign); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
.stat b { display: block; font-family: var(--f-sign); font-size: 22px; font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--ink-dim); line-height: 1.45; }
.mapwrap { overflow: auto; border-radius: 8px; border: 1px solid var(--board-line); touch-action: pan-x pan-y; max-height: 60vh; }
.mapwrap canvas { display: block; image-rendering: pixelated; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-family: var(--f-sign); font-size: 13px; color: var(--ink-dim); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.opt-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 10px; background: var(--board-2); border-radius: 8px; border: 1px solid var(--board-line); }

/* ---------- Minispiele ---------- */
.mini { width: min(640px, 100%); }
.mini canvas { width: 100%; display: block; image-rendering: pixelated; touch-action: none; background: #10161f; }
.mini .panel-body { padding: 10px; }
.mini-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--f-sign); font-size: 15px; }
.mini-bar b { color: var(--amber); font-variant-numeric: tabular-nums; }
.lanes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.lanes button { height: 58px; border-radius: 10px; border: 2px solid var(--board-line); background: var(--board-2); font-size: 24px; font-family: var(--f-pixel); }
.lanes button:active, .lanes button.hit { background: var(--amber); color: var(--board); }

/* ---------- Jass ---------- */
.jass { width: min(720px, 100%); height: 100%; max-height: 100%; }
.jass .panel-body { padding: 0; display: flex; flex-direction: column; flex: 1; gap: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #2f6a42, #1d4a2c 70%); }
.jass-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; background: var(--slate); color: var(--chalk); font-family: var(--f-pixel); border-bottom: 3px solid #6a4a2a; }
.tafel { display: flex; gap: 14px; font-size: 14px; }
.tafel b { color: #fff; font-variant-numeric: tabular-nums; }
.trumpf { display: flex; align-items: center; gap: 6px; font-family: var(--f-sign); font-size: 14px; }
.jtable { position: relative; flex: 1; min-height: 260px; }
.seat { position: absolute; display: flex; align-items: center; gap: 6px; font-family: var(--f-sign); font-size: 13px; color: #e8f0e6; }
.seat canvas { width: 40px; height: 40px; image-rendering: pixelated; border-radius: 6px; border: 2px solid rgba(0,0,0,.3); }
.seat.turn canvas { border-color: var(--amber); box-shadow: 0 0 0 2px var(--amber); }
.seat.top { left: 50%; top: 8px; transform: translateX(-50%); }
.seat.left { left: 8px; top: 42%; flex-direction: column; }
.seat.right { right: 8px; top: 42%; flex-direction: column; }
.backs { display: flex; }
.backs i { width: 10px; height: 16px; border-radius: 2px; background: repeating-linear-gradient(45deg, #b8302a 0 3px, #8a1e1a 3px 6px); border: 1px solid #f4f0e6; margin-left: -4px; }
.trick { position: absolute; left: 50%; top: 50%; width: 170px; height: 150px; transform: translate(-50%, -50%); }
.trick .card { position: absolute; transition: transform .25s ease-out; }
.trick .p0 { left: 62px; top: 74px; } .trick .p1 { left: 112px; top: 38px; } .trick .p2 { left: 62px; top: 0; } .trick .p3 { left: 12px; top: 38px; }
.hand { display: flex; justify-content: center; padding: 8px 6px 10px; gap: 0; flex-wrap: nowrap; }
.hand .card { margin: 0 -9px; transition: transform .15s; }
.hand .card.ok { cursor: pointer; }
.hand .card.ok:hover, .hand .card.ok:focus-visible { transform: translateY(-10px); }
.hand .card.no { filter: brightness(.6); }
.card { width: 48px; height: 72px; border-radius: 5px; background: #fbf8f0; border: 1px solid #8a7a62; box-shadow: 0 2px 4px rgba(0,0,0,.35); position: relative; color: #1a1a1a; font-family: var(--f-sign); font-weight: 700; padding: 0; }
.card .r { position: absolute; left: 4px; top: 2px; font-size: 15px; line-height: 1; }
.card .r2 { position: absolute; right: 4px; bottom: 2px; font-size: 15px; line-height: 1; transform: rotate(180deg); }
.card .s { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 26px; height: 26px; }
.card .s svg, .trumpf svg { width: 100%; height: 100%; display: block; }
.card.red { color: #c8202a; }
.trumpf svg { width: 20px; height: 20px; }
.jass-msg { text-align: center; font-family: var(--f-sign); font-size: 15px; color: #f4f0e6; min-height: 22px; padding: 2px 8px; }
.jass-actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 6px; }
.jass-actions .btn { display: flex; align-items: center; gap: 6px; }
.jass-actions svg { width: 18px; height: 18px; }

/* ---------- Editor ---------- */
#editor { position: absolute; inset: 0; z-index: 40; background: var(--board); display: grid; grid-template-rows: auto 1fr auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.ed-head { padding: 10px 14px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--board-line); background: var(--board-2); }
.ed-head h1 { margin: 0; font-family: var(--f-pixel); font-size: 20px; flex: 1; text-wrap: balance; }
.ed-head .cnt { font-family: var(--f-sign); font-size: 13px; color: var(--amber); text-align: right; }
.ed-main { display: grid; grid-template-columns: minmax(240px, 340px) 1fr; min-height: 0; }
.ed-preview { padding: 14px; display: grid; gap: 10px; align-content: start; border-right: 1px solid var(--board-line); background: linear-gradient(#1b2a40, #0f1a2b); }
.ed-figs { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
.ed-figs canvas { image-rendering: pixelated; width: 100%; border-radius: 10px; border: 2px solid var(--board-line); background: #2a3a52; }
#edBody { width: 72px; height: 104px; border: none !important; background: transparent !important; }
.ed-rot { display: flex; gap: 4px; justify-content: center; }
.ed-rot button { width: 34px; height: 30px; border-radius: 6px; border: 1px solid var(--board-line); background: var(--board-2); font-size: 14px; }
.ed-name label { font-family: var(--f-sign); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); display: block; margin-bottom: 4px; }
.ed-name input { width: 100%; box-sizing: border-box; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--board-line); background: #0a1220; color: var(--ink); font-family: var(--f-sign); font-size: 18px; }
.ed-controls { min-height: 0; display: grid; grid-template-rows: auto 1fr; }
.ed-tabs { display: flex; gap: 4px; padding: 8px 10px 0; border-bottom: 1px solid var(--board-line); overflow-x: auto; }
.ed-list { overflow: auto; padding: 10px 14px 14px; display: grid; gap: 8px; align-content: start; touch-action: pan-y; }
.feat { display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 8px; background: var(--board-2); border: 1px solid var(--board-line); }

/* Porträt-Cache für Dialoge */
const _portCache = new Map();
function portraitCanvas(L, bg) {
  const key = lookKey(L) + (bg || '');
  let c = _portCache.get(key);
  if (c) return c;
  const [cv, x] = canvas(64, 64);
  drawPortrait(x, L, { bg });
  _portCache.set(key, cv);
  if (_portCache.size > 60) _portCache.delete(_portCache.keys().next().value);
  return cv;
}

/* ============ Charakter-Editor ============ */
const Editor = {
  open(o = {}) {
    const mode = o.mode || 'new';
    return new Promise((resolve) => {
      const el = document.getElementById('editor');
      const L = Object.assign({}, o.look || (G.S ? G.S.look : defaultLook()));

      const groups = mode === 'new' ? ['Wer bist du?', ...LOOK_GROUPS] : ['Auswahl'];
      let tab = groups[0];
      let dir = 0, walk = 0;
      const title = { new: 'Wer fährt mit nach Innsbruck?', clothes: 'Kleiderschrank', hair: 'Beim Barbier: Frisur', beard: 'Beim Barbier: Bart' }[mode];
      el.innerHTML = `<div class="ed-head"><h1>${title}</h1><div class="cnt">${mode === 'new' ? `${LOOK_OPTS.length} Merkmale<br>${LOOK_COUNT} Varianten` : ''}</div></div>
        <div class="ed-main"><div class="ed-preview"><div class="ed-figs"><canvas id="edPortrait" width="64" height="64" aria-label="Porträt"></canvas><div><canvas id="edBody" width="18" height="26" aria-label="Spielfigur"></canvas><div class="ed-rot"><button id="edL" aria-label="Drehen links">◀</button><button id="edR" aria-label="Drehen rechts">▶</button></div></div></div>
        <div class="ed-name"><label>Spieler</label><div id="edWho" style="font-family:var(--f-sign);font-size:20px;font-weight:700">${pid ? CREW.find((c) => c.id === pid).name : '<span style="color:var(--ink-dim)">noch niemand gewählt</span>'}</div></div></div>
        <div class="ed-controls"><div class="ed-tabs" role="tablist">${groups.map((g) => `<button class="tab ${g === tab ? 'on' : ''}" data-g="${g}">${g}</button>`).join('')}</div><div class="ed-list" id="edList"></div></div></div>
        <div class="ed-foot"><span class="grow" id="edHint">${mode === 'new' ? 'Wähle zuerst, wer du bist. Danach Kopf, Gesicht und Kleidung gestalten.' : 'Änderungen werden sofort übernommen.'}</span>${mode === 'new' ? '<button class="btn" id="edRnd">Zufall</button>' : '<button class="btn" id="edCancel">Abbrechen</button>'}<button class="btn primary" id="edOk">${mode === 'new' ? 'Los geht\'s!' : 'Fertig'}</button></div>`;
      el.hidden = false;
      const pcv = el.querySelector('#edPortrait'), pcx = pcv.getContext('2d');
      const bcv = el.querySelector('#edBody'), bcx = bcv.getContext('2d');
      pcx.imageSmoothingEnabled = false; bcx.imageSmoothingEnabled = false;
      const okBtn = el.querySelector('#edOk');
      const draw = () => {
        pcx.clearRect(0, 0, 64, 64); drawPortrait(pcx, L, { bg: '#2a3a52' });
        bcx.clearRect(0, 0, 18, 26);
        const sheet = getSheet(L);
        const f = [0, 1, 0, 2][Math.floor(walk) % 4];
        bcx.drawImage(sheet, f * SPR_W, dir * SPR_H, SPR_W, SPR_H, 0, 0, SPR_W, SPR_H);
        if (mode === 'new') okBtn.disabled = !pid;
      };
      const iv = setInterval(() => { walk += 0.5; draw(); }, 160);
      el.querySelector('#edL').onclick = () => { dir = [1, 3, 0, 2][dir]; draw(); };
      el.querySelector('#edR').onclick = () => { dir = [2, 0, 3, 1][dir]; draw(); };

        const keep = list.scrollTop;

          const grid = document.createElement('div');
          grid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px';
          for (const c of CREW) {
            const b = document.createElement('button');
            b.className = 'choice' + (pid === c.id ? ' sel' : '');
            b.style.cssText = 'display:grid;grid-template-columns:40px 1fr;align-items:center;column-gap:8px;text-align:left';

            b.innerHTML = `<canvas width="64" height="64" style="width:40px;height:40px;image-rendering:pixelated;border-radius:6px;grid-row:1/3" aria-hidden="true"></canvas><span style="font-family:var(--f-pixel);font-size:17px">${c.name}</span><small>${c.role}</small>`;

              renderList(); draw(); Snd.sfx('blip');

            grid.appendChild(b);
          }
          list.appendChild(grid);
          const n = document.createElement('p');
          n.className = 'note';
          n.textContent = 'Die anderen elf fahren als Kollegen mit, jeder in seinem gewohnten Look. Wer eine Schlüsselrolle hat (Kassier mit der Gruppenkasse, Anwalt als Jass-Schiedsrichter, Muskelprotz beim Armdrücken …), gibt sie an einen anderen ab, wenn du ihn spielst.';
          list.appendChild(n);

          const row = document.createElement('div');
          row.className = 'feat';
          const n = (op.col || op.v).length;
          row.innerHTML = `<span>${op.n}<small>${n} Varianten</small></span>`;
          if (op.col) {
            const sw = document.createElement('div'); sw.className = 'swatches';
            op.col.forEach(([name, hex], i) => {

              b.className = 'sw' + (L[op.k] === i ? ' on' : '');
              b.style.background = hex; b.title = name; b.setAttribute('aria-label', `${op.n}: ${name}`);

            const a = document.createElement('button'); a.textContent = '◀'; a.setAttribute('aria-label', 'vorherige'); a.onclick = () => step(-1);

            row.appendChild(stp);

            if (locks.some((i) => isLocked(op.k, +i, unlocked))) { const hint = document.createElement('small'); hint.style.cssText = 'grid-column:1/-1;color:var(--ink-dim);font-family:var(--f-sign)'; hint.textContent = `🔒 ${op.v[locks[0]]}: im Trachtenladen in Innsbruck erhältlich`; row.appendChild(hint); }
          }

        }
      };
      el.querySelectorAll('.ed-tabs .tab').forEach((t) => t.addEventListener('click', () => { tab = t.dataset.g; el.querySelectorAll('.ed-tabs .tab').forEach((x) => x.classList.toggle('on', x === t)); renderList(); }));
      const close = (val) => { clearInterval(iv); el.hidden = true; el.innerHTML = ''; resolve(val); };
      okBtn.onclick = () => {
        if (mode === 'new' && !pid) { el.querySelector('#edHint').textContent = 'Wähle zuerst, wer du bist!'; Snd.sfx('error'); return; }
        if (mode !== 'new' && G.S) { Object.assign(G.S.look, L); if (G.player) G.player.look = G.S.look; if (tracht()) achieve('tracht'); }
        Snd.sfx('ok');
        close({ look: L, pid, crewSeed });
      };
      const rb = el.querySelector('#edRnd');
      if (rb) rb.onclick = () => { Object.assign(L, randomLook(Math.random, unlocked)); renderList(); draw(); Snd.sfx('blip'); };

/* Essen und Trinken */
function consume(id, opts = {}) {
  const it = ITEMS[id];
  const st = G.S.st;
  if (!it) return;
  if (it.alc) {
    const stomach = st.food > 55 ? 0.82 : st.food < 20 ? 1.22 : 1;
    st.prom = Math.min(4, st.prom + it.alc * stomach);
    const units = it.alc / 0.25;
    let n = 8 * units;
    if (st.food < 30) n += 10 * units;
    if (minutesAwake() > 14 * 60) n += 8 * units;
    if (st.prom > 1.4) n += 7 * units;
    if (st.food > 60) n -= 4 * units;
    st.nau = clamp(st.nau + Math.max(2, n) + (it.nau || 0), 0, 140);
    if (it.beer) { G.S.beers++; if (G.S.beers >= 10) achieve('strich'); if (G.map && G.map.city === 'ibk') achieve('ersteRunde'); }
    else G.S.shots++;
    if (st.prom < 1.8) mood(it.mood || 3); else mood(-1);
    energy(it.en || 0);
    Snd.sfx(it.icon === 'shot' ? 'gulp' : 'gulp');
  } else {
    if (it.food) { st.food = clamp(st.food + it.food, 0, 100); G.S.lastFood = G.S.time; Snd.sfx('eat'); }
    else Snd.sfx('gulp');
    if (it.nau) st.nau = clamp(st.nau + it.nau, 0, 140);
    if (it.en) energy(it.en);
    if (it.mood) mood(it.mood);
    if (it.water) { st.prom = Math.max(0, st.prom - 0.04); st.hang = Math.max(0, st.hang - 15); }
    if (it.hang && st.hang > 0) { st.hang = Math.max(0, st.hang - 40 * it.hang); if (st.hang <= 0) { achieve('kater'); UI.toast('Der Kater ist weg!'); } }
    if (it.burger) { G.S.burgers++; achieve('burger'); }
  }
  if (!opts.silent) checkThresholds();
}

/* Werte pro Spielminute fortschreiben */
function tickStats(dm) {
  const st = G.S.st;
  const awakeH = minutesAwake() / 60;
  let enDrain = 4 / 60 + Math.max(0, st.prom - 0.8) * 2.2 / 60 + (awakeH > 16 ? 2 / 60 : 0);
  if (G.player && G.player.running) enDrain += 3 / 60;
  st.energy = clamp(st.energy - enDrain * dm, 0, 100);
  st.food = clamp(st.food - (6 / 60) * dm, 0, 100);
  st.prom = Math.max(0, st.prom - (0.15 / 60) * dm);
  let nauRate = -10 / 60;
  if (st.food < 15 && st.prom > 0.8) nauRate = 4 / 60;
  if (awakeH > 18 && st.prom > 1) nauRate += 3 / 60;
  st.nau = clamp(st.nau + nauRate * dm, 0, 140);
  if (st.food < 20) mood(-2 / 60 * dm);
  if (st.energy < 20) mood(-2 / 60 * dm);
  if (st.hang > 0) { st.hang = Math.max(0, st.hang - dm * 0.5); mood(-1.2 / 60 * dm); }
  if (st.wet > 0) st.wet = Math.max(0, st.wet - dm);
  if (st.smell > 0) st.smell = Math.max(0, st.smell - dm * 0.5);
  checkThresholds();
}
function warnOnce(key, cond, msg, reset) {
  if (cond && !G.warned[key]) { G.warned[key] = 1; UI.toast(msg, 'warn'); }
  if (reset && G.warned[key]) G.warned[key] = 0;
}
function checkThresholds() {
  const st = G.S.st;
  warnOnce('hunger', st.food < 18, 'Dein Magen knurrt. Zeit für einen Burger?', st.food > 35);
  warnOnce('tired', st.energy < 22, 'Du bist müde. Leg dich im Hotelzimmer kurz hin.', st.energy > 40);
  warnOnce('nau1', st.nau > 60, 'Dir ist flau im Magen …', st.nau < 40);
  warnOnce('nau2', st.nau > 85, 'Dir wird richtig übel! Iss etwas oder geh schlafen.', st.nau < 70);
  warnOnce('prom1', st.prom > 1.2, 'Die Welt fängt an zu schwanken.', st.prom < 0.9);
  warnOnce('prom2', st.prom > 2.0, 'Du siehst doppelt. Vielleicht ein Wasser?', st.prom < 1.7);
  if (!G.busy && Story.ready) {
    if (st.nau >= 100) Story.vomit();
    else if (st.prom >= 2.6) Story.blackout();
    else if (st.energy <= 0) Story.collapse();
  }
}

/* ============ Bodenkacheln ============ */
const T = {
  VOID: 0, COBBLE: 1, ASPH: 2, PAVE: 3, GRASS: 4, WATER: 5, BRIDGE: 6, STONE: 7, WOOD: 8, CARPET: 9, BATH: 10,
  PLAT: 11, RAIL: 12, LED: 13, DARK: 14, ROCK: 15, GRAVEL: 16, PLAZA: 17, TRAINF: 18, FLOWER: 19, ZEBRA: 20,
  DECK: 21, KIES: 22, WALL: 23, WALLF: 24, FOREST: 25, TRAMR: 26, EDGE: 27, MEADOW: 28, CLIFF: 29, STAIRS: 30,
  MARBLE: 31, HEDGE: 32, SAND: 33,
};
const SOLID_T = new Set([T.VOID, T.WATER, T.RAIL, T.WALL, T.WALLF, T.FOREST, T.FLOWER, T.CLIFF, T.HEDGE]);

function stoneRows(x, px, py, tx, ty, base, gap, rowH, wMin, wMax, seed) {
  R(x, px, py, 16, 16, gap);
  for (let r = 0; r < 16 / rowH; r++) {
    let cx = -Math.floor(hash(tx, ty * 7 + r, seed) * wMax);
    let k = 0;
    while (cx < 16) {
      const w = wMin + Math.floor(hash(tx * 13 + k, ty * 5 + r, seed + 1) * (wMax - wMin + 1));
      const c = shade(base, (hash(tx + k, ty + r, seed + 2) - 0.5) * 0.18);
      const x0 = Math.max(cx, 0), x1 = Math.min(cx + w - 1, 16);
      if (x1 > x0) { R(x, px + x0, py + r * rowH, x1 - x0, rowH - 1, c); P(x, px + x0, py + r * rowH, shade(c, 0.15)); }
      cx += w; k++;
    }
  }
}
const TILE_PAINT = {
  [T.VOID]: (x, px, py) => R(x, px, py, 16, 16, '#0a0c10'),
  [T.COBBLE]: (x, px, py, tx, ty, m, v) => {
    const base = ['#a39a8b', '#b19c86', '#8e8a84'][v] || '#a39a8b';
    stoneRows(x, px, py, tx, ty, base, shade(base, -0.35), 4, 3, 6, 11);
  },
  [T.ASPH]: (x, px, py, tx, ty, m, v) => {
    R(x, px, py, 16, 16, '#5a5d62');
    for (let i = 0; i < 14; i++) P(x, px + Math.floor(hash(tx, ty, i) * 16), py + Math.floor(hash(ty, tx, i + 40) * 16), hash(tx, i, ty) > 0.5 ? '#63666b' : '#505357');
    if (v === 1 && tx % 3 !== 0) R(x, px, py + 7, 16, 2, '#e9e6dc');
    if (v === 2) R(x, px, py + 7, 16, 2, '#e3c24a');
    if (v === 3 && tx % 2 === 0) R(x, px + 2, py + 2, 12, 12, '#4f5256');

function makeTram(row, W, phase = 0) {

    const p = G.player;
    const front = v.dir > 0 ? v.x + 96 : v.x;

    if (v.x < -160) { v.dir = 1; v.wait = rnd(3, 8); }

/* ============ Karten-Laufzeit ============ */
class GMap {
  constructor(id, w, h, o = {}) {
    Object.assign(this, { id, w, h, name: o.name || id, indoor: !!o.indoor, bg: o.bg || '#0a0c10', music: o.music || null, city: o.city || null, daylight: o.daylight !== false && !o.indoor, wallStyle: o.wallStyle || {}, ambient: o.ambient || 0 });

    this.vehicles = []; this.pedZones = []; this.birdSpots = []; this.anims = [];
  }
  in(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; }
  at(x, y) { return this.in(x, y) ? this.g[y * this.w + x] : T.VOID; }
  set(x, y, t, v = 0) { if (!this.in(x, y)) return; const i = y * this.w + x; this.g[i] = t; this.v[i] = v; this.sol[i] = SOLID_T.has(t) ? 1 : 0; }
  fill(x, y, w, h, t, v = 0) { for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) this.set(xx, yy, t, typeof v === 'function' ? v(xx, yy) : v); }
  solid(x, y, w = 1, h = 1, val = 1) { for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) if (this.in(xx, yy)) this.sol[yy * this.w + xx] = val; }
  isSolid(x, y) { return !this.in(x, y) || this.sol[y * this.w + x] === 1; }
  add(o) { this.objs.push(o); if (o.solid) this.solid(o.x, o.y, o.w, o.h, 1); if (o.light) this.lights.push({ x: o.x * TS + o.light.dx, y: o.y * TS - o.drawH + o.light.dy, r: o.light.r, c: o.light.c }); return o; }
  trig(x, y, w, h, o) { const t = Object.assign({ x, y, w, h }, o); this.trigs.push(t); return t; }

  decal(fn) { this.decals.push(fn); }
  light(px, py, r, c = '#ffd78a') { this.lights.push({ x: px, y: py, r, c }); }

/* ============ Aktualisieren ============ */
function facingPoint(dist = 12) { const p = G.player, d = DIRV[p.dir]; return { x: p.x + d[0] * dist, y: p.y - 4 + d[1] * dist }; }
function findInteraction() {
  const p = G.player, m = G.map;
  const fp = facingPoint(12);
  let best = null, bd = 18;
  for (const n of G.npcs) {
    if (n.hidden || !n.talk) continue;
    const d = Math.hypot(n.x - fp.x, n.y - 4 - fp.y);
    if (d < bd) { bd = d; best = { npc: n, label: n.label || 'Reden: ' + n.name }; }
  }
  if (best) return best;
  const ftx = Math.floor(fp.x / TS), fty = Math.floor(fp.y / TS);
  const ptx = Math.floor(p.x / TS), pty = Math.floor((p.y - 2) / TS);
  for (const t of m.trigs) {
    if (t.auto || (t.cond && !t.cond())) continue;
    const inF = ftx >= t.x && ftx < t.x + t.w && fty >= t.y && fty < t.y + t.h;
    const inP = t.here && ptx >= t.x && ptx < t.x + t.w && pty >= t.y && pty < t.y + t.h;
    if (inF || inP) return { trig: t, label: typeof t.label === 'function' ? t.label() : t.label };
  }
  return null;
}
async function doInteract() {
  if (G.busy) return;
  const it = findInteraction();
  if (!it) return;
  G.player.moving = false;
  G.busy++;
  try {
    if (it.npc) {
      const n = it.npc;
      const prevDir = n.dir;
      if (n.facePlayer !== false && n.pose !== 'sit') n.dir = dirTo(n.x, n.y, G.player.x, G.player.y);
      await n.talk(n);
      if (n.keepDir) n.dir = prevDir;
    } else if (it.trig.act) await it.trig.act(it.trig);
  } catch (e) { console.error(e); }
  G.busy--;
  UI.hud();
}
function checkAutoTriggers() {
  const p = G.player, m = G.map;
  const tx = Math.floor(p.x / TS), ty = Math.floor((p.y - 3) / TS);
  const key = tx + ',' + ty;
  if (key === G.lastTile) return;
  G.lastTile = key;
  for (const t of m.trigs) {
    if (!t.auto) continue;
    if (tx >= t.x && tx < t.x + t.w && ty >= t.y && ty < t.y + t.h) {
      if (t.cond && !t.cond()) continue;
      runAuto(t);
      return;
    }
  }
}
async function runAuto(t) {
  G.busy++;
  try {
    if (t.guard) { const ok = await t.guard(t); if (!ok) { G.busy--; pushBack(); return; } }
    if (t.warp) { G.busy--; await warpTo(t.warp[0], t.warp[1], t.opts || {}); return; }
    if (t.act) await t.act(t);
  } catch (e) { console.error(e); }
  G.busy--;
}
function pushBack() { const p = G.player, d = DIRV[p.dir]; for (let i = 0; i < 10; i++) moveActor(p, -d[0], -d[1]); G.lastTile = null; }

function updatePlayer(dt) {
  const p = G.player, st = G.S.st;
  if (p.lock) { p.moving = false; return; }
  const ax = Input.axis();
  let vx = ax.x, vy = ax.y;
  const prom = st.prom;
  if (prom > 1.1 && (vx || vy)) {
    const w = Math.min(0.75, (prom - 1.1) * 0.55);
    vx += Math.sin(G.t * 2.3) * w; vy += Math.cos(G.t * 1.7) * w * 0.7;
  }
  if (prom > 1.8 && Math.random() < dt * 0.35) { const a = rnd(0, 6.28); p.stumble = { x: Math.cos(a) * 30, y: Math.sin(a) * 20, t: 0.25 }; if (Math.random() < 0.5) Snd.sfx('hicks'); }
  const tired = st.energy < 12 ? 0.7 : 1;
  const run = ax.run && st.energy > 8;
  p.running = run && (vx || vy);
  const sp = (run ? 82 : 50) * tired * (prom > 1.8 ? 0.85 : 1);
  let dx = vx * sp * dt, dy = vy * sp * dt;
  if (p.stumble) { dx += p.stumble.x * dt; dy += p.stumble.y * dt; p.stumble.t -= dt; if (p.stumble.t <= 0) p.stumble = null; }
  if (Math.abs(ax.x) > 0.2 || Math.abs(ax.y) > 0.2) {
    p.dir = Math.abs(ax.x) > Math.abs(ax.y) ? (ax.x < 0 ? 1 : 2) : ax.y < 0 ? 3 : 0;
    if (p.pose === 'sit' || p.pose === 'drink' || p.pose.startsWith('dance') || p.pose === 'bend') p.pose = 'stand';
  }
  const moved = (dx || dy) ? moveActor(p, dx, dy) : false;
  p.moving = moved && (Math.abs(dx) + Math.abs(dy) > 0.01);
  if (p.moving) { p.walkT += dt; if (Math.floor(p.walkT * (run ? 10 : 7)) !== Math.floor((p.walkT - dt) * (run ? 10 : 7)) && Math.floor(p.walkT * 7) % 2 === 0) Snd.sfx('step'); }
}
function updateNpc(a, dt) {
  if (a.bubbleT > 0) a.bubbleT -= dt;
  if (a.path && a.path.length) {
    const tgt = a.path[0];
    const dx = tgt.x - a.x, dy = tgt.y - a.y, d = Math.hypot(dx, dy);
    if (d < 1.5) { a.x = tgt.x; a.y = tgt.y; a.path.shift(); if (!a.path.length) { a.moving = false; if (a.onArrive) { const f = a.onArrive; a.onArrive = null; f(a); } } return; }
    const sp = (a.speed || 40) * dt;
    a.x += dx / d * Math.min(sp, d); a.y += dy / d * Math.min(sp, d);
    a.dir = dirTo(0, 0, dx, dy); a.moving = true; a.walkT += dt;
    return;
  }
  if (a.danceIdle) { a.pose = Math.floor(G.t * 2.07 + a.x * 0.1) % 2 ? 'danceA' : 'danceB'; return; }
  if (a.drinkIdle) { if (!a.dt) a.dt = rnd(4, 9); a.dt -= dt; if (a.dt < 0) { a.pose = a.pose === 'drink' ? (a.sitIdle ? 'sit' : 'stand') : 'drink'; a.dt = a.pose === 'drink' ? 1.2 : rnd(4, 10); } }
  if (a.wander && !G.busy) {
    a.wt = (a.wt || rnd(1, 4)) - dt;
    if (a.wt < 0) {
      a.wt = rnd(2, 6);
      const w = a.wander, tx = rint(w.x, w.x + w.w - 1), ty = rint(w.y, w.y + w.h - 1);
      if (!G.map.isSolid(tx, ty)) a.path = [{ x: tx * TS + 8, y: ty * TS + 12 }];
    }
  }
  if (a.bubbleRand && Math.random() < dt * 0.05) { a.bubble = pick(a.bubbleRand); a.bubbleT = 2.5; }
}
let _saveT = 0;
function updateWorld(dt) {
  G.t += dt;
  if (G.fx.flash > 0) G.fx.flash = Math.max(0, G.fx.flash - dt * 3);
  if (G.fx.shake > 0) G.fx.shake = Math.max(0, G.fx.shake - dt * 2);
  updateParts(dt);
  updateBirds(dt);
  for (const a of G.peds) updatePed(a, dt);
  for (const a of G.npcs) updateNpc(a, dt);
  for (const v of G.map.vehicles) if (v.update) v.update(dt);
  if (G.map.update) G.map.update(dt);
  if (!G.busy) {
    updatePlayer(dt);
    checkAutoTriggers();
    const scale = G.map.timeScale || 1;
    const before = Math.floor(G.S.time);
    G.S.time += dt * scale;
    const dm = Math.floor(G.S.time) - before;
    if (dm > 0) { tickStats(dm); Story.minute(); }
    _saveT += dt; if (_saveT > 60) { _saveT = 0; saveGame(true); }
  } else { G.player.moving = false; }
  updateCamera(false);
  UI.updatePrompt();
}
/* Zeit überspringen (Schlafen, Fahren, Sitzen) */
function passTime(min, opts = {}) {
  const steps = Math.ceil(min / 5);
  for (let i = 0; i < steps; i++) {
    const d = Math.min(5, min - i * 5);
    G.S.time += d;
    if (opts.sleep) { const st = G.S.st; st.energy = clamp(st.energy + d * (opts.rate || 0.22), 0, 100); st.prom = Math.max(0, st.prom - 0.2 / 60 * d); st.nau = Math.max(0, st.nau - 0.5 * d); st.food = Math.max(0, st.food - 2 / 60 * d); }
    else tickStatsQuiet(d);
  }
  UI.hud();
}

    case 'speck': R(x, 2, 5, 12, 7, '#b84a3a'); R(x, 2, 5, 12, 2, '#f4e8d8'); R(x, 2, 9, 12, 1, '#f4e8d8'); break;
    case 'choco': R(x, 3, 3, 10, 10, '#5a3420'); for (let k = 3; k < 13; k += 3) { R(x, k, 3, 1, 10, '#3a2010'); R(x, 3, k, 10, 1, '#3a2010'); } break;
    case 'pill': R(x, 3, 6, 10, 5, '#ffffff'); R(x, 8, 6, 5, 5, '#c8352d'); R(x, 3, 6, 10, 1, '#e8e8e8'); break;
    case 'cig': R(x, 2, 4, 12, 9, '#f4f0e6'); R(x, 2, 4, 12, 3, '#c8352d'); R(x, 5, 1, 2, 4, '#e8c890'); R(x, 8, 1, 2, 4, '#f4f0e6'); break;
    case 'lighter': R(x, 5, 4, 6, 10, '#2f5fb8'); R(x, 5, 2, 6, 2, '#c9ccd2'); R(x, 7, 0, 2, 2, '#ffb030'); break;
    case 'paper': R(x, 2, 3, 12, 10, '#f4f0e6'); R(x, 3, 4, 10, 2, '#1a1a1a'); for (let k = 7; k < 12; k += 2) R(x, 3, k, 10, 1, '#8a8a8a'); break;
    case 'globe': E(x, 8, 7, 5, 5, '#c8e8f8'); R(x, 6, 7, 4, 3, '#e8b830'); R(x, 4, 12, 8, 3, '#5a3a24'); break;
    case 'magnet': R(x, 3, 3, 10, 9, '#e8b830'); R(x, 4, 4, 8, 3, '#c8352d'); R(x, 4, 9, 8, 2, '#f4f0e6'); break;
    case 'card': R(x, 2, 3, 12, 10, '#f4f0e6'); R(x, 3, 4, 7, 6, '#8ec3e6'); R(x, 3, 7, 7, 3, '#7a7c86'); R(x, 11, 4, 2, 2, '#c8352d'); break;
    case 'flower': for (let k = 0; k < 6; k++) { const a = k / 6 * 6.28; E(x, 8 + Math.cos(a) * 4, 8 + Math.sin(a) * 4, 2, 1, '#f4f4f0'); } E(x, 8, 8, 2, 2, '#e8c23a'); break;
    case 'coin': E(x, 8, 8, 5, 5, '#e8c23a'); E(x, 8, 8, 3, 3, '#c8a020'); break;
    case 'shirt': R(x, 4, 3, 8, 11, '#2f5fb8'); R(x, 1, 3, 3, 5, '#2f5fb8'); R(x, 12, 3, 3, 5, '#2f5fb8'); R(x, 7, 3, 2, 2, '#f4f0e6'); break;
    case 'hat': R(x, 1, 10, 14, 2, '#3f5a3b'); R(x, 4, 4, 8, 6, '#3f5a3b'); R(x, 4, 8, 8, 1, '#c23a2a'); line(x, 12, 9, 14, 1, '#1d1d1d'); break;
    case 'pants': R(x, 4, 2, 8, 6, '#6b4423'); R(x, 4, 8, 3, 6, '#6b4423'); R(x, 9, 8, 3, 6, '#6b4423'); R(x, 5, 2, 1, 6, '#3a2010'); R(x, 10, 2, 1, 6, '#3a2010'); break;
    case 'shoe': R(x, 2, 8, 12, 5, '#5a3a1e'); R(x, 2, 12, 12, 1, '#2a1a10'); R(x, 4, 6, 5, 3, '#5a3a1e'); break;
    case 'glasses': R(x, 1, 6, 6, 4, '#18181c'); R(x, 9, 6, 6, 4, '#18181c'); R(x, 7, 7, 2, 1, '#18181c'); P(x, 2, 7, '#5a6070'); break;
    case 'cap': E(x, 8, 8, 6, 4, '#c8352d'); R(x, 2, 8, 12, 4, '#c8352d'); R(x, 9, 11, 7, 2, '#8a1e1a'); break;
    case 'scissors': line(x, 3, 3, 12, 12, '#c9ccd2'); line(x, 12, 3, 3, 12, '#c9ccd2'); E(x, 3, 13, 2, 2, '#c8352d'); E(x, 12, 13, 2, 2, '#c8352d'); break;
    case 'ticket': R(x, 2, 4, 12, 8, '#f4f0e6'); R(x, 2, 4, 3, 8, '#c8352d'); R(x, 6, 6, 6, 1, '#1a1a1a'); R(x, 6, 9, 4, 1, '#1a1a1a'); break;
    case 'kebap': R(x, 3, 4, 10, 9, '#e8c890'); R(x, 4, 6, 8, 3, '#8a4a2a'); R(x, 4, 9, 8, 1, '#3f8a3a'); R(x, 4, 10, 8, 1, '#c8352d'); break;
    default: R(x, 3, 3, 10, 10, '#8a9096');
  }
  ICON_CACHE[icon] = c.toDataURL();
  return ICON_CACHE[icon];
}

const UI = {
  els: {}, dlgOpen: false, _dlgResolve: null, _typing: null, _choices: null, _sel: 0, ovOpen: false,
  init() {
    for (const id of ['hud', 'hClock', 'hDay', 'hPlace', 'hEur', 'hChf', 'hProm', 'boardText', 'boardGl', 'toasts', 'dialog', 'dlgPort', 'dlgName', 'dlgText', 'dlgChoices', 'overlay', 'fade', 'fadeText', 'touch', 'btnA', 'actLabel', 'coaster', 'btnPhone']) this.els[id] = document.getElementById(id);
    this.els.dialog.addEventListener('pointerdown', (e) => { if (e.target.closest('.choice')) return; e.preventDefault(); this.dlgAdvance(); });
    this.els.btnPhone.addEventListener('click', () => { if (!G.busy && !this.ovOpen) Phone.open(); });
  },
  /* ---- HUD ---- */
  hud() {
    if (!G.S) return;
    const e = this.els, st = G.S.st;
    e.hClock.textContent = clockStr();
    const cd = calDate();
    e.hDay.textContent = `${dayStr()} ${cd.d}.${cd.m}.` + (dayOf(G.S.time) ? ' · Tag ' + (dayOf(G.S.time) + 1) : '');
    e.hPlace.textContent = G.map ? G.map.name : '';
    e.hEur.textContent = fmtEur(G.S.money.eur);
    e.hChf.textContent = fmtChf(G.S.money.chf);
    e.hProm.textContent = promStr();
    e.hProm.style.color = st.prom > 2 ? 'var(--bad)' : st.prom > 1.2 ? 'var(--warn)' : st.prom > 0.5 ? 'var(--amber)' : 'var(--ink)';
    const setBar = (id, v, inv) => { const el = document.getElementById(id).querySelector('i'); el.style.setProperty('--v', Math.round(v) + '%'); const good = inv ? 100 - v : v; el.style.setProperty('--c', good > 55 ? 'var(--ok)' : good > 25 ? 'var(--warn)' : 'var(--bad)'); };
    setBar('bEnergy', st.energy); setBar('bFood', st.food); setBar('bMood', st.mood);
    e.boardText.textContent = Story.objective();
    e.boardGl.textContent = Story.objectiveTag();
    this.drawCoaster();
  },
  drawCoaster() {
    const cv = this.els.coaster, x = cv.getContext('2d');
    const n = G.S.beers;
    if (this._lastBeers === n) return;
    this._lastBeers = n;
    x.clearRect(0, 0, 44, 44);
    const groups = Math.floor(n / 5), rest = n % 5;
    let gx = 7, gy = 10;
    x.fillStyle = '#2a2a3a';
    const drawGroup = (k, full) => { for (let i = 0; i < k; i++) x.fillRect(gx + i * 3, gy, 1.5, 9); if (full) { x.save(); x.translate(gx - 1, gy + 7); x.rotate(-0.55); x.fillRect(0, 0, 16, 1.5); x.restore(); } gx += 15; if (gx > 33) { gx = 7; gy += 12; } };
    for (let i = 0; i < Math.min(groups, 4); i++) drawGroup(4, true);
    if (groups < 4) drawGroup(rest, false);
    if (n === 0) { x.fillStyle = '#c8352d'; x.font = 'bold 10px Barlow Semi Condensed, sans-serif'; x.textAlign = 'center'; x.fillText('PROST', 22, 26); }
    if (n > 20) { x.fillStyle = '#c8352d'; x.font = 'bold 11px Barlow Semi Condensed, sans-serif'; x.textAlign = 'center'; x.fillText(n, 22, 40); }
  },
  toast(html, type = '') {
    const d = document.createElement('div');
    d.className = 'toast ' + type;
    d.innerHTML = html;
    this.els.toasts.appendChild(d);
    while (this.els.toasts.children.length > 3) this.els.toasts.firstChild.remove();
    setTimeout(() => { d.classList.add('out'); setTimeout(() => d.remove(), 350); }, type === 'ach' ? 4200 : 3300);
  },
  /* ---- Sprecher ---- */
  speaker(sp) {
    if (!sp) return null;
    if (sp === 'me') return { name: G.S.name, look: G.S.look };
    if (typeof sp === 'string') {
      if (FRIENDS[sp]) return { name: FRIENDS[sp].name, look: FRIENDS[sp].look, bg: FRIENDS[sp].bg };
      const n = G.npcs.find((a) => a.name && a.name.startsWith(sp));
      if (n) return { name: sp, look: n.look };
      let h = 7; for (const ch of sp) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      return { name: sp, look: npcLook(h) };
    }
    return sp;
  },
  showDlg(sp) {
    const s = this.speaker(sp);
    const d = this.els.dialog;
    d.hidden = false;
    this.dlgOpen = true;
    this.els.touch.querySelector('#btnA').classList.add('idle');
    if (s && s.look) {
      d.classList.remove('noport');
      const pc = this.els.dlgPort.getContext('2d');
      pc.imageSmoothingEnabled = false;
      pc.clearRect(0, 0, 64, 64);
      pc.drawImage(portraitCanvas(s.look, s.bg || '#2a3a52'), 0, 0);
    } else d.classList.add('noport');
    this.els.dlgName.textContent = s ? s.name : '';
    this.els.dlgName.hidden = !s;
  },
  type(text) {
    const el = this.els.dlgText;
    return new Promise((res) => {
      el.innerHTML = '';
      const full = text;
      let i = 0;
      const plain = full.replace(/<[^>]+>/g, '');
      if (plain.length > 0 && Snd.on) Snd.sfx('talk');
      const step = () => {
        i += 2;
        if (i >= plain.length) { el.innerHTML = full; this._typing = null; res(); return; }
        el.textContent = plain.slice(0, i);
        if (i % 12 === 0) Snd.sfx('talk');
        this._typing = { t: setTimeout(step, 22), finish: () => { clearTimeout(this._typing.t); el.innerHTML = full; this._typing = null; res(); } };
      };
      step();
    });
  },
  async say(sp, text) {
    this.showDlg(sp);
    this.els.dlgChoices.innerHTML = '';
    await this.type(text);
    const more = document.createElement('span'); more.className = 'dlg-more'; more.textContent = '▼'; this.els.dlgText.appendChild(more);
    await new Promise((res) => { this._dlgResolve = res; });
    this.hideDlg();
  },
  dlgAdvance() {
    if (!this.dlgOpen) return;
    if (this._typing) { this._typing.finish(); return; }
    if (this._choices) return;
    if (this._dlgResolve) { const r = this._dlgResolve; this._dlgResolve = null; Snd.sfx('blip'); r(); }
  },
  hideDlg() { this.els.dialog.hidden = true; this.dlgOpen = false; this.els.btnA.classList.remove('idle'); },
  async ask(sp, text, opts) {
    this.showDlg(sp);
    this.els.dlgChoices.innerHTML = '';
    await this.type(text);
    return new Promise((res) => {
      const box = this.els.dlgChoices;
      const items = opts.map((o) => (typeof o === 'string' ? { t: o } : o));
      this._choices = items;
      this._sel = items.findIndex((o) => !o.disabled);
      items.forEach((o, i) => {
        const b = document.createElement('button');
        b.className = 'choice';
        b.innerHTML = `<span>${o.t}</span>${o.r ? `<small>${o.r}</small>` : ''}`;
        if (o.disabled) b.disabled = true;
        b.addEventListener('click', (e) => { e.stopPropagation(); pickC(i); });
        box.appendChild(b);
      });
      const pickC = (i) => { if (items[i].disabled) return; Snd.sfx('blip'); this._choices = null; this._pick = null; this.hideDlg(); this.els.dlgChoices.innerHTML = ''; res(i); };
      this._pick = pickC;
      this.markSel();
    });
  },
  markSel() { [...this.els.dlgChoices.children].forEach((b, i) => b.classList.toggle('sel', i === this._sel)); },
  dlgKey(code) {
    if (!this.dlgOpen) return false;
    if (this._choices) {
      const n = this._choices.length;
      if (code === 'ArrowDown' || code === 'KeyS') { do { this._sel = (this._sel + 1) % n; } while (this._choices[this._sel].disabled); this.markSel(); }
      else if (code === 'ArrowUp' || code === 'KeyW') { do { this._sel = (this._sel - 1 + n) % n; } while (this._choices[this._sel].disabled); this.markSel(); }
      else if (code === 'Enter' || code === 'Space' || code === 'KeyE') this._pick(this._sel);
      else if (/^Digit[1-9]$/.test(code)) { const i = +code.slice(5) - 1; if (i < n) this._pick(i); }
      else if (code === 'Escape') { const i = this._choices.length - 1; this._pick(i); }
      return true;
    }
    if (['Enter', 'Space', 'KeyE', 'Escape'].includes(code)) this.dlgAdvance();
    return true;
  },
  /* ---- Überblenden ---- */
  fadeOut(text = '') { this.els.fadeText.textContent = text; this.els.fade.classList.add('on'); return sleep(380); },
  fadeIn() { this.els.fade.classList.remove('on'); return sleep(300); },
  async card(text, ms = 1600) { await this.fadeOut(text); await sleep(ms); await this.fadeIn(); },
  /* Spiel verloren: Es gibt nur den Neustart. */
  gameOver(title, text) {
    const html = `<div class="panel"><div class="panel-head"><h2>${title}</h2></div><div class="panel-body">
      <p class="note">${text}</p>
      <p class="note">Der Ausflug ist vorbei, bevor er angefangen hat. Der Spielstand wird gelöscht – versuch es nochmal.</p>
      </div><div class="panel-foot"><span>Game Over</span><button class="btn primary" id="goRestart">Von vorne anfangen</button></div></div>`;
    const o = this.overlay(html, null);
    o.querySelector('#goRestart').addEventListener('click', () => { clearSave(); try { localStorage.removeItem(SAVE_KEY + '-img'); } catch (e) {} location.reload(); });
    G.mode = 'over';
  },
  /* ---- Overlay ---- */
  overlay(html, onClose) {
    const o = this.els.overlay;
    o.innerHTML = html;
    o.hidden = false;
    document.body.classList.add('ov');
    this.ovOpen = true;
    this._ovClose = onClose;
    G.busy++;
    o.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => this.closeOverlay()));
    return o;
  },
  closeOverlay() {
    if (!this.ovOpen) return;
    const o = this.els.overlay;
    o.hidden = true; o.innerHTML = '';
    document.body.classList.remove('ov');
    this.ovOpen = false;
    G.busy = Math.max(0, G.busy - 1);
    const f = this._ovClose; this._ovClose = null;
    if (f) f();
    this.hud();
  },
  /* ---- Aktionshinweis ---- */
  updatePrompt() {
    const l = this.els.actLabel;
    if (G.busy || !G.map) { l.hidden = true; return; }
    const it = findInteraction();
    if (it) { l.hidden = false; const lbl = it.label || ''; if (l._t !== lbl) { l.innerHTML = `<kbd>${Input.touch ? 'A' : 'E'}</kbd>${lbl}`; l._t = lbl; } }
    else l.hidden = true;
  },
  /* ---- Laden ---- */
  shop(def) {
    return new Promise((resolve) => {
      const cur = def.cur || 'eur';
      const render = () => {
        const money = cur === 'eur' ? fmtEur(G.S.money.eur) : fmtChf(G.S.money.chf);
        let body = '';
        for (const sec of def.sections) {
          body += `<div class="shop-sec">${sec.t}</div>`;
          for (const it of sec.items) {
            const item = ITEMS[it.id] || {};
            const price = it.price;
            const ok = canPay(cur, price) && (!it.cond || it.cond());
            const priceTxt = cur === 'eur' ? fmtEur(price) : fmtChf(price);
            const consumable = ['drink', 'food', 'med'].includes(item.t) && !it.special && def.mode === 'eat';
            const have = G.S.inv[it.id] ? `<span class="have">🎒 ${G.S.inv[it.id]}</span>` : '';
            const btns = consumable
              ? `<button class="btn buy" data-i="${it.key}" ${ok ? '' : 'disabled'} title="Jetzt ${item.t === 'food' ? 'essen' : 'trinken'}">${priceTxt}</button><button class="btn take" data-i="${it.key}" ${ok ? '' : 'disabled'} title="Mitnehmen (in die Tasche)">🎒</button>`
              : `<button class="btn buy" data-i="${it.key}" ${ok ? '' : 'disabled'}>${priceTxt}</button>`;
            body += `<div class="shop-item ${ok ? '' : 'off'}"><img alt="" src="${itemIconURL(it.icon || item.icon)}"><span><span class="nm">${it.n || item.n}${have}</span><br><span class="ds">${it.d || itemDesc(it.id)}</span></span><span class="pr">${btns}</span></div>`;
          }
        }
        const foot = def.foot || (def.mode === 'eat' ? 'Preis = jetzt konsumieren · 🎒 = mitnehmen' : def.mode === 'take' ? 'Gekauftes landet in der Tasche (Handy)' : 'Tippen zum Kaufen');
        return `<div class="panel"><div class="panel-head"><h2>${def.title}</h2><span class="sub">${money}</span><button class="x-btn" data-close aria-label="Schliessen">×</button></div><div class="panel-body">${def.intro ? `<p class="note">${def.intro}</p>` : ''}${body}</div><div class="panel-foot"><span>${foot}</span><button class="btn" data-close>Fertig</button></div></div>`;
      };
      const flat = {};
      let k = 0;
      for (const sec of def.sections) for (const it of sec.items) { it.key = k; flat[k++] = it; }
      const o = this.overlay(render(), resolve);
      const wire = () => {
        o.querySelectorAll('.shop-item .buy, .shop-item .take').forEach((b) => b.addEventListener('click', async () => {
          const it = flat[b.dataset.i];
          const done = await Story.buy(def, it, cur, { take: b.classList.contains('take') });
          if (done === 'close') { this.closeOverlay(); return; }
          const scroll = o.querySelector('.panel-body').scrollTop;
          o.innerHTML = render(); o.querySelector('.panel-body').scrollTop = scroll;
          o.querySelectorAll('[data-close]').forEach((x) => x.addEventListener('click', () => this.closeOverlay()));
          wire();
          this.hud();
        }));
      };
      wire();
    });
  },
};
function itemDesc(id) {
  const it = ITEMS[id]; if (!it) return '';
  const p = [];
  if (it.t === 'ticket') p.push('12 Personen, 2. Klasse, gültig heute');
  if (it.alc) p.push('Alkohol');
  if (it.food) p.push(it.food >= 50 ? 'macht richtig satt' : it.food >= 25 ? 'macht satt' : 'Snack');
  if (it.en > 10) p.push('weckt auf');
  if (it.nau < -20) p.push('beruhigt den Magen');
  if (it.hang) p.push('gegen Kater');
  if (it.water) p.push('Wasser');
  if (it.t === 'souv') p.push('Andenken');
  return p.join(' · ');
}

  away(id) {

  schedule(id) {
    if (this.away(id)) return null;
    const h = hourOf(G.S.time);
    const o = G.S.flags.group;
    if (o && G.S.time < o.until && o.ids.includes(id)) return o.loc;
    if (!stageAt('bar')) return null;
    if (G.S.stage === 'bar') return 'bar';
    if (h >= 2.5 && h < 9) return 'hotel';
    if (h >= 9 && h < 11) return ['kassier', 'gourmet', 'anwalt', 'muskel'].includes(FRIENDS[id].fn) ? 'breakfast' : 'hotel';
    if (h >= 14 && h < 17 && FRIENDS[id].fn === 'pilot') return 'city';
    if (h >= 22 || h < 2.5) {
      if (['party', 'taenzer', 'charmeur', 'raucher'].includes(FRIENDS[id].fn)) return 'club';
      if (['saeufer', 'kanadier'].includes(FRIENDS[id].fn) && h >= 22 && h < 24) return 'stueberl';
      if (h < 2) return 'bar';
      return 'hotel';
    }
    return 'bar';
  },
  friendActor(id, tx, ty, dir, pose = 'stand', extra = {}) {
    const f = FRIENDS[id], p = T2P(tx, ty);
    return new Actor(Object.assign({ id, friend: true, name: f.name, look: f.look, x: p.x, y: p.y, dir, pose, solid: true, talk: () => Story.talkFriend(id), keepDir: pose === 'sit', label: 'Reden: ' + f.name, sitIdle: pose === 'sit' }, extra));
  },
  populate(m) {
    const ids = Object.keys(FRIENDS).filter((id) => !this.away(id));
    const add = (id, tx, ty, dir, pose, extra) => { if (FRIENDS[id]) G.npcs.push(this.friendActor(id, tx, ty, dir, pose, extra)); };
    const s = G.S.stage;
    if (m.id === 'luzern' && s === 'board') {
      /* Der Raucher steht noch vor dem Bahnhof – und wird den Zug verpassen */
      add(latecomer(), 17, 9, 0, 'stand', { bubbleRand: ['dots'] });
      return;
    }
    if (m.id === 'luzern' && s === 'meet') {
      const spots = [[14, 15, 0], [16, 15, 0], [18, 15, 0], [20, 15, 1], [13, 14, 2], [21, 14, 1], [15, 16, 3], [19, 16, 3], [17, 16, 3]];
      const org = who('kassier'), party = who('party'), foto = who('foto');
      let k = 0;
      for (const id of ids) {
        if (id === party) { add(id, 5, 12, 3, 'stand', { bubbleRand: ['beer'] }); continue; }
        if (id === foto) { add(id, 12, 20, 0, 'stand', { bubbleRand: ['!'] }); continue; }
        const sp = spots[k++ % spots.length];
        add(id, sp[0], sp[1], sp[2], 'stand', { bubbleRand: id === org ? ['?'] : ['dots', 'note'] });
      }
      return;
    }
    if (m.id === 'luzern_halle' && s === 'board') {
      let k = 0;
      for (const id of ids) { const x = 11 + (k % 6), y = 9 + Math.floor(k / 6); add(id, x, y, 3, 'stand'); k++; }
      return;
    }
    if (m.id === 'zug' && (s === 'ride' || s === 'arrived')) {
      if (s === 'arrived') { let k = 0; for (const id of ids) { add(id, 41 + (k % 3), 2 + Math.floor(k / 3), 3, 'stand'); k++; } return; }
      const tm = trainState().tm;
      const seats = [[46, 3, 2], [46, 2, 2], [48, 2, 1], [46, 5, 2], [48, 5, 1], [46, 6, 2], [48, 6, 1], [50, 2, 2], [52, 2, 1], [50, 3, 2], [52, 3, 1]];
      const jassP = who('jass');
      const order = [jassP, ...ids.filter((x) => x !== jassP)];
      let k = 0;
      for (const id of order) {
        if (FRIENDS[id].fn === 'gourmet' && tm > 20 && tm < 110) { add(id, 30, 4, 0, 'stand', { drinkIdle: true }); continue; }
        if (FRIENDS[id].fn === 'saeufer' && tm > 40 && tm < 140) { add(id, 27, 4, 0, 'drink', { drinkIdle: true }); continue; }
        const st = seats[k++];
        if (!st) break;
        add(id, st[0], st[1], st[2], 'sit', { bubbleRand: ['card', 'dots', 'zzz'] });
      }
      return;
    }
    if (m.id === 'ibk') {
      for (const id of ids) if (this.schedule(id) === 'city') add(id, 33, 38, 3, 'stand', { bubbleRand: ['!'] });
      return;
    }
    const here = ids.filter((id) => this.schedule(id) === m.id);
    if (m.id === 'bar') {
      const table = [[9, 8, 2], [9, 9, 2], [13, 8, 1], [13, 9, 1], [10, 7, 0], [12, 7, 0], [10, 10, 3], [12, 10, 3]];
      let k = 0;
      for (const id of here) {
        const fn = FRIENDS[id].fn;
        if (id === who('darts') && hash(dayOf(G.S.time), Math.floor(hourOf(G.S.time))) > 0.4) { add(id, 19, 4, 3, 'stand', { bubbleRand: ['!'] }); continue; }
        if (fn === 'frech' && here.length > 4) { add(id, 13, 5, 2, 'stand', { bubbleRand: ['!', 'note'] }); continue; }
        if (fn === 'saeufer') { add(id, 4, 6, 3, 'drink', { drinkIdle: true, bubbleRand: ['beer'] }); continue; }
        const t = table[k++];
        if (t) add(id, t[0], t[1], t[2], 'sit', { drinkIdle: true, bubbleRand: ['beer', 'note', 'card'] });
        else add(id, 15 + (k % 4), 12, 3, 'stand', { drinkIdle: true });
      }
      return;

    if (m.id === 'club') {
      const spots = [[11, 8], [13, 9], [10, 10], [14, 7]];

        if (fn === 'raucher') { add(id, 3, 14, 0, 'stand', { bubbleRand: ['dots'] }); continue; }
        if (fn === 'charmeur') { add(id, 21, 6, 1, 'stand', { drinkIdle: true, bubbleRand: ['heart'] }); continue; }

    if (m.id === 'hotel_lobby') { const b = ids.filter((id) => this.schedule(id) === 'breakfast'); b.slice(0, 4).forEach((id, k) => add(id, 2 + (k % 2), k < 2 ? 9 : 11, 3, 'sit', { bubbleRand: ['dots'] })); }
  },
  friendsHere() { return G.npcs.filter((n) => n.friend && !n.hidden).map((n) => n.id); },
  _lastHour: -1,
  minute() {
    const h = Math.floor(hourOf(G.S.time));
    const m = G.map;
    if (!stageAt('ride')) {
      if (G.S.time >= DEP_TIME) { this.missedTrain(); return; }
      const left = DEP_TIME - Math.floor(G.S.time);
      if ([10, 5, 2].includes(left) && !G.S.flags['dep' + left]) {
        G.S.flags['dep' + left] = 1; Snd.sfx('ding');
        UI.toast(`🔊 Noch ${left} Minuten bis zur Abfahrt des IR 70 auf Gleis 4${hasInv('billett') ? '' : ' – und du hast noch kein Billett'}!`, 'warn');
      }
    }
    if (h !== this._lastHour) {
      const prev = this._lastHour;
      this._lastHour = h;
      if (prev >= 0 && ['bar', 'club', 'stueberl', 'hotel_lobby', 'ibk'].includes(m.id) && !G.busy) {
        const before = this.friendsHere().sort().join();
        G.npcs = G.npcs.filter((n) => !n.friend);
        this.populate(m);
        const after = this.friendsHere().sort().join();
        if (before !== after && m.id !== 'ibk') {
          const left = before.split(',').filter((x) => x && !after.includes(x));
          if (left.length) UI.toast(`${left.map(fname).join(', ')} ${left.length > 1 ? 'ziehen' : 'zieht'} weiter.`);
        }
      }
      const closing = { bar: 'bar', club: 'club', stueberl: 'stueberl' }[m.id];
      if (closing && !isOpen(closing) && !G.busy) this.closingTime(closing);
    }
  },

    if (st.wet > 0) p.push(fl.bathAt && G.S.time - fl.bathAt < 120 ? 'Du hast im Leopoldsbrunnen gebadet?! Legende!' : 'Bist du in den Inn gefallen? Du bist ja klatschnass!');

  async meetTalk(id) {
    const fl = G.S.flags, org = who('kassier'), party = who('party'), foto = who('foto');
    fl.met[id] = 1;
    if (id === party && !fl.gotBeer) {
      fl.gotBeer = 1; addInv('dosenbier');
      await this.say(id, 'Hoi! Ich hab Reiseproviant geholt. Da, ein Dosenbier für dich – aber erst im Zug aufmachen!');
    } else if (id === foto) {
      await this.say(id, 'Schau dir das Licht über dem See an! Mach doch auch ein Foto – von der Kapellbrücke und vom Torbogen. Stell dich einfach davor.');
    } else if (id === org && !playerIsKassier()) {
      await this.say(id, `Hoi ${G.S.name}! Die Hotelreservation hab ich: Hotel Zirbe in der Altstadt. Aber das Gruppenbillett kaufst du – du bist heute für die Fahrkarten zuständig.`);
      if (!fl.gotCash) { fl.gotCash = 1; addMoney('chf', TICKET_CASH); Snd.sfx('coin'); await this.say(id, `Hier, ${TICKET_CASH} Franken aus der Gruppenkasse. Der Automat ist in der Bahnhofshalle. Und bitte: vor 9:10!`); UI.toast(`+${TICKET_CASH} CHF aus der Gruppenkasse`); }
    } else await this.say(id, this.line(id));
    const need = [party, foto].concat(playerIsKassier() ? [] : [org]);
    const metCount = Object.keys(fl.met).length;
    if (need.every((x) => fl.met[x]) && metCount >= 4) {
      const lead = playerIsKassier() ? party : org;
      const late = latecomer();
      await this.say(lead, `Alle da! ${G.S.name}, du holst das Gruppenbillett am Automaten in der Halle. Wir gehen schon mal auf Gleis 4 – der IR nach Zürich fährt um 9:10, pünktlich!`);
      await this.say(late, 'Ich rauch noch schnell eine vor dem Bahnhof. Geht schon vor, ich komm dann nach!');
      for (const n of G.npcs) if (n.friend) n.hidden = true;
      this.setStage('board');
      G.npcs = G.npcs.filter((n) => !n.friend); this.populate(G.map);
      UI.toast(hasInv('billett') ? 'Die Jungs gehen zum Gleis. Durch den Bahnhof zu Gleis 4!' : 'Die Jungs gehen zum Gleis. Kauf das Billett am Automaten in der Halle – bis 9:10!');
    } else {
      const left = need.filter((x) => !fl.met[x]).map(fname);
      if (left.length) UI.toast(`Noch nicht begrüsst: ${left.join(', ')}`);
      else if (metCount < 4) UI.toast(`Begrüss noch ${4 - metCount} weitere Kollegen.`);
    }
  },

    if (hasInv('dosenbier')) opts.push({ t: `${FRIENDS[id].name} ein Dosenbier geben`, k: 'give' });

    if (hasInv('billett')) { await this.say(null, 'Du hast das Gruppenbillett schon in der Tasche. Ab auf Gleis 4!'); return; }
    if (stageAt('ride')) { await this.say(null, 'Der Automat zeigt „Ausser Betrieb“.'); return; }
    const c = await this.ask('Billettautomat', 'SBB Billettautomat. Bitte wählen:', [
      { t: 'Gruppenbillett Luzern–Innsbruck Hbf, 12 Personen, 2. Klasse', r: fmtChf(TICKET_PRICE) },
      { t: 'Gruppenbillett 1. Klasse, 12 Personen', r: fmtChf(TICKET_PRICE * 2) },
      { t: 'Einzelbillett Luzern–Innsbruck Hbf', r: fmtChf(78) },
      { t: 'Abbrechen' },
    ]);
    if (c === 3) return;
    if (c === 2) { await this.say('me', 'Ein Billett für mich allein? Und die anderen elf? Nein, ich bin für alle zuständig.'); return; }
    const price = c === 1 ? TICKET_PRICE * 2 : TICKET_PRICE;
    if (!canPay('chf', price)) { Snd.sfx('error'); await this.say('Billettautomat', `Guthaben nicht ausreichend. Du hast ${fmtChf(G.S.money.chf)}, das Billett kostet ${fmtChf(price)}.`); if (c === 1) await this.say('me', 'Erste Klasse mit der Gruppenkasse? Das hätte der Kassier sowieso nie durchgehen lassen.'); return; }
    pay('chf', price);
    addInv('billett');

  async boardTrain() {
    const s = G.S.stage;
    if (s === 'meet') { await this.say(null, 'Du solltest zuerst die Jungs beim Torbogen treffen.'); return; }

      Snd.sfx('error');

  _announced: {},
  trainUpdate(dt) {
    if (G.S.stage !== 'ride') { _trainScroll += 0; return; }
    const ts = trainState();
    const speed = ts.moving ? 260 : 0;
    _trainScroll += speed * dt;
    G.map.timeScale = G.player.pose === 'sit' && G.player.seated ? 5 : 1.6;
    for (const st2 of TRAIN_STOPS) {
      const k = 'n' + st2.n;
      if (ts.tm > st2.t - 5 && ts.tm < st2.t && !this._announced[k] && st2.t > 0) { this._announced[k] = 1; UI.toast(`🔊 Nächster Halt: <b>${st2.n}</b>`); Snd.sfx('ding'); }
    }
    if (ts.scene === 'tunnel' && !this._announced.tunnel) { this._announced.tunnel = 1; UI.toast('Arlbergtunnel – über zehn Kilometer durch den Berg.'); }
    if (ts.tm > 25 && !G.S.flags.ticketCheck && !G.busy) { G.S.flags.ticketCheck = 1; this.ticketCheck(); }
    if (ts.tm >= 216 && G.S.stage === 'ride' && !G.busy) this.arrive();
  },

    G.busy++;
    const cond = { name: 'Zugbegleiterin', look: npcLook(951, { hat: 8, hatCol: 2, top: 9, topCol: 1, hair: 9, beard: 0 }) };
    await this.say(cond, 'Grüß Gott, die Fahrkarten bitte!');
    await this.say('me', 'Hier, das Gruppenbillett für zwölf Personen.');
    if (G.S.flags.late) {

    }
    await this.say(cond, 'Danke, passt. Gute Weiterfahrt nach Innsbruck – und viel Spass!');
    G.busy--;
  },

    const pos = T2P(48, 3);

  async sleep(mins, where = 'bed') {
    const st = G.S.st;
    G.player.pose = 'sit';
    if (mins == null) {
      const t = G.S.time, d = dayOf(t), h = hourOf(t);

      mins = wake - t;
    }

    await UI.fadeOut(mins > 300 ? 'Gute Nacht …' : 'Zzz …');
    passTime(mins, { sleep: true, rate: mins > 300 ? 0.3 : 0.38 });

  /* ---------- Taxi ---------- */
  TAXI: [
    { k: 'hotel', n: 'Hotel Zirbe', to: ['ibk', 'hotel_out'], x: 19, y: 47 },
    { k: 'bar', n: 'Gamsbock Bar', to: ['ibk', 'bar_out'], x: 43, y: 65 },

    { k: 'bahn', n: 'Nordkettenbahn (Congress)', to: ['ibk', 'hbb_out'], x: 77, y: 33 },
  ],
  playerCityPos() {
    const m = G.map.id;
    const venue = { hotel_lobby: [19, 47], hotel_floor: [19, 47], hotel_room: [19, 47], bar: [43, 65], stueberl: [25, 47], club: [70, 65] }[m];
    if (venue) return venue;
    return [G.player.x / TS, G.player.y / TS];
  },
  async taxi(o = {}) {
    if (!(G.map.city === 'ibk' || ['hotel_lobby', 'hotel_floor', 'hotel_room', 'bar', 'stueberl', 'club'].includes(G.map.id))) { await this.say(null, 'Hier fährt kein Innsbrucker Taxi hin.'); return; }
    const [px, py] = this.playerCityPos();
    const here = this.friendsHere();
    const dests = this.TAXI.map((d) => { const dist = Math.hypot(d.x - px, d.y - py); return Object.assign({}, d, { price: Math.round((4.7 + dist * 0.22) * 10) / 10, dist }); }).filter((d) => d.dist > 4);
    if (!dests.length) { await this.say(null, 'Du bist ja schon fast da. Zu Fuss geht\'s schneller.'); return; }
    const c = await this.ask('Taxi-Zentrale', 'Taxi Innsbruck, grüß Gott! Wohin soll\'s gehen?', dests.map((d) => ({ t: d.n, r: fmtEur(d.price) })).concat([{ t: 'Doch nicht' }]));
    if (c >= dests.length) return;
    const d = dests[c];
    let group = [];
    if (here.length) {
      const c2 = await this.ask(null, `Mitfahrer? Hier sind gerade ${here.map(fname).join(', ')}.`, o.group ? [{ t: `Gemeinsam fahren (${Math.min(here.length, 7) + 1} Personen, Kosten teilen)` }, { t: 'Allein fahren' }] : [{ t: 'Allein fahren' }, { t: `Gemeinsam fahren (${Math.min(here.length, 7) + 1} Personen, Kosten teilen)` }]);
      const together = o.group ? c2 === 0 : c2 === 1;
      if (together) group = here.slice(0, 7);
    }
    const cars = group.length > 3 ? 2 : 1;
    const total = d.price * cars;
    const share = Math.round((total / (group.length + 1)) * 100) / 100;
    if (!pay('eur', share)) { await this.say(null, 'Du hast nicht genug Geld fürs Taxi.'); return; }
    if (group.length) {
      for (const id of group) G.S.aff[id] = clamp(G.S.aff[id] + 2, 0, 100);
      const loc = { hotel: 'hotel', bar: 'bar', stueberl: 'stueberl', club: 'club' }[d.k];
      if (loc) G.S.flags.group = { loc, ids: group, until: G.S.time + 150 };
    }
    const driver = pick(['Der Fahrer erzählt von seinem Cousin in Zürich.', 'Im Radio läuft Schlager, der Fahrer singt mit.', 'Der Fahrer fährt, als wäre er im Ski-Weltcup.', 'Der Fahrer schimpft über die Baustellen am Südring.']);
    await UI.fadeOut(`🚕 ${group.length ? `${cars > 1 ? 'Zwei Taxis' : 'Taxi'} mit ${group.map(fname).join(', ')}` : 'Taxi'} → ${d.n}`);
    await sleep(900);
    UI.els.fadeText.textContent = driver;
    passTime(Math.round(6 + d.dist * 0.15));
    await sleep(1300);
    const st = G.S.st;
    let spew = false;
    if (st.nau > 82 && Math.random() < 0.75) { spew = true; }
    enterMap(d.to[0], d.to[1]);
    await UI.fadeIn();
    UI.toast(`Taxi: ${fmtEur(total)} gesamt${group.length ? `, dein Anteil ${fmtEur(share)}` : ''}.`);
    if (spew) {
      await this.say('Taxifahrer', 'NA BITTE! Ins Auto?! Des kost\' 80 Euro Reinigungspauschale!');
      pay('eur', Math.min(80, G.S.money.eur));
      st.nau = 0; st.food = Math.max(0, st.food - 30); st.prom = Math.max(0, st.prom - 0.2); mood(-15);
      G.S.flags.vomitAt = G.S.time; achieve('kotzen');
    } else if (group.length) await this.say(group[0], pick(['Gute Idee mit dem Taxi!', 'Schneller als zu Fuss. Und wärmer.', 'Weiter geht\'s!']));
  },

  async buy(def, item, cur, opts = {}) {
    if (item.special === 'hair' || item.special === 'beard') {
      if (!pay(cur, item.price)) return;
      UI.closeOverlay();
      await Editor.open({ mode: item.special });
      achieve('frisur');
      return 'close';
    }
    if (item.wear) {
      if (item.unlock && G.S.unlocked[item.unlock]) { Object.assign(G.S.look, item.wear); UI.toast('Angezogen!'); return; }
      if (!pay(cur, item.price)) return;
      if (item.unlock) G.S.unlocked[item.unlock] = 1;

const JASS_SUIT_DE = ['Schellen', 'Rosen', 'Schilten', 'Eicheln'];
const JASS_SUIT_FR = ['Ecke', 'Herz', 'Schaufel', 'Kreuz'];
const JASS_RANK_DE = ['6', '7', '8', '9', '10', 'U', 'O', 'K', 'A'];
const JASS_RANK_FR = ['6', '7', '8', '9', '10', 'B', 'D', 'K', 'A'];
const TRUMP_RANK = { 5: 8, 3: 7, 8: 6, 7: 5, 6: 4, 4: 3, 2: 2, 1: 1, 0: 0 };
const SUIT_SVG_DE = [
  '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8" fill="#e8b830" stroke="#7a5a10" stroke-width="1.2"/><rect x="4.5" y="9" width="15" height="3.5" fill="#c8302a"/><circle cx="12" cy="17.5" r="1.6" fill="#3a2a10"/><rect x="11" y="3" width="2" height="3" fill="#7a5a10"/></svg>',

  '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h16v8c0 6-4 9-8 11-4-2-8-5-8-11z" fill="#1a1a1a" stroke="#000" stroke-width="1"/><path d="M4 3h16v5H4z" fill="#e8b830"/><path d="M12 8v14c-4-2-8-5-8-11V8z" fill="#c8302a"/></svg>',
  '<svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="15" rx="5.5" ry="7" fill="#c8902a" stroke="#6a4a10" stroke-width="1"/><path d="M5.5 11.5c0-4 3-6 6.5-6s6.5 2 6.5 6z" fill="#6a4a20" stroke="#3a2a10" stroke-width="1"/><rect x="11" y="2" width="2" height="4" fill="#3a2a10"/><path d="M13 4c3-2 6-1 7 1-3 1-5 1-7-1z" fill="#3f8a3a"/></svg>',
];
const SUIT_FR_GLYPH = ['♦', '♥', '♠', '♣'];
const suitSvg = (s) => (G.S.flags.deck === 'fr' ? `<svg viewBox="0 0 24 24" aria-hidden="true"><text x="12" y="20" font-size="22" text-anchor="middle" fill="${s < 2 ? '#c8202a' : '#1a1a1a'}">${SUIT_FR_GLYPH[s]}</text></svg>` : SUIT_SVG_DE[s]);
const suitName = (s) => (G.S.flags.deck === 'fr' ? JASS_SUIT_FR : JASS_SUIT_DE)[s];
const rankLbl = (r) => (G.S.flags.deck === 'fr' ? JASS_RANK_FR : JASS_RANK_DE)[r];
const modeName = (m) => (m.type === 'trump' ? suitName(m.s) : m.type === 'obe' ? 'Obenabe' : 'Undenufe');

const JassRules = {
  power(c, mode, lead) {
    if (mode.type === 'trump' && c.s === mode.s) return 100 + TRUMP_RANK[c.r];
    if (c.s !== lead) return -1;
    return mode.type === 'unde' ? 8 - c.r : c.r;
  },
  pts(c, mode) {
    if (mode.type === 'trump') return c.s === mode.s ? [0, 0, 0, 14, 10, 20, 3, 4, 11][c.r] : [0, 0, 0, 0, 10, 2, 3, 4, 11][c.r];
    if (mode.type === 'obe') return [0, 0, 8, 0, 10, 2, 3, 4, 11][c.r];
    return [11, 0, 8, 0, 10, 2, 3, 4, 0][c.r];
  },
  winner(trick, mode) {
    const lead = trick[0].c.s;
    let best = 0, bp = -2;
    trick.forEach((t, i) => { const p = this.power(t.c, mode, lead); if (p > bp) { bp = p; best = i; } });
    return best;
  },
  legal(hand, trick, mode) {
    if (!trick.length) return hand.slice();
    const lead = trick[0].c.s;
    const follow = hand.filter((c) => c.s === lead);
    if (mode.type !== 'trump') return follow.length ? follow : hand.slice();
    const T = mode.s;
    if (lead === T) {
      if (!follow.length) return hand.slice();
      if (follow.length === 1 && follow[0].r === 5) return hand.slice();
      return follow;
    }
    let hi = -1;
    for (const t of trick) if (t.c.s === T) hi = Math.max(hi, TRUMP_RANK[t.c.r]);
    const under = (c) => c.s === T && hi >= 0 && TRUMP_RANK[c.r] < hi;
    const opts = follow.length ? follow.concat(hand.filter((c) => c.s === T)) : hand.slice();
    const ok = opts.filter((c) => !under(c));
    return ok.length ? ok : opts;
  },
};

const Jass = {
  async play({ partner, opp }) {
    const seats = [{ id: 'me', name: G.S.name, look: G.S.look }, FRIENDS[opp[0]], FRIENDS[partner], FRIENDS[opp[1]]];
