  /* ---------- Freunde platzieren ---------- */
  /* Der Nachzügler ist nicht dabei: vor der Abfahrt raucht er vor dem Bahnhof, danach sitzt er im Taxi. */
  away(id) {
    if (id !== latecomer()) return false;
    if (G.S.stage === 'board') return true;
    return !!(G.S.flags.late && !G.S.flags.lateArrived);
  },
  /* Wo ist ein Kollege gerade? Text und Kartenpunkt für Handy-Status und Karte. */
  whereIs(id) {
    const s = G.S.stage;
    if (this.away(id)) return { t: G.S.flags.late ? 'im Taxi unterwegs nach Innsbruck' : 'raucht noch vor dem Bahnhof', x: null };
    if (!stageAt('bar')) {
      if (G.S.map === 'luzern' || s === 'meet') return { t: 'beim Torbogen in Luzern', x: null };
      if (s === 'board') return { t: 'auf Gleis 4', x: null };
      if (s === 'ride' || s === 'arrived') return { t: 'im Zug, Wagen 3', x: null };
      return { t: 'auf dem Weg ins Hotel Zirbe', x: 19, y: 46 };
    }
    const j = G.S.flags.jail;
    if (j && j.id === id && G.S.time < j.until) return { t: `auf der Polizeiwache beim Bahnhof (bis ca. ${clockStr(j.until)})`, x: 74, y: 74 };
    const loc = this.schedule(id);
    const P = { bar: ['in der Gamsbock Bar', 43, 64], stueberl: ['im Tiroler Stüberl', 25, 46], club: ['im Club Lawine', 71, 63], rouge: ['im Rouge', 65, 63], hotel: ['im Hotel Zirbe', 19, 46], breakfast: ['beim Frühstück im Hotel', 19, 46], city: ['beim Goldenen Dachl', 34, 33] };
    const e = P[loc];
    if (!e) return { t: 'irgendwo in Innsbruck', x: null };
    const sick = G.S.flags.sick && G.S.flags.sick[id] === dayOf(G.S.time - 300);
    return { t: sick && loc === 'hotel' ? 'im Hotel, schläft seinen Rausch aus' : e[0], x: e[1], y: e[2] };
  },
  schedule(id) {
    if (this.away(id)) return null;
    const h = hourOf(G.S.time);
    const o = G.S.flags.group;
    const j = G.S.flags.jail;
    if (j && j.id === id && G.S.time < j.until) return null;
    /* Wer sich übergeben hat, liegt bis zum Morgen im Hotel */
    if (G.S.flags.sick && G.S.flags.sick[id] === dayOf(G.S.time - 300) && stageAt('bar')) return 'hotel';
    if (o && G.S.time < o.until && o.ids.includes(id)) return o.loc;
    if (!stageAt('bar')) return null;
    if (G.S.stage === 'bar') return 'bar';
    if (h >= 2.5 && h < 9) return 'hotel';
    if (h >= 9 && h < 11) return ['kassier', 'gourmet', 'anwalt', 'muskel'].includes(FRIENDS[id].fn) ? 'breakfast' : 'hotel';
    if (h >= 14 && h < 17 && FRIENDS[id].fn === 'pilot') return 'city';
    if (h >= 22 || h < 2.5) {
      if (FRIENDS[id].fn === 'charmeur' && h >= 0.5 && h < 2.5) return 'rouge';
      if (['party', 'taenzer', 'charmeur', 'raucher'].includes(FRIENDS[id].fn)) return 'club';
      if (['saeufer', 'kanadier'].includes(FRIENDS[id].fn) && h >= 22 && h < 24) return 'stueberl';
      if (h < 2) return 'bar';
      return 'hotel';
    }
    return 'bar';
  },
  friendActor(id, tx, ty, dir, pose = 'stand', extra = {}) {
    const f = FRIENDS[id], p = T2P(tx, ty);
    return new Actor(Object.assign({ id, friend: true, name: f.name, look: f.look, x: p.x, y: p.y, dir, pose, solid: true, talk: () => Story.talkFriend(id), keepDir: pose === 'sit', label: 'Reden: ' + f.name, sitIdle: pose === 'sit' }, extra));
  },
  populate(m) {
    const ids = Object.keys(FRIENDS).filter((id) => !this.away(id));
    const add = (id, tx, ty, dir, pose, extra) => { if (FRIENDS[id]) G.npcs.push(this.friendActor(id, tx, ty, dir, pose, extra)); };
    const s = G.S.stage;
    if (m.id === 'luzern' && s === 'board') {
      /* Der Raucher steht noch vor dem Bahnhof – und wird den Zug verpassen */
      add(latecomer(), 17, 9, 0, 'stand', { bubbleRand: ['dots'] });
      return;
    }
    if (m.id === 'luzern' && s === 'meet') {
      const spots = [[14, 15, 0], [16, 15, 0], [18, 15, 0], [20, 15, 1], [13, 14, 2], [21, 14, 1], [15, 16, 3], [19, 16, 3], [17, 16, 3]];
      const org = who('kassier'), party = who('party'), foto = who('foto');
      let k = 0;
      for (const id of ids) {
        if (id === party) { add(id, 5, 12, 3, 'stand', { bubbleRand: ['beer'] }); continue; }
        if (id === foto) { add(id, 12, 20, 0, 'stand', { bubbleRand: ['!'] }); continue; }
        const sp = spots[k++ % spots.length];
        add(id, sp[0], sp[1], sp[2], 'stand', { bubbleRand: id === org ? ['?'] : ['dots', 'note'] });
      }
      /* Wer noch begrüsst werden muss, winkt dauerhaft mit „!“ */
      for (const n of G.npcs) if (n.friend && meetNeed().missing.includes(n.id)) { n.bubbleRand = ['!']; n.bubble = '!'; n.bubbleT = 99; }
      return;
    }
    if (m.id === 'luzern_halle' && s === 'board') {
      let k = 0;
      for (const id of ids) { const x = 11 + (k % 6), y = 9 + Math.floor(k / 6); add(id, x, y, 3, 'stand'); k++; }
      return;
    }
    if (m.id === 'zug' && (s === 'ride' || s === 'arrived')) {
      if (s === 'arrived') {
        /* Warten vor der Tür (Reihen 5–6) und an den Bistrotischen – nicht fest, damit der Spieler zur Tür durchkommt */
        const spots = [[20, 5], [21, 5], [22, 5], [20, 6], [21, 6], [22, 6], [25, 3], [27, 3], [29, 3], [31, 3], [33, 3], [35, 3]];
        let k = 0; for (const id of ids) { const sp = spots[k++ % spots.length]; add(id, sp[0], sp[1], 3, 'stand', { bubbleRand: ['!'], solid: false }); }
        return;
      }
      const tm = trainState().tm;
      const seats = [[46, 3, 2], [46, 2, 2], [48, 2, 1], [46, 5, 2], [48, 5, 1], [46, 6, 2], [48, 6, 1], [50, 2, 2], [52, 2, 1], [50, 3, 2], [52, 3, 1]];
      const jassP = who('jass');
      const order = [jassP, ...ids.filter((x) => x !== jassP)];
      let k = 0;
      for (const id of order) {
        if (FRIENDS[id].fn === 'gourmet' && tm > 20 && tm < 110) { add(id, 30, 4, 0, 'stand', { drinkIdle: true }); continue; }
        if (FRIENDS[id].fn === 'saeufer' && tm > 40 && tm < 140) { add(id, 27, 4, 0, 'drink', { drinkIdle: true }); continue; }
        const st = seats[k++];
        if (!st) break;
        add(id, st[0], st[1], st[2], 'sit', { bubbleRand: ['card', 'dots', 'zzz'] });
      }
      return;
    }
    if (m.id === 'ibk') {
      for (const id of ids) if (this.schedule(id) === 'city') add(id, 33, 38, 3, 'stand', { bubbleRand: ['!'] });
      return;
    }
    const here = ids.filter((id) => this.schedule(id) === m.id);
    if (m.id === 'bar') {
      const table = [[9, 8, 2], [9, 9, 2], [13, 8, 1], [13, 9, 1], [10, 7, 0], [12, 7, 0], [10, 10, 3], [12, 10, 3]];
      let k = 0;
      for (const id of here) {
        const fn = FRIENDS[id].fn;
        if (id === who('darts') && hash(dayOf(G.S.time), Math.floor(hourOf(G.S.time))) > 0.4) { add(id, 19, 4, 3, 'stand', { bubbleRand: ['!'] }); continue; }
        if (fn === 'frech' && here.length > 4) { add(id, 13, 5, 2, 'stand', { bubbleRand: ['!', 'note'] }); continue; }
        if (fn === 'saeufer') { add(id, 4, 6, 3, 'drink', { drinkIdle: true, bubbleRand: ['beer'] }); continue; }
        const t = table[k++];
        if (t) add(id, t[0], t[1], t[2], 'sit', { drinkIdle: true, bubbleRand: ['beer', 'note', 'card'] });
        else add(id, 15 + (k % 4), 12, 3, 'stand', { drinkIdle: true });
      }
      return;
    }
    if (m.id === 'club') {
      const spots = [[11, 8], [13, 9], [10, 10], [14, 7]];
      let k = 0;
      for (const id of here) {
        const fn = FRIENDS[id].fn;
        if (fn === 'raucher') { add(id, 3, 14, 0, 'stand', { bubbleRand: ['dots'] }); continue; }
        if (fn === 'charmeur') { add(id, 21, 6, 1, 'stand', { drinkIdle: true, bubbleRand: ['heart'] }); continue; }
        const sp = spots[k++ % 4];
        add(id, sp[0], sp[1], 0, 'stand', { danceIdle: true });
      }
      return;
    }
    if (m.id === 'stueberl') { let k = 0; for (const id of here) { add(id, 7 + k, 8, 3, 'sit', { drinkIdle: true, bubbleRand: ['beer'] }); k++; } return; }
    if (m.id === 'rouge') { let k = 0; for (const id of here) { add(id, 1 + k, 6, 0, 'sit', { drinkIdle: true, bubbleRand: ['heart', 'beer'] }); k++; } return; }
    if (m.id === 'hotel_lobby') { const b = ids.filter((id) => this.schedule(id) === 'breakfast'); b.slice(0, 4).forEach((id, k) => add(id, 2 + (k % 2), k < 2 ? 9 : 11, 3, 'sit', { bubbleRand: ['dots'] })); }
  },
  friendsHere() { return G.npcs.filter((n) => n.friend && !n.hidden).map((n) => n.id); },
  _lastHour: -1,
  minute() {
    const h = Math.floor(hourOf(G.S.time));
    const m = G.map;
    if (!stageAt('ride')) {
      if (G.S.time >= DEP_TIME) { this.missedTrain(); return; }
      const left = DEP_TIME - Math.floor(G.S.time);
      if ([10, 5, 2].includes(left) && !G.S.flags['dep' + left]) {
        G.S.flags['dep' + left] = 1; Snd.sfx('ding');
        UI.toast(`🔊 Noch ${left} Minuten bis zur Abfahrt des IR 70 auf Gleis 4${hasInv('billett') ? '' : ' – und du hast noch kein Billett'}!`, 'warn');
      }
    }
    if (h !== this._lastHour) {
      const prev = this._lastHour;
      this._lastHour = h;
      if (prev >= 0 && m.id === 'ibk' && !G.busy) for (const d of m.npcDefs) if (d.cond) { const has = G.npcs.some((n) => n.id === d.id); const want = d.cond(); if (want && !has) G.npcs.push(new Actor(Object.assign({}, d))); if (!want && has) G.npcs = G.npcs.filter((n) => n.id !== d.id); }
      if (prev >= 0 && ['bar', 'club', 'stueberl', 'rouge', 'hotel_lobby', 'ibk'].includes(m.id) && !G.busy) {
        const before = this.friendsHere().sort().join();
        G.npcs = G.npcs.filter((n) => !n.friend);
        this.populate(m);
        const after = this.friendsHere().sort().join();
        if (before !== after && m.id !== 'ibk') {
          const left = before.split(',').filter((x) => x && !after.includes(x));
          if (left.length) UI.toast(`${left.map(fname).join(', ')} ${left.length > 1 ? 'ziehen' : 'zieht'} weiter.`);
        }
      }
      const closing = { bar: 'bar', club: 'club', stueberl: 'stueberl', rouge: 'rouge' }[m.id];
      if (closing && !isOpen(closing) && !G.busy) this.closingTime(closing);
    }
    this.maybeEvent();
  },

  /* ---------- Versteckte Zufallsereignisse in der Stadt ---------- */
  tempActor(o) { const a = new Actor(Object.assign({ solid: false, speed: 70, ev: true, dir: 0 }, o)); G.npcs.push(a); return a; },
  walk(a, tx, ty) { return new Promise((res) => { a.path = [{ x: tx, y: ty }]; a.onArrive = () => res(); }); },
  dropActor(a) { G.npcs = G.npcs.filter((n) => n !== a); },
  evCount(id) { return (G.S.flags.ev && G.S.flags.ev[id]) || 0; },
  EVENTS: [
    { id: 'ueberfall', max: 1, cond: () => { const h = hourOf(G.S.time); return h >= 23 || h < 4; } },
    { id: 'polizei', max: 1, cond: () => { const h = hourOf(G.S.time); const v = Story.victim(); return v && h >= 11 && h < 23 && Story.schedule(v) && !Story.away(v); } },
    { id: 'hundkatze', max: 2, cond: () => { const h = hourOf(G.S.time); return h >= 8 && h < 20; } },
    { id: 'taube', max: 2, cond: () => { const h = hourOf(G.S.time); return h >= 7 && h < 19 && G.S.st.wet === 0; } },
    { id: 'krampus', max: 1, cond: () => { const h = hourOf(G.S.time); return h >= 17 && h < 22; } },
    { id: 'portemonnaie', max: 1, cond: () => { const h = hourOf(G.S.time); return h >= 9 && h < 21; } },
    { id: 'ufo', max: 1, cond: () => { const h = hourOf(G.S.time); return h >= 21 || h < 3; } },
    { id: 'trump', max: 1, cond: () => { const h = hourOf(G.S.time); return h >= 10 && h < 18; } },
    { id: 'verfolgung', max: 1, cond: () => { const h = hourOf(G.S.time); return h >= 9 && h < 23 && G.S.money.eur >= 20; } },
  ],
  victim() { return FRIENDS.oelu && !Story.away('oelu') ? 'oelu' : (FRIENDS.didu ? 'didu' : Object.keys(FRIENDS)[0]); },
  maybeEvent() {
    if (G.map.id !== 'ibk' || G.busy || G.mode !== 'play' || !stageAt('free') || G.live) return;
    const fl = G.S.flags;
    /* Tag 5: Godzilla und King Kong – unabhängig vom Tagesereignis, einmalig, nicht vor 10 Uhr */
    if (dayOf(G.S.time) >= 4 && hourOf(G.S.time) >= 10 && !(fl.ev && fl.ev.monster)) { fl.ev = fl.ev || {}; fl.ev.monster = 1; this.announce('monster').then(() => this.ev_monster()); return; }
    /* Tagesplan: Jeden Tag ein Ereignis, ab einer zufälligen Uhrzeit. Welches Ereignis an welchem Tag kommt, wird pro Spiel
       einmal gemischt (flags.evOrder), damit jede Reise anders verläuft. Passt das nächste geplante Ereignis zur Zeit nicht
       (z. B. UFO nur nachts), kommt das nächste passende dran; passt keines, wird jede Minute neu geprüft. */
    const day = dayOf(G.S.time);
    fl.evPlan = fl.evPlan || {};
    if (!fl.evOrder) { const ids = this.EVENTS.map((e) => e.id); for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; } fl.evOrder = ids; }
    if (fl.evPlan[day] === undefined) fl.evPlan[day] = Math.round((10 + Math.random() * 13) * 2) / 2;
    if (hourOf(G.S.time) < fl.evPlan[day]) return;
    if (fl.evDay === day) return; /* genau ein Ereignis pro Tag */
    const byOrder = fl.evOrder.map((id) => this.EVENTS.find((e) => e.id === id)).filter(Boolean);
    const pool = byOrder.filter((e) => this.evCount(e.id) < e.max && e.cond()).sort((a, b) => this.evCount(a.id) - this.evCount(b.id)); /* Wiederholungen erst, wenn alles einmal dran war */
    if (!pool.length) return;
    const e = pool[0];
    fl.ev = fl.ev || {}; fl.ev[e.id] = this.evCount(e.id) + 1; fl.lastEv = G.S.time; fl.evDay = dayOf(G.S.time);
    this.announce(e.id).then(() => this['ev_' + e.id]());
  },
  /* Jedes Ereignis beginnt mit einer kurzen Sequenz: Kinobalken fahren ein, „EREIGNIS“ blinkt, der Titel tippt sich
     Buchstabe für Buchstabe hin, Fanfare, Blitz – dann geht es in der Spielwelt los. Die Welt steht derweil (G.busy). */
  EV_TITLES: {
    ueberfall: ['Nachtschatten', 'Schritte hinter dir in der Gasse …'],
    polizei: ['Blaulicht', 'Die Polizei hat jemanden im Visier'],
    hundkatze: ['Hund gegen Katze', 'Showdown auf dem Platz'],
    taube: ['Die Taube', 'Von oben droht Gefahr'],
    krampus: ['Krampuslauf', 'Es rasselt und klirrt in den Gassen'],
    portemonnaie: ['Fundsache', 'Da liegt etwas auf dem Pflaster'],

  async roulette() {

  _announced: {},
  trainUpdate(dt) {
    if (G.S.stage !== 'ride') { _trainScroll += 0; return; }
    const ts = trainState();
    const speed = ts.moving ? 260 : 0;
    _trainScroll += speed * dt;
    G.map.timeScale = G.player.pose === 'sit' && G.player.seated ? 5 : 1.6;
    for (const st2 of TRAIN_STOPS) {
      const k = 'n' + st2.n;
      if (ts.tm > st2.t - 5 && ts.tm < st2.t && !this._announced[k] && st2.t > 0) { this._announced[k] = 1; UI.toast(`🔊 Nächster Halt: <b>${st2.n}</b>`); Snd.sfx('ding'); }
    }
    if (ts.scene === 'tunnel' && !this._announced.tunnel) { this._announced.tunnel = 1; UI.toast('Arlbergtunnel – über zehn Kilometer durch den Berg.'); }
    if (ts.tm > 25 && !G.S.flags.ticketCheck && !G.busy && !this._cond) this.conductorStart();
    if (this._cond && !G.S.flags.ticketCheck) this.conductorFollow();
    if (ts.tm >= 216 && G.S.stage === 'ride' && !G.busy) this.arrive();
  },
  /* Die Zugbegleiterin betritt den Wagen am anderen Ende und läuft durch den Gang (Reihe 4) zum Spieler. */
  _cond: null,
  conductorLook() { return npcLook(951, { hat: 8, hatCol: 2, top: 9, topCol: 1, pants: 5, pantsCol: 8, shoes: 3, shoesCol: 1, hair: 9, beard: 0, glasses: 0, acc: 5, print: 0 }); },
  conductorStart() {
    const p = G.player;
    const fromLeft = p.x > 32 * TS;
    const s = T2P(fromLeft ? 1 : 62, 4);
    const a = new Actor({ id: 'kondukteur', name: 'Zugbegleiterin', look: this.conductorLook(), x: s.x, y: s.y, dir: fromLeft ? 2 : 1, solid: false, speed: 78, label: 'Zugbegleiterin', talk: () => Story.say(a, 'Einen Moment, ich komm gleich zu Ihnen.') });

  conductorFollow() {
    const a = this._cond, p = G.player;
    const px = Math.floor(p.x / TS), py = Math.floor((p.y - 3) / TS);
    const side = a.x < p.x ? -1 : 1;
    const tgt = T2P(clamp(py === 4 ? px + side : px, 1, 62), 4);
    const d = Math.hypot(tgt.x - a.x, tgt.y - a.y);
    if (d > 2) { if (!a.path || !a.path.length || a.path[0].x !== tgt.x) a.path = [tgt]; return; }
    a.path = null; a.moving = false; a.dir = dirTo(a.x, a.y, p.x, p.y);
    if (!G.busy) { G.S.flags.ticketCheck = 1; this.ticketCheck(a); }
  },

    G.busy++;

    await this.say(cond, 'Danke, passt. Gute Weiterfahrt nach Innsbruck – und viel Spass!');
    G.busy--;

    if (actor) { /* weiter durch den Zug und am Ende des Wagens verschwinden */

      mins = wake - t;

    passTime(mins, { sleep: true, rate: mins > 300 ? 0.3 : 0.38 });

  async barTable() {
    const p = G.player;
    const pos = T2P(11, 10);
    p.x = pos.x; p.y = pos.y; p.dir = 3; p.pose = 'sit';
    const here = this.friendsHere();
    const opts = [{ t: 'Anstossen', k: 'prost' }];
    if (here.length >= 3) opts.push({ t: 'Eine Runde jassen', k: 'jass' });
    if (here.includes(who('arm'))) opts.push({ t: `Armdrücken mit ${fname(who('arm'))}`, k: 'arm' });
    opts.push({ t: 'Aufstehen', k: 'up' });
    const c = await this.ask(null, here.length ? `Am Tisch: ${here.map(fname).join(', ')}.` : 'Der Stammtisch ist leer. Die Jungs sind woanders unterwegs.', opts);
    const k = opts[c].k;
    if (k === 'prost') {
      /* Ohne Bier kein Anstossen: aus der Tasche, oder eines vom Tresen bestellen */
      const beers = Object.keys(G.S.inv).filter((id) => ITEMS[id] && ITEMS[id].beer && hasInv(id));

      const bo = beers.map((id) => ({ t: `${ITEMS[id].n} aus der Tasche`, id }));
      bo.push({ t: 'Ein Bier bestellen', r: fmtEur(price), order: true }, { t: 'Doch nicht' });
      const bc = await this.ask(null, beers.length ? 'Womit stösst du an?' : 'Anstossen ohne Glas in der Hand? Du brauchst zuerst ein Bier.', bo);
      const sel = bo[bc];
      if (!sel || (!sel.id && !sel.order)) { p.pose = 'sit'; return; }
      let beer = sel.id;
      if (sel.order) { if (!pay('eur', price)) { await this.say(null, 'Die Bedienung schaut auf die leere Hand. Kein Geld, kein Bier.'); return; } beer = 'bier'; }
      else takeInv(beer);
      Snd.sfx('clink'); p.pose = 'drink';
      for (const id of here) G.S.aff[id] = clamp(G.S.aff[id] + 1, 0, 100);
      await this.say(here[0] || null, here.length ? pick(['Proscht!', 'Zum Wohl!', 'Auf den Gruppenausflug!']) : 'Du prostest dir selbst zu. Auch schön.');
      consume(beer);
      UI.toast(`${ITEMS[beer].n} – Prost! (${G.S.st.prom.toFixed(1)} ‰)`);
      for (const id of here) await this.friendDrink(id, 0.12);
      p.pose = 'sit';
    }
    if (k === 'jass') await this.jass();
    if (k === 'arm') await this.armwrestle(who('arm'));
    if (k === 'up') { p.pose = 'stand'; p.y += 4; }

    if (!(G.map.city === 'ibk' || ['hotel_lobby', 'hotel_floor', 'hotel_room', 'bar', 'stueberl', 'club'].includes(G.map.id))) { await this.say(null, 'Hier fährt kein Innsbrucker Taxi hin.'); return; }
    const [px, py] = this.playerCityPos();
    const here = this.friendsHere();
    const dests = this.TAXI.map((d) => { const dist = Math.hypot(d.x - px, d.y - py); return Object.assign({}, d, { price: Math.round((4.7 + dist * 0.22) * 10) / 10, dist }); }).filter((d) => d.dist > 4);
    if (!dests.length) { await this.say(null, 'Du bist ja schon fast da. Zu Fuss geht\'s schneller.'); return; }
    const c = await this.ask('Taxi-Zentrale', 'Taxi Innsbruck, grüß Gott! Wohin soll\'s gehen?', dests.map((d) => ({ t: d.n, r: fmtEur(d.price) })).concat([{ t: 'Doch nicht' }]));
    if (c >= dests.length) return;
    const d = dests[c];
    let group = [];
    if (here.length) {
      const c2 = await this.ask(null, `Mitfahrer? Hier sind gerade ${here.map(fname).join(', ')}.`, o.group ? [{ t: `Gemeinsam fahren (${Math.min(here.length, 7) + 1} Personen, Kosten teilen)` }, { t: 'Allein fahren' }] : [{ t: 'Allein fahren' }, { t: `Gemeinsam fahren (${Math.min(here.length, 7) + 1} Personen, Kosten teilen)` }]);
      const together = o.group ? c2 === 0 : c2 === 1;
      if (together) group = here.slice(0, 7);
    }
    const cars = group.length > 3 ? 2 : 1;
    const total = d.price * cars;
    const share = Math.round((total / (group.length + 1)) * 100) / 100;
    if (!pay('eur', share)) { await this.say(null, 'Du hast nicht genug Geld fürs Taxi.'); return; }
    if (group.length) {
      for (const id of group) G.S.aff[id] = clamp(G.S.aff[id] + 2, 0, 100);
      const loc = { hotel: 'hotel', bar: 'bar', stueberl: 'stueberl', club: 'club', rouge: 'rouge' }[d.k];
      if (loc) G.S.flags.group = { loc, ids: group, until: G.S.time + 150 };
    }
    const driver = pick(['Der Fahrer erzählt von seinem Cousin in Zürich.', 'Im Radio läuft Schlager, der Fahrer singt mit.', 'Der Fahrer fährt, als wäre er im Ski-Weltcup.', 'Der Fahrer schimpft über die Baustellen am Südring.']);
    await Scene.play('taxi', { text: `🚕 ${group.length ? `${cars > 1 ? 'Zwei Taxis' : 'Taxi'} mit ${group.map(fname).join(', ')}` : 'Taxi'} → ${d.n}. ${driver}`, ms: 3000, keep: true });
    passTime(Math.round(6 + d.dist * 0.15));
    const st = G.S.st;
    let spew = false;
    if (st.nau > 82 && Math.random() < 0.75) { spew = true; }
    enterMap(d.to[0], d.to[1]);
    await UI.fadeIn();
    UI.toast(`Taxi: ${fmtEur(total)} gesamt${group.length ? `, dein Anteil ${fmtEur(share)}` : ''}.`);
    if (spew) {
      await this.say('Taxifahrer', 'NA BITTE! Ins Auto?! Des kost\' 80 Euro Reinigungspauschale!');
      pay('eur', Math.min(80, G.S.money.eur));
      st.nau = 0; st.food = Math.max(0, st.food - 30); st.prom = Math.max(0, st.prom - 0.2); mood(-15);
      G.S.flags.vomitAt = G.S.time; achieve('kotzen');
    } else if (group.length) await this.say(group[0], pick(['Gute Idee mit dem Taxi!', 'Schneller als zu Fuss. Und wärmer.', 'Weiter geht\'s!']));
  },

  /* ---------- Kauf & Inventar ---------- */
  async shop(id) {
    const def = SHOPS[id];
    if (def.venue && OPEN[def.venue] && !['bar', 'club', 'stueberl'].includes(def.venue) && !isOpen(def.venue)) {
      await this.say(null, `${def.title}: geschlossen. Öffnungszeiten ${hoursStr(def.venue)} Uhr${['shop', 'spar', 'apotheke', 'barbier'].includes(def.venue) ? ', sonntags zu' : ''}.`);
      return;
    }
    await UI.shop(def);
  },
  onEnter(m) {
    if (m.id === 'hotel_lobby' && G.S.stage === 'findHotel') this.setStage('checkin');
    if (m.id === 'bar' && G.S.stage === 'bar') setTimeout(() => this.barArrive(), 650);
    if (m.id === 'zug' && G.S.stage === 'ride') { this._announced = {}; this._cond = null; }
  },
  async buy(def, item, cur, opts = {}) {
    if (item.special === 'hair' || item.special === 'beard') {
      if (!pay(cur, item.price)) return;
      UI.closeOverlay();
      if (G.map.id === 'shop_barbier') await this.barberAnim(item.special);
      await Editor.open({ mode: item.special });
      achieve('frisur');
      return 'close';
    }
    if (item.special === 'glatze' || item.special === 'rasur') {
      const hair = item.special === 'glatze';
      if (hair && !G.S.look.hair) { await this.say(null, 'Mehmet schaut auf deinen Kopf. „Da ist nichts mehr zum Rasieren, Freund.“'); return; }
      if (!hair && !G.S.look.beard) { await this.say(null, 'Mehmet fährt dir übers Kinn. „Glatt wie ein Babypopo. Wofür soll ich dich rasieren?“'); return; }
      if (!pay(cur, item.price)) return;
      UI.closeOverlay();
      if (G.map.id === 'shop_barbier') await this.barberAnim(hair ? 'hair' : 'beard', true);
      G.S.look[hair ? 'hair' : 'beard'] = 0;
      G.player.look = G.S.look;
      achieve('frisur');
      if (hair) achieve('glatze');
      await this.say(null, hair ? 'Mehmet hält den Spiegel hin. Blank. „Jetzt spürst du den Föhn richtig.“' : 'Mehmet hält den Spiegel hin. Glatt rasiert. „Zehn Jahre jünger. Mindestens.“');
      return 'close';
    }
    if (item.wear) {
      if (item.unlock && G.S.unlocked[item.unlock]) { Object.assign(G.S.look, item.wear); UI.toast('Angezogen!'); return; }
      if (!pay(cur, item.price)) return;
      if (item.unlock) G.S.unlocked[item.unlock] = 1;
      Object.assign(G.S.look, item.wear);
      G.player.look = G.S.look;
      UI.toast(item.price ? `${item.n} gekauft und angezogen.` : `${item.n}.`);
      if (tracht()) achieve('tracht');
      if (item.wear.costume) achieve('kostuem');
      return;
    }
    if (item.special === 'tip' || item.special === 'bottle') {
      if (!pay(cur, item.price)) return;
      Snd.sfx('clink');
      for (const n of G.npcs) if (n.id === 'dancer' || n.id === 'dancer2') { n.bubble = 'heart'; n.bubbleT = 4; }
      for (const n of G.npcs) if (n.friend) { n.bubble = '!'; n.bubbleT = 3; }
      if (item.special === 'bottle') { achieve('champagner'); mood(16); consume('wein'); consume('wein'); for (let i = 0; i < 24; i++) addPart({ x: G.player.x + rnd(-24, 24), y: G.player.y - rnd(10, 40), vx: rnd(-20, 20), vy: rnd(-30, 10), g: 40, life: 1.2, kind: 'spark' }); UI.toast('Wunderkerze, Applaus von der Bühne – und 180 Euro weniger. Chantal: „Du bist mein Held.“'); }
      else { mood(8); UI.toast('Chantal prostet dir von der Bühne zu. Jacky schenkt dir ein Glas mit ein.'); consume('wein'); }
      G.S.aff[who('charmeur')] = clamp((G.S.aff[who('charmeur')] || 50) + 3, 0, 100);
      return;
    }
    if (item.special === 'round' || item.special === 'roundShots') {
      const here = this.friendsHere();
      if (!here.length) { UI.toast('Die Jungs sind gerade nicht hier.', 'warn'); return; }
      if (!pay(cur, item.price)) return;
      UI.closeOverlay();
      await this.round(item.special === 'roundShots' ? (G.map.id === 'stueberl' ? 'zirben' : 'shot') : 'beer');
      return 'close';
    }
    if (!pay(cur, item.price)) { UI.toast('Nicht genug Geld.', 'warn'); return; }
    const I = ITEMS[item.id];
    if (def.mode === 'take' || opts.take) { addInv(item.id); Snd.sfx('ok'); UI.toast(`${I.n} eingepackt (${G.S.inv[item.id]} in der Tasche). Konsumieren: Handy → Tasche.`); return; }
    consume(item.id);
    const p = G.player;
    if (I.t === 'drink') { p.pose = 'drink'; setTimeout(() => { if (p.pose === 'drink') p.pose = 'stand'; }, 1600); }
    UI.toast(I.alc ? pick(['Prost!', 'Zum Wohl!', 'Proscht!', 'Santé!']) + ` ${I.n}` : `${I.n} – ${I.food ? pick(['lecker!', 'herrlich!', 'mmh!']) : 'erfrischend.'}`);
    if (G.map.id === 'bar' && I.alc && G.S.st.prom > 1.8 && Math.random() < 0.3) UI.toast('Sepp: „Vielleicht mal a Wasser dazwischen, hm?“');
  },
  async useItem(id) {
    const I = ITEMS[id];
    if (I.t === 'pack') { takeInv(id); addInv(I.give, I.count); UI.toast(`${I.count} × ${ITEMS[I.give].n} ausgepackt.`); return; }
    if (I.t === 'smoke') return this.smoke();
    if (I.t === 'ticket') { await this.say(null, 'Gruppenbillett Luzern – Innsbruck Hbf, 12 Personen, 2. Klasse, gültig heute. Nicht verlieren!'); return; }
    if (I.t === 'read') { await this.say(null, pick(['Schlagzeile: „Föhnsturm am Wochenende erwartet“.', 'Sportteil: Ski-Saison startet bald am Gletscher.', 'Lokales: Neue Tram-Linie bis zum Flughafen geplant?'])); passTime(10); mood(1); return; }
    if (I.t === 'souv') { await this.say(null, { schneekugel: 'Du schüttelst die Schneekugel. Schnee rieselt aufs Goldene Dachl.', magnet: 'Ein Magnet mit dem Goldenen Dachl. Für den Kühlschrank zu Hause.', postkarte: 'Eine Postkarte der Nordkette. Am Schreibtisch im Hotel kannst du sie schreiben.', edelweiss: 'Ein Edelweiss-Anstecker. Du steckst ihn dir an.', muenze: 'Deine Glücksmünze.' }[id] || I.n); return; }
    if (I.uses) { G.S.uses[id] = (G.S.uses[id] || I.uses) - 1; if (G.S.uses[id] <= 0) { takeInv(id); delete G.S.uses[id]; } }
    else takeInv(id);
    consume(id);
    UI.toast(`${I.n}: ${I.alc ? 'Prost!' : I.t === 'med' ? 'eingenommen.' : 'mmh.'}`);
  },

  /* ---------- Ereignisse ---------- */
  /* Sichtbarer Schwall: zwei Wellen Brocken aus dem Mund, Schrei als Text, Pfütze vor den Füssen */
  async spew(a) {
    const dx = DIRV[a.dir][0], dy = DIRV[a.dir][1];
    const mouthX = a.x + dx * 6, mouthY = a.y - 12;
    const wave = (n) => { for (let i = 0; i < n; i++) addPart({ x: mouthX + rnd(-2, 2), y: mouthY + rnd(-2, 2), vx: dx * rnd(25, 70) + rnd(-25, 25), vy: dy * 20 + rnd(-10, 30), g: 170, life: rnd(0.8, 1.4), kind: 'vomit', s: Math.random() < 0.35 ? 4 : Math.random() < 0.5 ? 3 : 2, col: pick(['rgba(165,170,60,0.95)', 'rgba(140,150,45,0.95)', 'rgba(200,190,90,0.95)']) }); };
    Snd.sfx('vomit'); G.fx.shake = 1;
    addPart({ x: a.x, y: a.y - 34, vy: -14, life: 1.6, kind: 'txt', txt: 'BLÖÄÄRGH!', col: 'rgba(170,220,90,1)' });
    wave(30);
    G.S.vomitSpots.push({ map: G.map.id, x: a.x + dx * 12, y: a.y + dy * 6 + 2, t: G.S.time });
    await sleep(500);
    Snd.sfx('vomit'); G.fx.shake = 0.6; wave(22);
    await sleep(500);
    wave(10);
    await sleep(700);
  },
  async vomit() {
    if (G.busy) return;
    G.busy++;
    const p = G.player, st = G.S.st;
    p.pose = 'bend';
    await this.say('me', 'Oh nein… mir wird…');
    await this.spew(p);
    st.nau = 0; st.food = Math.max(0, st.food - 40); st.prom = Math.max(0, st.prom - 0.3); mood(-14); energy(-8);
    G.S.flags.vomitAt = G.S.time;
    achieve('kotzen');
    p.pose = 'stand';
    const near = this.friendsHere();
    if (G.map.id === 'club') { await this.say('Türsteher', 'Raus! Sofort! Du gehst jetzt an die frische Luft.'); G.busy--; await warpTo('ibk', 'club_out'); G.S.flags.clubPaid = -1; return; }
    if (G.map.id === 'rouge') { await this.say('Rocky', 'Auf meinen Samtteppich?! Raus, und komm heute nicht wieder.'); G.busy--; await warpTo('ibk', 'rouge_out'); G.S.flags.rougePaid = -1; return; }
    if (G.map.id === 'bar') await this.say('Sepp', 'Oida! Des putzt jetzt aber wer anderer. Trink a Wasser und iss was!');
    else if (near.length) await this.say(near[0], pick(['Ui, ui, ui. Geht\'s? Komm, setz dich mal.', 'Zu viel und zu wenig gegessen. Klassiker.', 'Ich hab nichts gesehen. Wirklich nicht.']));
    else await this.say(null, 'Das war zu viel ohne Essen und ohne Schlaf. Iss etwas, trink Wasser oder leg dich hin.');
    G.busy--;
  },
  async blackout() {
    if (G.busy) return;
    G.busy++;
    const st = G.S.st;
    await this.say('me', 'Alles… dreht… sich…');
    await UI.fadeOut('Filmriss.');
    await sleep(1500);
    const t = G.S.time, d = dayOf(t);
    const wake = (hourOf(t) < 5 ? d : d + 1) * 1440 + 10 * 60;
    const lost = Math.min(G.S.money.eur, Math.round(rnd(15, 45)));
    addMoney('eur', -lost);
    G.S.time = wake; G.S.lastSleep = wake;
    Object.assign(st, { energy: 70, prom: 0, nau: 0, food: 20, mood: Math.max(15, st.mood - 25), hang: 120 });
    G.S.flags.blackoutAt = wake;
    achieve('filmriss');
    let extra = '';
    const r = Math.random();
    if (r < 0.35) { G.S.unlocked.tirolerhut = 1; G.S.look.hat = 9; G.S.look.hatCol = 8; extra = 'Auf deinem Kopf sitzt ein Tirolerhut, an den du dich nicht erinnern kannst.'; }
    else if (r < 0.65) { addInv('muenze'); extra = 'In deiner Hosentasche steckt eine Münze mit einer eingeritzten Telefonnummer.'; }
    else { G.S.beers += 3; extra = 'Auf deinem Bierdeckel sind drei Striche mehr, als du dir erklären kannst.'; }
    if (G.S.flags.checkedIn) enterMap('hotel_room', 'bed'); else enterMap('ibk', 'hbf');
    G.npcs = G.npcs.filter((n) => !n.friend); this.populate(G.map);
    await sleep(600);
    await UI.fadeIn();
    await this.say('me', `Wo… bin ich? ${G.S.flags.checkedIn ? 'Ah, im Hotelzimmer.' : 'Am Bahnhof?'} Wie spät ist es? ${clockStr()}?!`);
    await this.say(null, `${extra} Dein Portemonnaie ist ${lost} € leichter.`);
    UI.toast(`💬 ${fname(who('party'))}: „Lebst du noch? Wir haben dich gestern ins Bett getragen 😂“`);
    G.busy--;
  },
  /* Kurz vor dem Einschlafen: letzte Chance, etwas zu essen, zu trinken oder ins Hotel zu fahren */
  async tiredWarning() {
    if (G.busy) return;
    G.busy++;
    G.warned.tiredCrit = 1;
    Snd.sfx('yawn');
    energy(6); /* Adrenalin: ein paar Minuten Zeit */
    const bag = Object.keys(G.S.inv).filter((id) => ITEMS[id] && ['drink', 'food', 'med'].includes(ITEMS[id].t) && (ITEMS[id].en > 0 || ITEMS[id].food || ITEMS[id].water));
    const opts = [];
    if (bag.length) opts.push({ t: `Tasche öffnen (${bag.slice(0, 3).map((id) => ITEMS[id].n).join(', ')}${bag.length > 3 ? ' …' : ''})`, k: 'bag' });
    else opts.push({ t: 'Tasche öffnen – leer, aber vielleicht hilft Wasser', k: 'bag' });
    if (G.map.id === 'hotel_room') opts.push({ t: 'Ins Bett', k: 'bed' });
    else if (G.map.city === 'ibk' || ['bar', 'stueberl', 'club', 'rouge', 'casino', 'hotel_lobby', 'hotel_floor'].includes(G.map.id)) opts.push({ t: 'Taxi ins Hotel Zirbe rufen', k: 'taxi' });
    if (['bar', 'stueberl', 'casino', 'hotel_lobby'].includes(G.map.id)) opts.push({ t: 'Einen Kaffee an der Theke bestellen', k: 'coffee' });
    opts.push({ t: 'Durchhalten', k: 'hold' });
    const c = await this.ask('me', 'Meine Augen fallen zu … Wenn ich jetzt nichts mache, schlafe ich im Stehen ein. Essen, Wasser, Kaffee, Energy-Drink oder ab ins Bett!', opts);
    const k = opts[c].k;
    G.busy--;
    if (k === 'bag') { Phone.open('inv'); UI.toast('Alles mit „weckt auf“ oder Essen hilft gegen die Müdigkeit.'); }
    else if (k === 'bed') await this.bed();
    else if (k === 'taxi') await this.taxi();
    else if (k === 'coffee') { if (pay('eur', 3.4)) { consume('kaffee'); UI.toast('Ein doppelter Espresso. Das hält dich wach.'); } else UI.toast('Kein Geld für Kaffee.', 'warn'); }
    else UI.toast('Du reisst dich zusammen. Ein paar Minuten hast du noch – dann brauchst du Schlaf.', 'warn');
  },
  async collapse() {
    if (G.busy) return;
    G.busy++;
    await this.say('me', 'Ich… kann nicht mehr… nur kurz… die Augen…');
    if (G.map.id === 'zug') { await UI.fadeOut('Zzz…'); passTime(Math.max(5, 216 - trainState().tm - 2), { sleep: true }); await sleep(1000); await UI.fadeIn(); G.busy--; return; }
    await UI.fadeOut('Du schläfst im Stehen ein.');
    passTime(240, { sleep: true, rate: 0.25 });
    G.S.lastSleep = Math.min(G.S.time, G.S.lastSleep + 600);
    await sleep(1400);
    if (G.S.flags.checkedIn) enterMap('hotel_room', 'bed');
    else enterMap(G.map.id, G.S.map === 'ibk' ? 'hbf' : Object.keys(G.map.spawns)[0]);
    await UI.fadeIn();
    await this.say(null, G.S.flags.checkedIn ? 'Du wachst in deinem Hotelbett auf. Die Jungs haben dich offenbar hergebracht.' : 'Du wachst auf einer Bank auf. Ein Taubenschwarm beobachtet dich.');
    G.busy--;
  },
};
function tracht() { const L = G.S.look; return L.hat === 9 && L.top === 11 && L.pants === 7 && L.shoes === 6; }

const suitSvg = (s) => (G.S.flags.deck === 'fr' ? `<svg viewBox="0 0 24 24" aria-hidden="true"><text x="12" y="20" font-size="22" text-anchor="middle" fill="${s < 2 ? '#c8202a' : '#1a1a1a'}">${SUIT_FR_GLYPH[s]}</text></svg>` : SUIT_SVG_DE[s]);
const suitName = (s) => (G.S.flags.deck === 'fr' ? JASS_SUIT_FR : JASS_SUIT_DE)[s];
const rankLbl = (r) => (G.S.flags.deck === 'fr' ? JASS_RANK_FR : JASS_RANK_DE)[r];
const modeName = (m) => (m.type === 'trump' ? suitName(m.s) : m.type === 'obe' ? 'Obenabe' : 'Undenufe');

const JassRules = {
  power(c, mode, lead) {
    if (mode.type === 'trump' && c.s === mode.s) return 100 + TRUMP_RANK[c.r];
    if (c.s !== lead) return -1;
    return mode.type === 'unde' ? 8 - c.r : c.r;
  },
  pts(c, mode) {
    if (mode.type === 'trump') return c.s === mode.s ? [0, 0, 0, 14, 10, 20, 3, 4, 11][c.r] : [0, 0, 0, 0, 10, 2, 3, 4, 11][c.r];
    if (mode.type === 'obe') return [0, 0, 8, 0, 10, 2, 3, 4, 11][c.r];
    return [11, 0, 8, 0, 10, 2, 3, 4, 0][c.r];
  },
  winner(trick, mode) {
    const lead = trick[0].c.s;
    let best = 0, bp = -2;
    trick.forEach((t, i) => { const p = this.power(t.c, mode, lead); if (p > bp) { bp = p; best = i; } });
    return best;
  },
  legal(hand, trick, mode) {
    if (!trick.length) return hand.slice();
    const lead = trick[0].c.s;
    const follow = hand.filter((c) => c.s === lead);
    if (mode.type !== 'trump') return follow.length ? follow : hand.slice();
    const T = mode.s;
    if (lead === T) {
      if (!follow.length) return hand.slice();
      if (follow.length === 1 && follow[0].r === 5) return hand.slice();
      return follow;
    }
    let hi = -1;
    for (const t of trick) if (t.c.s === T) hi = Math.max(hi, TRUMP_RANK[t.c.r]);
    const under = (c) => c.s === T && hi >= 0 && TRUMP_RANK[c.r] < hi;
    const opts = follow.length ? follow.concat(hand.filter((c) => c.s === T)) : hand.slice();
    const ok = opts.filter((c) => !under(c));
    return ok.length ? ok : opts;
  },
};

const Jass = {
  async play({ partner, opp }) {
    const seats = [{ id: 'me', name: G.S.name, look: G.S.look }, FRIENDS[opp[0]], FRIENDS[partner], FRIENDS[opp[1]]];
    const lenC = await UI.ask(partner, `Schieber! ${fname(partner)} und du gegen ${fname(opp[0])} und ${fname(opp[1])}. Wie lange?`, [{ t: 'Ein Spiel', r: '9 Stiche' }, { t: 'Partie bis 500', r: 'ca. 4 Spiele' }, { t: 'Doch nicht' }]);
    if (lenC === 2) return null;
    const target = lenC === 0 ? 0 : 500;
    return new Promise((resolve) => {
      const st = { seats, total: [0, 0], deals: 0, match: false, announcer: 0, busy: false, closed: false };
      const html = `<div class="panel jass"><div class="panel-head"><h2>Schieber</h2><span class="sub">${target ? 'bis 500' : 'ein Spiel'}</span><button class="x-btn" data-close aria-label="Aufgeben">×</button></div>
        <div class="panel-body"><div class="jass-top"><div class="tafel"><span>Wir <b id="jWe">0</b></span><span>Sie <b id="jThey">0</b></span><span style="opacity:.75">Spiel <b id="jRound">0 : 0</b></span></div><div class="trumpf" id="jTrump">Trumpf: –</div></div>
        <div class="jtable" id="jTable">
          <div class="seat top" id="seat2"><canvas width="64" height="64"></canvas><div><div>${seats[2].name}</div><div class="backs" id="b2"></div></div></div>
          <div class="seat left" id="seat3"><canvas width="64" height="64"></canvas><div>${seats[3].name}</div><div class="backs" id="b3"></div></div>
          <div class="seat right" id="seat1"><canvas width="64" height="64"></canvas><div>${seats[1].name}</div><div class="backs" id="b1"></div></div>
          <div class="trick" id="jTrick"></div>
        </div>
        <div class="jass-msg" id="jMsg"></div><div class="jass-actions" id="jAct"></div><div class="hand" id="jHand"></div></div></div>`;
      const o = UI.overlay(html, () => { st.closed = true; resolve(null); });
      [1, 2, 3].forEach((i) => { const c = o.querySelector(`#seat${i} canvas`).getContext('2d'); c.imageSmoothingEnabled = false; c.drawImage(portraitCanvas(seats[i].look, FRIENDS[seats[i].id] ? FRIENDS[seats[i].id].bg : '#2a3a52'), 0, 0); });
      const $j = (s) => o.querySelector(s);
      const msg = (t) => { $j('#jMsg').innerHTML = t; };
      const cardHTML = (c, cls = '', attrs = '') => `<button class="card ${cls} ${G.S.flags.deck === 'fr' && c.s < 2 ? 'red' : ''}" ${attrs} aria-label="${suitName(c.s)} ${rankLbl(c.r)}"><span class="r">${rankLbl(c.r)}</span><span class="s">${suitSvg(c.s)}</span><span class="r2">${rankLbl(c.r)}</span></button>`;
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      let H = [[], [], [], []], trick = [], mode = null, played = [], tricksWon = [0, 0], pts = [0, 0], announcerTeam = 0;
      const renderBacks = () => { for (const i of [1, 2, 3]) $j('#b' + i).innerHTML = '<i></i>'.repeat(H[i].length); };
      const renderTrick = () => { $j('#jTrick').innerHTML = trick.map((t) => cardHTML(t.c, 'p' + t.p, 'tabindex="-1"')).join(''); };
      const sortHand = (h) => h.sort((a, b) => (a.s - b.s) || (a.r - b.r));
      const renderHand = (legalSet, onPick) => {
        const h = $j('#jHand');
        h.innerHTML = H[0].map((c, i) => cardHTML(c, legalSet ? (legalSet.has(c) ? 'ok' : 'no') : '', `data-i="${i}"`)).join('');
        if (onPick) h.querySelectorAll('.card.ok').forEach((b) => b.addEventListener('click', () => onPick(H[0][+b.dataset.i])));
      };
      const setTurn = (p) => { [1, 2, 3].forEach((i) => $j('#seat' + i).classList.toggle('turn', i === p)); };
      const tafel = () => { $j('#jWe').textContent = st.total[0]; $j('#jThey').textContent = st.total[1]; $j('#jRound').textContent = `${pts[0]} : ${pts[1]}`; $j('#jTrump').innerHTML = mode ? `Trumpf: ${mode.type === 'trump' ? suitSvg(mode.s) : ''} <b>${modeName(mode)}</b>` : 'Trumpf: –'; };
      const deal = () => {
        const deck = [];
        for (let s = 0; s < 4; s++) for (let r = 0; r < 9; r++) deck.push({ s, r });
        for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
        H = [0, 1, 2, 3].map((p) => sortHand(deck.slice(p * 9, p * 9 + 9)));
        trick = []; played = []; tricksWon = [0, 0]; pts = [0, 0]; mode = null;
        Snd.sfx('card');
      };
      const evalModes = (h) => {
        const res = [];
        for (let s = 0; s < 4; s++) {
          let v = 0;
          for (const c of h) {
            if (c.s === s) v += { 5: 9, 3: 7, 8: 4, 7: 2.5, 6: 2, 4: 2 }[c.r] || 1.2;
            else if (c.r === 8) v += 1.6;
            else if (c.r === 7 && h.some((x) => x.s === c.s && x.r === 8)) v += 0.6;
          }
          v += h.filter((c) => c.s === s).length * 0.8;
          res.push({ m: { type: 'trump', s }, v });
        }
        let ob = 0, un = 0;
        for (let s = 0; s < 4; s++) {
          const rs = h.filter((c) => c.s === s).map((c) => c.r).sort((a, b) => b - a);
          let k = 8; for (const r of rs) { if (r === k) { ob += r === 8 ? 5 : 3; k--; } else break; }
          const rsu = rs.slice().sort((a, b) => a - b);
          k = 0; for (const r of rsu) { if (r === k) { un += r === 0 ? 5 : 3; k++; } else break; }
        }
        res.push({ m: { type: 'obe' }, v: ob + 2 }, { m: { type: 'unde' }, v: un + 2 });
        res.sort((a, b) => b.v - a.v);
        return res[0];
      };
      const chooseHuman = (canPush) => new Promise((res) => {
        const act = $j('#jAct');
        const btn = (lbl, v) => { const b = document.createElement('button'); b.className = 'btn'; b.innerHTML = lbl; b.onclick = () => { act.innerHTML = ''; res(v); }; act.appendChild(b); };
        for (let s = 0; s < 4; s++) btn(`${suitSvg(s)}${suitName(s)}`, { type: 'trump', s });
        btn('▼ Obenabe', { type: 'obe' }); btn('▲ Undenufe', { type: 'unde' });
        if (canPush) btn('Schieben →', 'push');
        renderHand(null);
      });
      const bock = (c) => {
        if (mode.type === 'trump' && c.s === mode.s) { for (let r = 0; r < 9; r++) if (TRUMP_RANK[r] > TRUMP_RANK[c.r] && !played.some((x) => x.s === c.s && x.r === r)) return false; return true; }
        const higher = mode.type === 'unde' ? (r) => r < c.r : (r) => r > c.r;
        for (let r = 0; r < 9; r++) if (higher(r) && !played.some((x) => x.s === c.s && x.r === r)) return false;
        return true;
      };
      const aiPick = (p) => {
        const hand = H[p], L = JassRules.legal(hand, trick, mode);
        if (L.length === 1) return L[0];
        const team = p % 2, T = mode.type === 'trump' ? mode.s : -1;
        const P = (c) => JassRules.pts(c, mode);
        const low = (arr) => arr.slice().sort((a, b) => (P(a) - P(b)) || ((a.s === T) - (b.s === T)) || (JassRules.power(a, mode, a.s) - JassRules.power(b, mode, b.s)))[0];
        if (!trick.length) {
          if (T >= 0 && team === announcerTeam) {
            const my = hand.filter((c) => c.s === T);
            const left = 9 - played.filter((c) => c.s === T).length - my.length;
            if (left > 0 && my.some((c) => c.r === 5 || (c.r === 3 && bock(c)))) return my.sort((a, b) => TRUMP_RANK[b.r] - TRUMP_RANK[a.r])[0];
          }
          const bocks = L.filter((c) => c.s !== T && bock(c));
          if (bocks.length) return bocks.sort((a, b) => P(b) - P(a))[0];
          const nonT = L.filter((c) => c.s !== T && P(c) < 10);
          return low(nonT.length ? nonT : L);
        }
        const lead = trick[0].c.s;
        const wi = JassRules.winner(trick, mode);
        const winCard = trick[wi].c, winSeat = trick[wi].p;
        const partnerWins = winSeat % 2 === team;
        const last = trick.length === 3;
        const wp = JassRules.power(winCard, mode, lead);
        const beating = L.filter((c) => JassRules.power(c, mode, lead) > wp);
        const tp = trick.reduce((s, t) => s + P(t.c), 0);
        if (partnerWins && (last || bock(winCard))) {
          const sm = L.filter((c) => !(c.s === T && (c.r === 5 || c.r === 3)));
          return (sm.length ? sm : L).sort((a, b) => P(b) - P(a))[0];
        }
        if (beating.length) {
          const cheapest = beating.sort((a, b) => JassRules.power(a, mode, lead) - JassRules.power(b, mode, lead))[0];
          if (last && (tp > 0 || trick.length === 3)) return cheapest;
          const safe = beating.filter((c) => bock(c));
          if (safe.length && tp >= 3) return safe.sort((a, b) => P(a) - P(b))[0];
          if (tp >= 10 && !(cheapest.s === T && cheapest.r === 5 && tp < 14)) return cheapest;
        }
        return low(L);
      };
      const playCard = async (p, c) => {
        H[p].splice(H[p].indexOf(c), 1);
        trick.push({ p, c }); played.push(c);
        Snd.sfx('card'); renderTrick(); renderBacks();
        if (p === 0) renderHand(null);
      };
      const humanTurn = () => new Promise((res) => {
        const L = new Set(JassRules.legal(H[0], trick, mode));
        msg(trick.length ? 'Du bist dran.' : 'Du spielst aus.');
        renderHand(L, (c) => res(c));
      });
      const runDeal = async () => {
        deal(); renderBacks(); renderTrick(); tafel();
        const ann = st.announcer;
        announcerTeam = ann % 2;
        if (ann === 0) {
          msg('Du sagst Trumpf an.');
          renderHand(null);
          let ch = await chooseHuman(true);
          if (st.closed) return;
          if (ch === 'push') {
            msg(`Du schiebst zu ${seats[2].name}…`); await wait(800);
            ch = evalModes(H[2]).m;
            msg(`${seats[2].name}: „${modeName(ch)}!“`);
          }
          mode = ch;
        } else {
          setTurn(ann);
          msg(`${seats[ann].name} überlegt…`); await wait(900);
          let best = evalModes(H[ann]);
          if (best.v < 17) {
            const pp = (ann + 2) % 4;
            msg(`${seats[ann].name} schiebt!`); await wait(800);
            if (pp === 0) { msg('Geschoben – du musst ansagen.'); mode = await chooseHuman(false); if (st.closed) return; }
            else { best = evalModes(H[pp]); mode = best.m; msg(`${seats[pp].name}: „${modeName(mode)}!“`); }
          } else { mode = best.m; msg(`${seats[ann].name}: „${modeName(mode)}!“`); }
        }
        tafel(); await wait(900);
        let leader = ann;
        for (let k = 0; k < 9; k++) {
          trick = []; renderTrick();
          for (let j = 0; j < 4; j++) {
            if (st.closed) return;
            const p = (leader + j) % 4;
            setTurn(p);
            let c;
            if (p === 0) c = await humanTurn();
            else { await wait(520 + Math.random() * 380); c = aiPick(p); }
            if (st.closed) return;
            await playCard(p, c);
          }
          const wi = JassRules.winner(trick, mode);
          const w = trick[wi].p;
          let tp = trick.reduce((s, t) => s + JassRules.pts(t.c, mode), 0);
          if (k === 8) tp += 5;
          pts[w % 2] += tp; tricksWon[w % 2]++;
          msg(`${w === 0 ? 'Du nimmst' : seats[w].name + ' nimmt'} den Stich (${tp} Punkte).`);
          tafel();
          await wait(1100);
          leader = w;
        }
        let matchTeam = -1;
        if (tricksWon[0] === 9) { pts[0] += 100; matchTeam = 0; } if (tricksWon[1] === 9) { pts[1] += 100; matchTeam = 1; }
        st.total[0] += pts[0]; st.total[1] += pts[1]; st.deals++;
        if (matchTeam === 0) st.match = true;
        trick = []; renderTrick(); tafel(); setTurn(-1);
        msg(`${matchTeam === 0 ? '<b>MATCH!</b> ' : matchTeam === 1 ? '<b>Match für die anderen…</b> ' : ''}Spiel: Wir ${pts[0]} – Sie ${pts[1]}.`);
        Snd.sfx(pts[0] > pts[1] ? 'win' : 'lose');
        st.announcer = (st.announcer + 1) % 4;
      };
      (async () => {
        while (!st.closed) {
          await runDeal();
          if (st.closed) return;
          const done = !target || st.total[0] >= target || st.total[1] >= target;
          const act = $j('#jAct');
          await new Promise((r) => { act.innerHTML = ''; const b = document.createElement('button'); b.className = 'btn primary'; b.textContent = done ? 'Fertig' : 'Nächstes Spiel'; b.onclick = () => { act.innerHTML = ''; r(); }; act.appendChild(b); });
          if (done) {
            const win = st.total[0] > st.total[1];
            st.closed = true;
            UI._ovClose = null;
            UI.closeOverlay();
            resolve({ win, match: st.match, deals: st.deals });
            return;
          }
        }
      })();
    });
  },
};

/* ============ Minispiele ============ */
const Mini = {
  key: null,
  frame(title, sub, inner) {
    return `<div class="panel mini"><div class="panel-head"><h2>${title}</h2><span class="sub" id="miniSub">${sub || ''}</span><button class="x-btn" id="miniX" aria-label="Abbrechen">×</button></div><div class="panel-body">${inner}</div></div>`;
  },
  run(title, sub, inner, W, H, setup) {
    return new Promise((resolve) => {
      let done = false, raf = 0;
      const finish = (v) => { if (done) return; done = true; cancelAnimationFrame(raf); Mini.key = null; UI.closeOverlay(); resolve(v); };
      const o = UI.overlay(Mini.frame(title, sub, inner), () => { if (!done) { done = true; cancelAnimationFrame(raf); Mini.key = null; resolve(null); } });
      o.querySelector('#miniX').onclick = () => finish(null);
      const cv = o.querySelector('canvas');
      const ctx = cv ? cv.getContext('2d') : null;
      if (cv) { cv.width = W; cv.height = H; ctx.imageSmoothingEnabled = false; }
      const api = { o, cv, ctx, finish, sub: (t) => { o.querySelector('#miniSub').innerHTML = t; }, t0: performance.now() };
      const tick = setup(api);
      let last = performance.now();
      const loop = (now) => { if (done) return; const dt = Math.min(0.05, (now - last) / 1000); last = now; tick(dt, (now - api.t0) / 1000); raf = requestAnimationFrame(loop); };
      raf = requestAnimationFrame(loop);
    });
  },
  wob() { const p = G.S.st.prom; return 1 + Math.max(0, p - 0.4) * 1.4 + (G.S.st.energy < 25 ? 0.5 : 0); },

  /* ---------- Darts ---------- */
  darts(opp) {
    const SEG = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
    const CX = 80, CY = 66, RAD = 54;
    const score = (x, y) => {
      const dx = x - CX, dy = y - CY, r = Math.hypot(dx, dy) / RAD;
      if (r > 1) return { v: 0, t: 'daneben' };
      if (r < 0.045) return { v: 50, t: 'BULL!', bull: 1 };
      if (r < 0.1) return { v: 25, t: 'Single Bull' };
      let a = Math.atan2(dx, -dy) * 180 / Math.PI; if (a < 0) a += 360;
      const seg = SEG[Math.floor(((a + 9) % 360) / 18)];
      if (r > 0.47 && r < 0.53) return { v: seg * 3, t: 'Triple ' + seg };
      if (r > 0.94) return { v: seg * 2, t: 'Double ' + seg };
      return { v: seg, t: '' + seg };
    };
    const [bc, bx] = canvas(160, 132);
    for (let y = 0; y < 132; y++) for (let x = 0; x < 160; x++) {
      const dx = x - CX, dy = y - CY, r = Math.hypot(dx, dy) / RAD;
      if (r > 1.18) continue;
      if (r > 1) { P(bx, x, y, '#1a1a1a'); continue; }
      let a = Math.atan2(dx, -dy) * 180 / Math.PI; if (a < 0) a += 360;
      const si = Math.floor(((a + 9) % 360) / 18);
      const dark = si % 2 === 0;
      let c = dark ? '#1d1d1f' : '#efe4c8';
      if ((r > 0.47 && r < 0.53) || r > 0.94) c = dark ? '#c8302a' : '#2a8a3a';
      if (r < 0.1) c = '#2a8a3a';
      if (r < 0.045) c = '#c8302a';
      P(bx, x, y, c);
    }
    for (let i = 0; i < 20; i++) { const a = (i * 18) * Math.PI / 180; const tx = CX + Math.sin(a) * (RAD + 6) - 3, ty = CY - Math.cos(a) * (RAD + 6) - 2; pxText(bx, SEG[i], Math.round(tx - (SEG[i] > 9 ? 2 : 0)), Math.round(ty), '#f2eee4'); }
    return this.run('Darts', opp ? `gegen ${opp.name}` : 'Training', `<canvas aria-label="Dartscheibe"></canvas><div class="mini-bar"><span id="dInfo">Tippe oder drück A, wenn das Fadenkreuz richtig steht.</span><b id="dScore">0</b></div><button class="btn primary" id="dThrow">Werfen</button>`, 160, 132, (api) => {
      const st = { round: 1, dart: 0, me: 0, opp: 0, darts: [], turn: 'me', t: 0, msg: '', aiT: 0, bull: false, phase: 'aim', wait: 0 };
      const amp = 22 * Mini.wob();
      const throwIt = () => {
        if (st.turn !== 'me' || st.phase !== 'aim') return;
        const ax = CX + Math.sin(st.t * 1.7) * amp + Math.sin(st.t * 4.1) * amp * 0.25, ay = CY + Math.sin(st.t * 2.3 + 1) * amp * 0.8;
        const n = 2 + G.S.st.prom * 3;
        const hx = ax + rnd(-n, n), hy = ay + rnd(-n, n);
        const s = score(hx, hy);
        st.darts.push({ x: hx, y: hy, me: 1 }); st.me += s.v; st.dart++; if (s.bull) st.bull = true;
        Snd.sfx('dart'); st.msg = s.t + (s.v ? ` (+${s.v})` : '');
        if (st.dart >= 3) { st.turn = opp ? 'opp' : 'next'; st.dart = 0; st.wait = 1.1; }
      };
      api.o.querySelector('#dThrow').onclick = throwIt;
      api.cv.addEventListener('pointerdown', throwIt);
      Mini.key = (k) => { if (['Space', 'Enter', 'KeyE'].includes(k)) throwIt(); };
      return (dt) => {
        st.t += dt;
        const c = api.ctx;
        c.fillStyle = '#2a1a10'; c.fillRect(0, 0, 160, 132);
        c.drawImage(bc, 0, 0);
        for (const d of st.darts) { R(c, d.x - 1, d.y - 1, 3, 3, d.me ? '#ffb53d' : '#7ad0f0'); R(c, d.x + 1, d.y - 4, 1, 3, '#e8e8e8'); }
        if (st.wait > 0) { st.wait -= dt; if (st.wait <= 0) { if (st.turn === 'next') { st.round++; st.darts = []; st.turn = 'me'; } else if (st.turn === 'opp') st.phase = 'ai'; } }
        if (st.turn === 'me' && st.phase === 'aim' && st.wait <= 0) {
          const ax = CX + Math.sin(st.t * 1.7) * amp + Math.sin(st.t * 4.1) * amp * 0.25, ay = CY + Math.sin(st.t * 2.3 + 1) * amp * 0.8;
          R(c, ax - 5, ay, 4, 1, '#ffffff'); R(c, ax + 2, ay, 4, 1, '#ffffff'); R(c, ax, ay - 5, 1, 4, '#ffffff'); R(c, ax, ay + 2, 1, 4, '#ffffff'); P(c, ax, ay, '#ff3a3a');
        }
        if (st.phase === 'ai') {
          st.aiT -= dt;
          if (st.aiT <= 0) {
            const skill = opp.fn === 'saeufer' ? 9 - Math.min(4, G.S.st.prom * 2) : 11;
            const tx = CX + rnd(-skill, skill), ty = CY - RAD * 0.5 + rnd(-skill, skill);
            const s = score(tx, ty);
            st.darts.push({ x: tx, y: ty, me: 0 }); st.opp += s.v; st.dart++;

  /* ---------- Tanzen ---------- */
  dance() {

    return this.run('Tanzfläche', 'DJ Firn legt auf', `<canvas aria-label="Tanzfläche"></canvas><div class="mini-bar"><span id="nInfo">Drück die Pfeile, wenn sie die Linie treffen.</span><b id="nScore">0 %</b></div><div class="lanes">${lanes.map((l, i) => `<button data-l="${i}" aria-label="Spur ${i + 1}">${l}</button>`).join('')}</div>`, 160, 140, (api) => {
      const beat = 60 / 124;
      const notes = [];
      const r = rng(dayOf(G.S.time) * 13 + Math.floor(G.t));
      for (let b = 4; b < 40; b++) { if (r() < 0.82) notes.push({ t: b * beat, l: Math.floor(r() * 4) }); if (b > 20 && r() < 0.2) notes.push({ t: (b + 0.5) * beat, l: Math.floor(r() * 4) }); }
      const travel = 1.8;

      let pts = 0, t = -2.0, judge = '', jt = 0, combo = 0, lastBeat = -1;

        let best = null, bd = 9;

        if (best && bd < good) { best.done = true; const pf = bd < win; pts += pf ? 100 : 75; judge = pf ? 'PERFEKT!' : 'Gut'; combo++; Snd.tone([523, 587, 659, 784][l], 0.08, 'square', 0.04); }
        else { judge = 'Daneben'; combo = 0; }
        jt = 0.5;
      };
      api.o.querySelectorAll('[data-l]').forEach((b) => b.addEventListener('pointerdown', (e) => { e.preventDefault(); hit(+b.dataset.l); }));
      Mini.key = (k) => { const m = { ArrowLeft: 0, KeyA: 0, ArrowDown: 1, KeyS: 1, ArrowUp: 2, KeyW: 2, ArrowRight: 3, KeyD: 3 }; if (k in m) hit(m[k]); };
      const sheet = getSheet(G.S.look);
      Mini._dance = { notes, now: () => t }; /* für Tests */
      const LW = 40, ly = 112; /* vier Spuren à 40 px über die volle Breite – die Knöpfe darunter liegen genau darunter */
      const arrow = (c, ax, ay, d, col) => { for (let k = 0; k < 4; k++) { if (d === 0) R(c, ax + k, ay + 3 - k, 1, k * 2 + 1, col); if (d === 3) R(c, ax + 6 - k, ay + 3 - k, 1, k * 2 + 1, col); if (d === 1) R(c, ax + 3 - k, ay + 6 - k, k * 2 + 1, 1, col); if (d === 2) R(c, ax + 3 - k, ay + k, k * 2 + 1, 1, col); } };
      const LANE_COL = ['#ff3ad0', '#3ae0ff', '#ffe03a', '#7aff6a'];
      return (dt) => {
        t += dt; jt -= dt;
        const c = api.ctx;
        const bt = Math.floor(t / beat);

        if (bt !== lastBeat && t >= 0) { lastBeat = bt; Snd.tone(bt % 4 === 0 ? 1400 : 900, 0.025, 'square', bt % 4 === 0 ? 0.05 : 0.03); }
        R(c, 0, 0, 160, 140, '#120f1a');
        for (let i = 0; i < 4; i++) R(c, i * LW, 0, LW, 140, i % 2 ? '#1a1626' : '#171322');
        if (bt % 4 === 0 && t >= 0) R(c, 0, 0, 160, 140, 'rgba(255,58,208,0.05)');

        c.globalAlpha = 1;
        /* Ziellinie und Pfeile je Spur */

        for (let i = 0; i < 4; i++) { R(c, i * LW + 4, ly - 1, LW - 8, 4, 'rgba(255,255,255,0.12)'); arrow(c, i * LW + LW / 2 - 3, ly + 6, i, LANE_COL[i]); }
        const jitter = p > 1.4 ? (p - 1.4) * 3 : 0;
        for (const n of notes) {
          if (n.done) continue;
          const dtn = n.t - t;
          if (dtn < -good) { n.done = true; n.miss = true; combo = 0; judge = 'Verpasst'; jt = 0.4; continue; }
          if (dtn > travel) continue;
          const y = ly - (dtn / travel) * ly;

        }
        if (jt > 0) { const w = pxTextW(judge.toUpperCase()); pxText(c, judge.toUpperCase(), 80 - w / 2, 8, judge === 'Daneben' || judge === 'Verpasst' ? '#e2554a' : '#ffb53d'); }
        if (combo > 3) pxText(c, combo + 'X', 72, 18, '#7af0e0');
        if (t < 0) pxText(c, 'BEREIT…', 36, 50, '#ffb53d', 2);
        const pct = Math.round((pts / (notes.length * 100)) * 100);
        api.o.querySelector('#nScore').textContent = pct + ' %';
        if (t > notes[notes.length - 1].t + 1) { api.finish(pct); UI.toast(`Tanzwertung: ${pct} %`, pct >= 80 ? 'ach' : ''); }

    });
  },



  /* ---------- Skispringen am Bergisel: Anlauf, Absprung, Flug mit Haltung, Telemark ---------- */
  skijump() {

  /* ---------- Nageln ---------- */

    });
  },

/* ---- 11_scenes.js ---- */
/* ============ Szenen: kurze animierte Pixel-Bilder für Aktivitäten ============
   Scene.play(kind, { text, ms, keep, ... }) zeigt im Überblend-Overlay ein 160×96-Bild, das
   für `ms` Millisekunden animiert wird. Mit keep: true bleibt das Overlay danach stehen
   (z. B. für einen Kartenwechsel) und der Aufrufer beendet es mit UI.fadeIn(). */
const SCENE_W = 160, SCENE_H = 96;
const POSE_I = { stand: 0, walkA: 1, walkB: 2, sit: 3, drink: 4, danceA: 5, danceB: 6, bend: 7 };
function sceneSprite(c, st, pose, dir, x, y, s = 1, alpha = 1) {
  c.globalAlpha = alpha;
  c.drawImage(st.sheet, POSE_I[pose] * SPR_W, dir * SPR_H, SPR_W, SPR_H, Math.round(x), Math.round(y), SPR_W * s, SPR_H * s);
  c.globalAlpha = 1;
}
function sceneHead(c, st, x, y, s = 1, dir = 0) { c.drawImage(st.sheet, 0, dir * SPR_H, SPR_W, 12, Math.round(x), Math.round(y), SPR_W * s, 12 * s); }
function sceneSky(c, night, p = 0, dawn = false) {
  const top = night ? (dawn ? mix('#121a3a', '#f2a65a', p) : '#121a3a') : '#8fc3e8', bot = night ? (dawn ? mix('#2a3660', '#ffd9a0', p) : '#2a3660') : '#d8ecf8';
  for (let y = 0; y < 60; y++) R(c, 0, y, SCENE_W, 1, mix(top, bot, y / 60));
  if (night && !(dawn && p > 0.6)) { for (let i = 0; i < 18; i++) P(c, Math.floor(hash(i, 3) * SCENE_W), Math.floor(hash(i, 7) * 40), hash(i, 9) > 0.5 ? '#ffffff' : '#c8d0ff'); E(c, 132, 14, 7, 7, '#f4f0d8'); E(c, 136, 12, 6, 6, top); }
}
function sceneMountains(c, y0, col, snow, off = 0) {
  for (let x = 0; x < SCENE_W; x++) {
    const xx = x + off;
    const h = 14 + Math.abs(Math.sin(xx * 0.05) * 16 + Math.sin(xx * 0.13 + 1) * 6 + Math.sin(xx * 0.31) * 2);
    R(c, x, y0 - h, 1, h + 40, col);
    if (snow) R(c, x, y0 - h, 1, Math.max(1, Math.round(h * 0.28)), '#f4f6fa');
  }
}
const SCENES = {
  /* Brunnenbad im Leopoldsbrunnen */
  bath(c, t, p, st) {

const Scene = {
  async play(kind, o = {}) {
    const els = UI.els, cv = els.fadeCv;
    const draw = SCENES[kind];
    if (!cv || !draw) { await UI.fadeOut(o.text || ''); await sleep(o.ms || 1500); if (!o.keep) await UI.fadeIn(); return; }
    cv.width = SCENE_W; cv.height = SCENE_H;
    const x = cv.getContext('2d'); x.imageSmoothingEnabled = false;
    els.fadeText.textContent = o.text || '';
    const st = Object.assign({ sheet: getSheet(G.S.look), look: G.S.look, night: isNight() }, o);
    try { draw(x, 0, 0, st); } catch (e) { console.error(e); }
    els.fade.classList.add('scene'); els.fade.classList.add('on');
    await sleep(380);
    const ms = o.ms || 2500, t0 = performance.now();
    await new Promise((res) => {
      const loop = (now) => {
        const dt = now - t0;
        try { draw(x, dt / 1000, Math.min(1, dt / ms), st); } catch (e) { console.error(e); res(); return; }
        if (dt < ms) requestAnimationFrame(loop); else res();
      };
      requestAnimationFrame(loop);
    });
    if (!o.keep) await UI.fadeIn();
  },
};

/* ============ Start & Hauptschleife ============ */
G.mode = 'title';
function isTouch() { return window.matchMedia && (matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window); }

function boot() {
  View.cv = document.getElementById('screen');
  View.ctx = View.cv.getContext('2d');
  [View.wcv, View.wctx] = canvas(320, 200);
  [View.lcv, View.lctx] = canvas(320, 200);
  resizeView();
  window.addEventListener('resize', resizeView);
  UI.init();
  Input.touch = isTouch();
  document.body.classList.toggle('touch', Input.touch);
  wireInput();
  showTitle();
  let last = performance.now(), hudT = 0;
  const loop = (now) => {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (G.mode === 'play' && G.map) {
      try {
        updateWorld(dt);
        renderWorld();
        renderScreen();
      } catch (e) { console.error(e); }
      hudT += dt; if (hudT > 0.5) { hudT = 0; UI.hud(); }
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.mode === 'play') saveGame(true); });
}

function changelogHtml() {
  return CHANGELOG.map((e, i) => `<div class="cl-entry${i === 0 ? ' cur' : ''}"><div class="cl-head"><b>Version ${e.v}</b><span>${e.date}${i === 0 ? ' · aktuell' : ''}</span></div><ul>${e.items.map((x) => `<li>${x}</li>`).join('')}</ul></div>`).join('');
}
function showTitle() {
  const t = document.getElementById('title');
  const save = loadSave();
  t.hidden = false;
  t.innerHTML = `<div class="snow" aria-hidden="true"></div><div class="title-card">
    <div class="lights" aria-hidden="true"></div>

}

async function startGame(state, fresh) {
  G.S = state;
  if (!G.S.flags.met) G.S.flags.met = {};
  buildFriends();
  G.photoImg = {};
  try { G.photoImg = JSON.parse(localStorage.getItem(SAVE_KEY + '-img') || '{}'); } catch (e) {}
  document.getElementById('title').hidden = true;
  document.getElementById('hud').hidden = false;
  document.getElementById('touch').hidden = false;
  G.player = null;
  if (fresh) enterMap('luzern', 'start');
  else enterMap(G.S.map, { x: G.S.x, y: G.S.y, dir: G.S.dir });
  Story._lastHour = Math.floor(hourOf(G.S.time));
  G.mode = 'play';
  Story.ready = true;
  UI.hud();
  if (fresh) {
    G.busy++;
    await UI.card(`${dateLong()} · ${clockStr()} Uhr · Bahnhofplatz Luzern`, 1800);
    await Story.say(null, playerIsKassier()
      ? `Du bist ${G.S.name}, der Kassier. Die Gruppenkasse ist bei dir – und du kaufst das Gruppenbillett am Automaten im Bahnhof. Die Jungs warten beim Torbogen – begrüss vor allem ${fname(who('party'))} (Proviant) und ${fname(who('foto'))} (Fototipp), die winken mit einem „!“. Um 9:10 fährt der Zug auf Gleis 4, und zwar pünktlich.`
      : `Du bist ${G.S.name}, ${CREW.find((c) => c.id === G.S.pid).role}. Heute geht's mit den Jungs nach Innsbruck! Sie warten beim Torbogen – begrüss dort ${fname(who('party'))}, ${fname(who('foto'))} und ${fname(who('kassier'))}, die winken mit einem „!“. Du bist für die Fahrkarten zuständig: ${fname(who('kassier'))} gibt dir das Geld, du kaufst das Gruppenbillett am Automaten. Um 9:10 fährt der Zug auf Gleis 4 – wer zu spät kommt, bleibt in Luzern.`);
    if (Input.touch) await Story.say(null, 'Zieh mit dem Daumen links auf dem Bildschirm, um zu gehen. Weit ziehen heisst rennen. Mit A sprichst du mit Leuten und benutzt Dinge. Oben rechts ist dein Handy.');
    else await Story.say(null, 'WASD oder Pfeiltasten zum Gehen, Shift zum Rennen, E für Aktionen, M für dein Handy.');
    G.busy--;
    saveGame(true);
  }
}

function wireInput() {
  const keyDown = (e) => {
    if (G.mode !== 'play') return;
    if (!document.getElementById('editor').hidden) return;
    const code = e.code;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(code)) e.preventDefault();
    if (UI.dlgOpen) { UI.dlgKey(code); return; }
    if (UI.ovOpen) {
      if (Mini.key) { Mini.key(code); return; }
      if (code === 'Escape' || code === 'KeyM') UI.closeOverlay();
      return;
    }
    Input.keys[code] = true;
    if (['KeyE', 'Space', 'Enter'].includes(code)) doInteract();
    if (code === 'KeyM' || code === 'Tab') { e.preventDefault(); if (!G.busy) Phone.open(); }
  };
  window.addEventListener('keydown', keyDown);
  window.addEventListener('keyup', (e) => { Input.keys[e.code] = false; });
  window.addEventListener('blur', () => { Input.keys = {}; });
  const scr = document.getElementById('screen');
  const stick = document.getElementById('stick'), knob = document.getElementById('knob');
  const S = Input.stick;
  const start = (e) => {
    if (G.mode !== 'play' || G.busy) return;
    Input.touch = true; document.body.classList.add('touch');
    if (S.on) return;
    S.on = true; S.id = e.pointerId; S.ox = e.clientX; S.oy = e.clientY; S.x = 0; S.y = 0;
    stick.style.left = e.clientX + 'px'; stick.style.top = e.clientY + 'px'; stick.classList.add('on'); document.body.classList.add('stick-on');
    knob.style.transform = 'translate(0,0)';
    e.preventDefault();
  };
  const move = (e) => {
    if (!S.on || e.pointerId !== S.id) return;
    const dx = e.clientX - S.ox, dy = e.clientY - S.oy;
    const d = Math.hypot(dx, dy), max = 48;
    const k = d > max ? max / d : 1;
    S.x = (dx * k) / max * (d > 8 ? 1 : 0); S.y = (dy * k) / max * (d > 8 ? 1 : 0);
    if (d > 70) { S.x *= 1.2; S.y *= 1.2; }
    knob.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
  };
  const end = (e) => { if (e.pointerId !== S.id) return; S.on = false; S.x = 0; S.y = 0; stick.classList.remove('on'); document.body.classList.remove('stick-on'); };
  scr.addEventListener('pointerdown', start);
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);
  document.getElementById('touch').addEventListener('pointerdown', (e) => { if (e.target.id === 'touch' || e.target.id === 'stickHint') start(e); });
  document.getElementById('btnA').addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); Snd.init(); if (UI.dlgOpen) { UI.dlgAdvance(); return; } doInteract(); });
  document.addEventListener('contextmenu', (e) => { if (G.mode === 'play') e.preventDefault(); });
  /* Audio bei jeder Geste wieder freigeben (Handy-Browser halten den Kontext nach Sperren/Hintergrund an) */
  document.addEventListener('pointerdown', () => Snd.init());
  document.addEventListener('keydown', () => Snd.init());
  document.addEventListener('visibilitychange', () => { if (!document.hidden) Snd.init(); });
}
window.addEventListener('load', boot);
/* Homescreen-Apps und Browser halten gern eine alte Version im Cache: version.json ohne Cache lesen und zum Neuladen auffordern */
async function checkUpdate() {
  if (!/^https?:/.test(location.protocol)) return;
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const j = await r.json();
    if (!j.v || j.v === APP_VERSION) return;
    const el = UI.toast(`Neue Version ${j.v} verfügbar – hier tippen zum Neuladen.`, 'ach');
    if (el) { el.addEventListener('pointerdown', () => location.reload(), { once: true }); setTimeout(() => el.classList.remove('out'), 400); }
  } catch (e) { /* offline */ }
}
window.addEventListener('load', () => setTimeout(checkUpdate, 2500));
