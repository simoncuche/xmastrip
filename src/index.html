<title>Wiehnachtsreisli 2026 nach Innsbruck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/*CSS*/
body:not(.touch) #btnA, body:not(.touch) #stickHint { display: none; }
body:not(.touch) #actLabel { bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); }
</style>
<div id="app">
  <canvas id="screen" aria-label="Spielwelt"></canvas>
  <div id="hud" hidden>
    <div class="hud-row">
      <div class="plate clock"><b id="hClock">08:38</b><span id="hDay">Samstag</span></div>
      <div class="plate place"><small>Standort</small><b id="hPlace">Luzern</b></div>
      <div class="plate money"><b id="hEur">0,00 €</b><span id="hChf">0,00 CHF</span></div>
      <button class="hud-btn" id="btnPhone" aria-label="Handy öffnen"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M10 18h4"/></svg></button>
    </div>
    <div class="plate stats">
      <div class="coaster" title="Bierdeckel mit Strichliste"><canvas id="coaster" width="44" height="44"></canvas></div>
      <div class="bars">
        <div class="bar" id="bEnergy">Energie<i></i></div>
        <div class="bar" id="bFood">Satt<i></i></div>
        <div class="bar" id="bMood">Laune<i></i></div>
        <div class="bar prom">Pegel <b id="hProm">0,00 ‰</b></div>
      </div>
    </div>
    <div class="plate board-strip"><span class="gl" id="boardGl">ZIEL</span><span id="boardText"></span></div>
  </div>
  <div id="touch" hidden>
    <div id="stickHint" aria-hidden="true"></div>
    <div id="stick"><div id="knob"></div></div>
    <div id="actLabel" hidden></div>
    <button id="btnA" aria-label="Aktion">A</button>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div id="dialog" hidden><canvas id="dlgPort" width="64" height="64"></canvas><div><div class="dlg-name" id="dlgName"></div><div class="dlg-text" id="dlgText"></div><div class="dlg-choices" id="dlgChoices"></div></div></div>
  <div id="overlay" hidden></div>
  <div id="editor" hidden></div>
  <div id="title"></div>
  <div id="fade"><canvas id="fadeCv" width="160" height="96" aria-hidden="true"></canvas><p id="fadeText"></p></div>
</div>
<script>
/*JS*/
</script>
